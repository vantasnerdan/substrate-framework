      (E=50.5233, wall 0.99631736). Not reproduced with named mechanisms:
      persistent negative split-channel mode (lambda_min(A) reaches the
      positive +-1.7e-8 floor from R=14; negative directions at R=12,13 are
      q-channel), bounded stability window (lower edges rise with background
