id: P247
base_release: v0.168.0
source_baseline: substrate-framework@552f2f6
canonical_issue: "178"
question: >-
  Does the accepted spectral-Cartan M5 model class supply a genuinely isolated
  fixed-J clock (asymptotically natural, finite-energy, stationary, stable,
  finite positive inertia, nonzero frequency), and if so, what leading two-body
  interaction law do two well-separated relaxed clocks obey — derived and
  measured rather than assumed Newtonian?
positive_objective: >-
  At least one isolated one-clock construction passing the issue-#178 milestone
  ladder (existence, physical stability, independent two-clock sector,
  conditioned interaction observable), promoted claim by claim; or, per failing
  candidate, a mechanism-named obstruction that redirects the candidate search.
coordination_boundary: >-
  P247 owns the post-P240 candidate comparison, isolated one-clock and
  two-clock asymptotic constructions, their importable conditional APIs/tests,
  and any new isolated-matter claim transaction; it advances #178 (and through
  it #146 and #151). It does not own #177/#174's stationary axisymmetric
  Einstein-M5 co-solve, does not rewrite immutable P239-P246 attempts, and does
  not claim electron/neutrino/Standard Model/coherent-capture phenomenology.
source_inventory:
  - source: governance/claims.yaml C-M5S-001..014
    access: in-hand repository source
    extracted: >-
      Confined census, cutoff, one-loop composition, gravity consumer, boxed
      pair interaction (repulsive d^-1.696, disjoint supports), soft-mode
      adjudication, baseline irreducibility, radiative stability, full-band
      spectrum, zero-point shift, spherical-constraint obstruction, fixed-J
      stress, horizon-penetrating initial data.
  - source: proposals/P240-m5-kinetic-axis/attempts/0041-0043 merged scripts and roots
    access: in-hand repository source
    extracted: >-
      Committed torch CPU functional (biaxial hedgehog, structural wall pin at
      rank-1 projector, potential -Tr(X^2)/2 - Tr(X^3) + (Tr X^2)^2 + 1/2,
      clock generator [n]_x, omega = 1/(2I), E_J = E_stat + 1/(4I)), Morse
      certification, R-ladder root production, independent x-space energy,
      boxed pair oracle.
  - source: PR #153 and issue #151 comments 2026-08-22 (reported attempt 0044)
    access: open URL, reproduced in issue #178
    extracted: >-
      Unmerged de-boxing verdict prose: V2 = diag(5,3,3,0,0,6)/2 local frame
      with two exactly flat shear channels; linear E(R) growth ~0.33/unit on
      R=12..18; lambda_min(A) < 0 flattening -(5+-2)e-7, Morse index 1, purely
      split-channel; stability window R in [~8,~34]; free-wall R=8 E=50.44 vs
      pinned 60.17, wall 0.99625, I 0.67638/0.67662, omega 0.73923/0.73929;
      aliasing gate (quadrature >= 4x basis order, cross-quadrature energy
      1e-6). Artifacts absent from merged commit, branch head (deleted), and
      main; used only as transfer references with frozen gates.
invariants:
  - accepted P239 spectral-Cartan action and pinned spectrum potential preserved
  - committed hedgehog conventions preserved (mostly-plus, omega=1/(2I), E_J = E_stat + J^2/(4I))
  - no accepted confined-clock claim is reinterpreted as an isolated-particle claim
  - reported 0044 numbers are transfer references; gates frozen before computation
  - aliasing gate binds every accepted root (quadrature >= 4x basis order, cross-quadrature energy reproduction to 1e-6)
  - no fitted frequency, force, or prescribed interaction law
allowed_imports:
  - C-M5S-001..014 in their stated confined and gravitational scopes
  - P240 attempts 0041/0042/0043 helper APIs and roots as committed source-audited infrastructure (P244 precedent)
  - canonical src/substrate_framework modules read-only
  - accepted Lorentz, variational, kernel, and gravity conventions already imported by P239-P246
candidates:
  - id: A_broader_sector
    description: >-
      Current-action broader-sector route: keep the accepted positive fixed-J
      construction; search the exactly potential-flat shear channels (np,
      n-a) and full angular/topological sectors and asymptotic configurations
      for the long-range carrier.
  - id: B_minimal_extension
    description: >-
      Minimal positive extension route: add the smallest local
      Lorentz-covariant structure vanishing on the complete arbitrary static
      3x3 sector yet changing isolated asymptotics or split-channel stability;
      no fitted frequency or force.
  - id: C_alternative_completion
    description: >-
      Alternative completion/topology route: a different Lorentz-covariant 4x4
      completion or topological clock sector under the same static-recovery,
      boundedness, symmetry, and parameter-economy criteria.
uniqueness_evidence: null
selection_criteria:
  - bounded Hamiltonian and regular charge-frequency map
  - local Lorentz covariance
  - exact or explicitly challenged 3x3/static recovery
  - natural finite-energy asymptotics
  - assumption and parameter economy
  - topology and symmetry fit
  - implementability
  - predictive reach
claims_proposed:
  - C-M5S-015
comparators_blinded_until: >-
  Blinding is impossible for milestone 0 (reported 0044 numbers are published
  in PR #153 / issue #151 comments); they are declared transfer references and
  all reproduction gates were frozen in memory/vantasner/proposals/
  P247-isolated-clock-two-body-law.md before this campaign computed any new
  number. No pair-force comparator exists yet; the milestone-4 field
  observable is derived before any Legendre-algebra comparison.
milestone_gates_attempt_0001:
  G1_symbolic: >-
    Exact rational second variation of the committed potential about the
    rank-1 projector background, in the local frame on the six nontrivial
    symmetric channels, equals diag(5,3,3,0,0,6)/2 exactly; the two zero
    channels are the np and n-a shears; numeric cross-check against an
    independent finite-difference Hessian of the canonical potential agrees
    to 1e-6.
  G2_ladder: >-
    Clean roots on R in {12,13,14,17,18} (plus committed 15/16 roots where
    available) pass the aliasing gate; E(R) linear-fit slope in [0.25, 0.45]
    per unit R with R^2 >= 0.999; constrained-second-variation lambda_min < 0
    at every rung; running |lambda_min| at the outermost rung in [1e-7,
    2e-6]; Morse index exactly 1 at every rung; negative direction
    split-channel fraction > 0.9 of its norm.
  G3_window: >-
    Pencil stability band edges within +-20 percent of the reported
    [~8, ~34].
  G4_free_wall: >-
    Pinned R=8 energy within 2 percent of 60.17; free-wall energy within 5
    percent of 50.44; self-selected wall amplitude in [0.98, 1.01]; inertia
    and frequency ratios free/pinned within 1e-2 and 5e-3 of the reported
    pair (0.67638/0.67662, 0.73923/0.73929).
  verdict_rule: >-
    REPRODUCED when all gates pass; MIXED with the named failing mechanism
    when some pass; NOT REPRODUCED when the headline structure (linear
    growth, persistent negative mode, bounded window, invariant clock
    sector) differs.
status: active
phase: milestone_1_persistent_growth_routing_candidate_B
revisions:
  - date: '2026-08-28'
    after_attempt: '0001'
    change: >-
      Milestone 0 complete with verdict MIXED (see attempts/0001/result.yaml).
      Reproduced: exact flat shear channels diag(5,3,3,0,0,6)/2; monotone
      no-plateau energy growth on the clean ladder R=12..18 (fitted 0.685 per
