  - date: '2026-08-28'
    after_attempt: '0002'
    change: >-
      Attempt 0002 verdict DECISIVE_NO_GO_WITH_STABILITY_RESTORATION
      (attempts/0002/result.yaml). Milestone 1 closes on the frozen
      PERSISTENT_GROWTH band: C[c] grows monotonically 461 to 1197 through
