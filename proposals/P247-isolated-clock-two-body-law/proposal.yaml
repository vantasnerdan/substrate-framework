      completion per owner direction 2026-08-28; no PR before #178 closes.
  - date: '2026-08-28'
    after_attempt: '0003'
    change: >-
      Attempt 0003 verdict DECISIVE_PER_GATE (attempts/0003/result.yaml).
      W3 SIGN_CHANGE: at order 24 the q-channel static instability is
