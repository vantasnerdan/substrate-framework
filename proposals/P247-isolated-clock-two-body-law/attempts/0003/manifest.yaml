schema_version: 1
id: P247-attempt-0003
proposal: P247-isolated-clock-two-body-law
canonical_issue: "178"
date_started: '2026-08-28'
branch: campaign/p247-attempt-0002-two-body-law
base_commit: 01f4b39a431e32f4697f496cd0983b06510bc65f
question: >-
  Attempt-0002 voided the order-16 floor claims and routed the campaign to
  candidate B with three preregistered gates (proposal.yaml next_loop). This
  attempt executes them: W1 - do the pencil stability windows computed from
  order-24 matrices restore, refute, or leave unresolved the reported 0044
  window [~8, ~34] (G3)? W3 - what is the refined (order-24) static
  instability scale lambda_min(A) on the extended ladder R = 20..30, does the
  q-channel negative mode persist, soften, or heal at large R? W2 - which
  minimal local Lorentz-covariant extension vanishing on the complete
  arbitrary static 3x3 sector is selected, on paper under the frozen
  structural criteria, as the candidate-B construction for attempt 0004?
small_ratio_skill_bindings:
  error_budget: >-
    Measurement. Per W3 rung: quadrature gauge = |lambda_min(A_doubled(216,72))
    - lambda_min(A_primary(108,36))|; roundoff = jitter spread at scales
    1e-13 and 1e-11 (3 draws, seed 20260828); root certification = relative
    gradient < 1e-10 and aliasing gap < 1e-6 at doubled quadrature. Verdicts
    use the summed budget with a 10x margin. Per W1 edge: quadrature gauge on
    the edge = |edge_primary - edge_doubled| from window recomputation at
    doubled matrices.
  zero_mode_gauge: >-
    Adapted, as adjudicated pre-execution in attempt 0002: the exactly flat
    np/na directions lie OUTSIDE the restricted 3-channel modal family, so
    there is no in-family zero mode to gauge with. The floor gauge is the
    quadrature gauge plus the ansatz-background restricted spectrum (recorded
    in attempt 0002 g6 for orders 16/20/24), and for W1 additionally the
    primary-vs-doubled edge shift. Claims are scoped to values above this
    gauge.
  eigenpair_residuals: >-
    Measurement. softest relative residual ||H v - lambda v||/|lambda| and
    pre-symmetrization asymmetry ||H - H^T|| recorded for every quoted
    lambda_min and lambda_2 (committed soft_metrics protocol).
  lambda_min_over_lambda_2: >-
    Measurement. Quoted with every verdict row; a lambda_min within three
    orders of lambda_2 is labeled soft regardless of sign.
  observed_order_extrapolation: >-
    Explicit scoping. W3 quotes order-24 values with budgets and the R-trend;
    NO basis-order continuum extrapolation is claimed (that was attempt
    0002's three-order protocol; a single order supports sign-above-budget
    claims only). W1 compares order-16 and order-24 edges as a two-point
    shift with its own gauge; no extrapolated edge is quoted.
  jitter_sign_test: >-
    Measurement. Every W3 sign call must hold under both jitter scales with
    3 draws (seed 20260828); a sign that moves is recorded unresolved.
gates:
  W1_pencil_windows_order24:
    backgrounds: 'order-24 re-solved roots at R in {12, 14, 18, 24}'
    provenance: >-
      R = 12, 14, 18 seeded by least-squares Chebyshev reprojection of the
      attempt-0001 clean-ladder order-16 roots (exact for order >= 16);
      R = 24 seeded from a fresh order-16 continuation root regenerated by
      the committed continuation_scan protocol (relgrad 1e-10, alias 1e-6).
    matrices: 'A = d^2 V, D = d^2 (C + Phi) at (108,36) primary and (216,72) doubled'
    scan: 'f(R) = lambda_min(sym(A + R^-4 D)) on [5, 60] at 1101 points; brentq edges xtol 1e-10 (committed window_edges semantics, unchanged)'
    comparison: >-
      order-16 windows from attempts/0001/stability-window.json (same
      machinery) and the reported 0044 reference [8, 34] +- 20 percent
      (frozen G3 gate, REPORTED in debox_common).
    self_consistent_band: 'over inner backgrounds {14, 18, 24}: [max lower edge, min upper edge], committed convention dropping the smallest-radius background'
  W3_lambda_min_ladder_order24:
    rungs: 'R in {20, 22, 24, 26, 28, 30}, order-16 roots regenerated by the committed continuation protocol, reprojected and re-solved at order 24'
    metrics: 'lambda_min, lambda_2, ratio, softest residual, asymmetry, doubled-grid gauge, jitter, channel fractions of the softest eigenvector (q/tangent/split per the attempt-0002 decomposition)'
  W2_candidate_B_enumeration:
    scope: >-
      All local Lorentz-covariant terms through O(X^4) and O(partial^2) that
      vanish identically on the complete arbitrary static 3x3 sector
      (X_{0 mu} = 0, d_t = 0, arbitrary static 3x3 profile), enumerated on
      paper with sympy property checks; scored under the frozen proposal
      selection criteria; exactly one minimal extension selected for attempt
      0004 or NO_VIABLE_TERM recorded.
interpretation_frozen_before_execution:
  W1_bands:
    - >-
      RESTORED_ORDER24: the self-consistent band lies within +-20 percent of
      [8, 34] at order 24 AND every primary-vs-doubled edge shift is below
      the W1 edge gauge threshold (2.0 in R units). G3 flips to restored at
      refined resolution; the 0044 window claim is rehabilitated in magnitude
      and the attempt-0001 upper-edge-unbounded conclusion is recorded as
      order-16-resolution-limited.
    - >-
      REFUTED_ORDER24: a band is computed but fails the gate at order 24 with
      edges above the gauge. G3 stays refuted with the refined numbers named;
      candidate B carries both the stability and the asymptotic burden.
    - >-
      UNRESOLVED_EDGES: any edge's primary-vs-doubled shift >= 2.0. Escalate
      that background's matrices once to (144, 48)/(288, 96); final values
      then decide RESTORED vs REFUTED; if still unresolved the background is
      recorded unresolved and excluded from the band with the mechanism named.
    - >-
      OWN_RADIUS_BREAK: f at a background's own radius < -budget at order 24
      where it was positive at order 16. The window interpretation itself is
      then resolution-limited; record and treat W1 as unresolved with the
      mechanism named.
  W3_bands:
    - >-
      NEGATIVE_PERSISTENT: lambda_min(A) < -10x summed budget at every rung
      R = 20..30. The q-channel static instability persists across the
      extended ladder; record |lambda_min|(R) (softening vs hardening) as
      candidate-B design input.
    - >-
      SIGN_CHANGE: the sign differs between rungs with both ends above
      budget. Locate the crossing by bisection at order 24 with the aliasing
      gate on interpolated roots; record R_c and the confined-instability
      band; G3 partially reopens (large-R stability restored) and W2 scoring
      weights asymptotics over local stability.
    - >-
      BUDGET_FLAT at any rung: |lambda_min| <= 10x summed budget. One-order
      escalation (order 28, nodes scaled x1.2, alias x2) preregistered for
      that rung only; if still flat the rung is recorded unresolved.
  W2_bands:
    - >-
      SELECTED: at least one enumerated term passes sector-vanishing (sympy
      check), boundedness-below (analytic argument), parameter economy
      (<= 1 new continuous parameter), natural-asymptotics (changes the clock
      far-field from the committed algebraic growth toward Yukawa-type
      localization or otherwise cures the E(R) growth mechanism), and
      implementability (expressible in the x-space modal machinery without
      new solver classes). Record the selected term and its design burden.
    - >-
      NO_VIABLE_TERM: every term fails at least one frozen criterion. Record
      the failure table; route to candidate C or report the mechanism-named
      obstruction and keep the objective open.
method: >-
  Continuation of provenance roots with committed machinery only
  (solve_radial_1d, xspace_energy, debox_common.component_hessians); torch
  float64, torch.set_num_threads(1), OMP_NUM_THREADS=1; canonical modules
  read-only; all roots accepted only under relgrad 1e-10 + aliasing 1e-6;
  stdout captured into this directory on first execution.
environment:
  python: system python3
  torch: 2.3.0.post301
  numpy: 2.5.1
  scipy: 1.18.0
  sympy: 1.14.0
non_goals:
  - no PR before issue-#178 completion (owner direction 2026-08-28)
  - no candidate-B numerics in this attempt (enumeration and selection only; construction and verification are attempt 0004)
  - no reinterpretation of the committed E(R) = R^3 V + (C + Phi)/R decomposition or window semantics
  - no new fitted constants; any extension parameter is a scale to be fixed by a stated convention, not fitted to a comparator
  - no edits to canonical src/substrate_framework modules or earlier attempts
