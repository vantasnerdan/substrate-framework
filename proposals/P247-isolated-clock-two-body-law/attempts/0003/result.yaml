  mechanism: >-
    No universal band exists: the lower edge tracks the background, so a
    single [~8, ~34] interval containing all backgrounds is refuted at
    refined resolution. The reported upper edge ~34 IS rehabilitated
    (finite, in-gate) for the inner backgrounds; the reported lower edge
