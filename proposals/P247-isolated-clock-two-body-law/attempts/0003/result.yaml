headline: >-
  At refined (order-24) resolution the q-channel static instability is
  CONFINED to small radii and heals: lambda_min(A) = -2.08e-9 at R = 20
  (q-dominated, 74 percent) flips positive by R = 22 and settles at the
  +5e-10 split-channel near-null floor through R = 30 (crossing in
  (20, 22); bisection is the named follow-up). The reported 0044 universal
  stability band [~8, ~34] remains REFUTED at refined resolution: windows
  are background-relative (lower edge ~ 0.77-0.80 x R_own, upper edge
  finite for R <= 18), the self-consistent band [19.20, 29.96] fails the
  frozen +-20 percent gate at the lower edge while the upper edge is
  within gate. Candidate B is SELECTED on paper: the boost-alignment mass
  s_m = (m^2/2)((u^T eta xi)^2 - 1), zero new continuous parameters
  (m^2 = Lambda^2 per C-M5S-002), exact static-sector survival,
  isorotation-invariant, machine-checked.
