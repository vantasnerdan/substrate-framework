addendum_component_decomposition:
  command: component_decomposition.py > g2b-component-decomposition-stdout.txt
  method: >-
    x-space radius-free components of each persisted clean root:
    E(R) = R^3 V[c] + (C[c] + Phi[c])/R; component sums reproduce E_total
    exactly at every rung.
  table:
    - {R: 12, V: 9.425933e-03, R3V: 16.288012, C_over_R: 38.420974, Phi_over_R: 0.395197}
    - {R: 18, V: 3.036313e-03, R3V: 17.707775, C_over_R: 41.091949, Phi_over_R: 0.446491}
  finding: >-
    The growth is curvature-class: C[c] itself grows (461 to 740) so C/R
    rises, while the potential bulk coefficient V[c] falls from 9.4e-3 to
    3.0e-3. Whether C saturates at larger R, opening a finite-energy limit,
    is the milestone-1 question preregistered as attempt 0002.
  roots_note: >-
    First ladder run did not persist root coefficients; the rerun
    (g2-ladder-rerun-stdout.txt) reproduces every reported digit of the first
    run under pinned-thread determinism and persists values in
    clean-ladder.json rows.
