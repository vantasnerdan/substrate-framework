headline: >-
  The linear boost source vanishes EXACTLY (machine precision, confirmed by
  numeric central derivative) for BOTH co-aligned and fixed-axis boosts on
  the symmetric one-clock background: the one-clock source is parity-odd on
  mu-symmetric roots, so the chi equation of motion about chi = 0 is
  homogeneous - chi = 0 is the unique small solution and the
  boost-alignment mass cannot localize the symmetric fixed-J clock at any
  order. This is a mechanism-named one-clock no-go for the entire
  B-family in the reduced class. The mechanism itself redirects
  positively: a CLOCK PAIR breaks the parity and sources the massive boost
  field between the clocks - the interaction-law milestone has a live
  route (F_pair_exchange), and the one-clock route reopens through
  symmetry breaking by the clock itself (G_fixed_axis_rotor).
