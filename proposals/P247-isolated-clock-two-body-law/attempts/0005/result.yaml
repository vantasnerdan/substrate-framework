mechanism:
  parity_argument: >-
    the fixed-J root is mu-symmetric (director-radial hedgehog, spherically
    symmetric isorotation); the boost source contraction is parity-odd
    under mu -> -mu for any FIXED boost axis, and pointwise zero for the
    co-aligned axis; either way the integrated linear source vanishes on
    the symmetric one-clock sector
  consequence_one_clock: >-
    the chi EOM about chi = 0 is homogeneous (s_m and sigma are quadratic;
    the mixed clock-boost contraction is parity-odd): chi = 0 is the exact
    unique small solution - no boost tail can form around the symmetric
    one-clock, so the boost mass cannot cure one-clock isolation in this
    reduction at any order in the tail amplitude
  consequence_pair: >-
    a two-clock configuration at finite separation breaks mu-parity: the
    linear source no longer cancels and each clock sources the massive
    boost field in the other's direction - the massive exchange channel
    (Yukawa-type, decay 1/Lambda) is LIVE for the interaction-law
    milestone, with the small-ratio-numerics asymptotic-matching
    prescription applying directly (tail amplitudes carried in log space;
    pairing evaluated analytically; full two-body run only as a
    sign-and-coefficient check)
  sigma_sign_observation: >-
    at finite chi the truncated sigma Hamiltonian evaluates negative
    (-3.28e-1 at amplitude 0.05) - the spatial-diameter truncation of the
    sigma term is not the positive Legendre density; any D2-type
    construction beyond linear response must first restore the proper
    covariant Hamiltonian completion. Recorded as a reduction defect, not
    a model defect.
