claims:
  - id: C-M5S-015
    statement: >-
      C-M5S-015 (numeric evidence; de-boxing adjudication, confined-branch
      scope): In the committed P240 model class — the biaxial-hedgehog
      reduction of the accepted spectral-Cartan action at basis order 16 with
      the structural wall pin and the fixed-J Legendre step E_J =
      E_stat + J^2/(4 I) — the de-boxed limit of the confined fixed-J clock
      branch is not a finite-energy stationary isolated object: along the
      clean aliasing-gated root ladder R = 12, 13, 14, 15, 16, 17, 18 (all
      roots at relative gradient <= 5.3e-14 with doubled-quadrature energy
      transfer <= 1.3e-10) the total energy increases monotonically from
      55.1042 to 59.2462 with fitted growth 0.685 per unit R (R^2 = 0.9984,
      visibly concave) and no plateau. The exact potential second variation
      about the rank-1 projector background is diag(5,3,3,0,0,6)/2 in the
      local frame with exactly flat np and na shear channels (exact rational
      derivation, Richardson cross-check < 1e-9). On the de-boxed backgrounds
      the potential-curvature operator A = d^2 V has lambda_min = -1.8751e-06
      (R=12) and -7.8309e-07 (R=13) — where its negative direction is
      q-channel dominated (split fraction 0.0025, 0.0029 under the committed
      fraction convention) — and reaches the positive +-1.7e-8 resolution
      floor from R=14 onward with Morse index 0 and a split-channel near-null
      direction (fraction 0.969-0.99997). The pencil-stable region on the
      R>=14 backgrounds is unbounded above, and freeing the wall value at
      R=8 converges to a stable minimum E = 50.5233 with self-selected wall
      value 0.99631736, inertia ratio 0.9999963 and frequency ratio
      1.0000037 relative to the pinned root E = 50.52966035. Therefore the
      binding obstruction to an isolated clock in this model class is the
      without-plateau energy growth, not a stability obstruction: no accepted
      or reproduced evidence shows a persistent negative split-channel mode,
      a bounded stability window, or a significant pinning cost on the
      de-boxed backgrounds.
    verification: numeric_evidence
    dependencies: [C-M5S-005, C-M5S-006, C-M5S-008]
    exclusions:
      - Scope is the committed radial biaxial-hedgehog model class at order 16 with the structural wall pin; no statement is made about other sectors of the accepted P239 action, about gravity-coupled extensions, or about candidate routes B or C.
      - The +-1.7e-8 floor is the eigenvalue resolution of the order-16 operator at certification quadrature; continuum signs below that floor are unresolved, and the claim asserts flatness-to-floor, not exact positivity.
      - The interaction law between two clocks is not addressed; the boxed C-M5S-008 repulsive interaction and the open de-boxed interaction question are unaffected.
      - The unreproducible reported 0044 references (persistent negative split-channel plateau, bounded [8,34] window, pinned 60.17) are history-side adjudication records in proposals/P247-isolated-clock-two-body-law/attempts/0001/, not accepted claims.
    evidence:
      - proposals/P247-isolated-clock-two-body-law/attempts/0001/result.yaml
      - proposals/P247-isolated-clock-two-body-law/attempts/0001/g1-curvature.json
      - proposals/P247-isolated-clock-two-body-law/attempts/0001/clean-ladder.json
      - proposals/P247-isolated-clock-two-body-law/attempts/0001/stability-window.json
      - proposals/P247-isolated-clock-two-body-law/attempts/0001/free-wall.json
      - proposals/P247-isolated-clock-two-body-law/attempts/0001/backgrounds.npz
