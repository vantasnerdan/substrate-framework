id: P228
base_release: v0.159.0
base_commit: 62bb785ec3e10a97b60c01798dfedd10e4dde4c9
source_baseline: substrate-framework@62bb785ec3e10a97b60c01798dfedd10e4dde4c9
question: >-
  Can a controlled local 3+1 network built from the translational zero modes of
  sine-Gordon kink walls derive a symmetric collective field, a healthy
  massless helicity-two low-energy sector, its gravitational normalization,
  the GR completion under explicit theorem premises, and controlled static
  plus radiative predictions from one sine-Gordon source?
invariants:
  - The accepted dimensional sine-Gordon action, positive coefficients, mostly-plus conventions, exact stress, and physical scales remain fixed.
  - A scalar ell=2 observable, STF moment, TT projection, symmetric strain, and massless spin-two gauge field remain distinct typed objects.
  - The microscopic model must be local in 3+1 dimensions and contain explicit transverse dynamics; a collection of uncoupled 1+1 channels is insufficient.
  - The collective tensor must be reconstructed from implemented microscopic variables with compatibility conditions; an arbitrary tensor or coframe cannot be supplied.
  - Gauge constraints, physical polarizations, kinetic signs, dispersion, and cutoff corrections must follow from an implemented Hessian or constraint system rather than declared counts.
  - Desired Fierz-Pauli, Einstein, or TEGR coefficient ratios and Newton coupling cannot enter candidate selection or microscopic inputs.
  - The microscopic cutoff may break Lorentz invariance, but the low-energy limit must expose and bound the correction while evading the exact-covariance premise of Weinberg-Witten.
  - One derived coupling and one conserved sine-Gordon source must feed both a controlled exterior static prediction and the full-retardation radiative prediction.
  - Artifact merge, scientific claim promotion, and issue completion remain independent decisions.
allowed_imports:
  - C-MED-003 dimensional sine-Gordon action and scales
  - C-SG-001 C-SG-002 C-SG-009 C-SG-012 C-SG-017 and C-SG-018 at their accepted ceilings
  - C-PDE-001 C-PDE-003 C-PDE-004 C-PDE-009 and C-PDE-012 as accepted 3+1 scalar and transverse-mode controls
  - C-MOM-001 C-MOM-002 C-GW-001 C-GW-002 C-GW-004 C-GW-005 and C-GW-008 at their exact conditional ceilings
  - C-GRV-001 as the dimensional and hidden-baseline warning for any proposed Newton coupling
  - Landed exact symbolic dimensional stress canonical fiber source teleparallel geometry linearized-Einstein and full-retardation source APIs
  - Deser arXiv:gr-qc/0411023 only as an explicit nonlinear self-coupling theorem whose locality gauge current and universal-coupling premises must be mapped
  - Gu and Wen arXiv:0907.1203 only as external candidate and constraint-mechanism evidence with its L-type k-cubed and N-type reliability ceilings preserved
  - Itin Hehl and Obukhov arXiv:1611.05759 only as a supplied-coframe teleparallel equivalence theorem after a genuine collective field exists
  - Standard exact kink translation-mode integration spherical-design identities linear algebra and periodic-lattice Fourier analysis with all normalizations derived
  - SymPy exact algebra and NumPy or SciPy only for obligations without a tractable exact route
candidates:
  - id: A
    description: >-
      Build six intersecting icosahedral families of 3+1 sine-Gordon kink walls
      at one-wall-per-ell density; use their translational zero modes as local
      directional strains, reconstruct a symmetric tensor by exact tight-frame
      inversion, and test whether local volume and force-balance registry
      constraints leave a positive linearly dispersing TT sector.
  - id: B
    description: >-
      Lift the accepted radial 3+1 sine-Gordon scalar and its regular ell=2
      perturbations directly into a collective strain or STF field, then test
      whether the result is only scalar or elastic kinematics rather than an
      independent spin-two gauge mode.
  - id: C
    description: >-
      Repair the compact coframe plaquette route by deriving plaquette variables
      as actual curls of common links, enforcing the discrete Bianchi identity,
      and obtaining its low-energy Hessian without supplying the TEGR matrix or
      its eigenweights.
  - id: D
    description: >-
      Adapt the compact symmetric-tensor constraint mechanism of Gu and Wen to
      sine-Gordon phase variables, preserving the published distinction between
      the reliable k-cubed L-type sector and the uncontrolled linearly
      dispersing N-type claim.
uniqueness_evidence: evidence/candidate-comparison.yaml
selection_criteria:
  - accepted invariant convention and source compatibility
  - genuine local 3+1 transverse microscopic dynamics
  - implemented microscopic to collective tensor map and compatibility
  - derived gauge constraint rank physical nullity kinetic sign and dispersion
  - no desired GR TEGR polarization count or Newton coupling in candidate inputs
  - assumption parameter and imported-theorem economy
  - isotropy Lorentz low-energy limit dimensions stability and cutoff correction control
  - universal source coupling and one-source static-radiative composition
  - mutation-sensitive verification independent rederivation and downstream replay cost
claims_proposed:
  - C-EGR-009
  - C-EGR-010
  - C-EGR-011
  - C-EGR-012
comparators_blinded_until: >-
  The microscopic wall-network action, exact orientation frame, collective map,
  constraint system, most-general quadratic coefficient solve, physical-mode
  Hessian, scale ledger, and candidate decision are frozen. Observed Newton
  coupling, benchmark gravitational outputs, and the closed P226/P227 numeric
  predictions remain excluded from derivation and selection.
status: in_review
