campaign: P228
sources:
  - citation: Deser, Self-Interaction and Gauge Invariance, arXiv:gr-qc/0411023
    url: https://arxiv.org/abs/gr-qc/0411023
    imported_result: >-
      A local consistent massless spin-two field coupled to its own conserved
      current iterates to the nonlinear Einstein theory.
    premises_mapped:
      linear_massless_spin_two_field: C-EGR-010
      local_collective_regime: C-EGR-009 and the k*ell small limit in C-EGR-010
      conserved_universal_source: declared assumption of C-EGR-011
      gauge_current_self_coupling: declared assumption of C-EGR-011
    forbidden_overreach: >-
      The theorem does not derive universal matter coupling, exact microscopic
      Lorentz invariance, the wall constraints, or ultraviolet completion.
  - citation: Gu and Wen, Emergence of helicity +/-2 modes, arXiv:0907.1203
    url: https://arxiv.org/abs/0907.1203
    imported_result: candidate-control evidence only
    source_ceiling: >-
      The reliable L-type construction has omega proportional to k cubed. The
      N-type linear-dispersion argument is explicitly limited by noncommuting
      constraint and kinetic terms and strongly coupled modes.
    forbidden_overreach: The N-type linear spectrum is not imported as a controlled result.
  - citation: Itin, Hehl, and Obukhov, Premetric teleparallel theory, arXiv:1611.05759
    url: https://arxiv.org/abs/1611.05759
    imported_result: comparator context only
    source_ceiling: >-
      Local Lorentz restrictions on a genuine coframe field strength select the
      GR-equivalent teleparallel constitutive structure.
    forbidden_overreach: >-
      A supplied constitutive matrix or independent phase channels are not
      treated as a derived coframe curl.
weinberg_witten_boundary:
  statement: >-
    P228 claims only a long-wavelength relativistic cone. Its explicit lattice
    correction exposes preferred-frame ultraviolet structure, so it does not
    assume the exact microscopic Lorentz-covariant stress premise that would
    trigger a direct Weinberg-Witten contradiction.
  status: declared_scope_boundary_not_a_constructive_theorem
