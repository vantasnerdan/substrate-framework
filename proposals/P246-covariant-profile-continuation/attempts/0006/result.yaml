mechanism: >-
  The usable coupling is G=1/[B+Delta0*(1-6xi)]. A larger positive inverse
  coupling weakens gravity. Near-conformal cancellation is not a continuous
  weak-gravity escape.
consequence: >-
  Candidate C supplies a mathematically controlled continuation seed only at
  large negative xi, not near +1/6. Candidate D supplies a regular seed only by
