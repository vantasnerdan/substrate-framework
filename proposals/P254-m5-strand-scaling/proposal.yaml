id: P254
schema_version: 2
base_release: v0.183.0
source_baseline: substrate-framework@9032348018fd03c921d819dc660e85587a832bce
question: >-
  For a regular straight transverse-pair strand with fixed exterior spectrum,
  which assumptions yield a sharp reduced tension bound and why do the
  spectral-eigenvalue and trace-power potentials produce different small-split
  powers, without asserting a free stable charge or pair confinement?
candidate_universe:
  scope: >-
    Exact radial fixed-director theorem across the two post-September-14 M5
    potentials, including only the declared positive spatial curvature sector.
    The user's broader discussion #186 harvest remains open through #211.
  frozen_from:
    - 'User request to harvest discussion #186 since comment 18303935'
    - 'Discussion comments 18581233, 18583989, 18601274 and pinned script sources'
    - 'Release v0.183.0 and explicit action/normalization differences'
  route_families: ['matrix-derived radial Bogomolny square completion']
  append_only_expansions: []
obligation_graph:
  nodes:
    - id: radial-theorem
      positive_intent: >-
        Construct a reusable exact tension bound for both potential laws from
        the defining matrices, with a witness that the frozen bound is not a
        lower bound on the full unrestrained action.
      requires: []
      pass_licenses: [radial-result]
      does_not_license:
        - 'A stable full 3D defect, stationary ring, mass calibration or two-charge confinement'
        - 'Equality of the two different action/norm/potential choices'
      maximum_verdict: symbolic_verified
      failure_scope: 'Only the pinned regular radial transverse-pair chart'
      unlocks: []
      status: established
      license_chain:
        object: 'Straight half/full transverse-pair line in a fixed director chart'
        symmetry_or_conservation: 'Pair director n is a line; 2k is an integer so M is single-valued'
        ensemble: statics
        variational_functional: >-
          T=2 pi int rho dr [A m² (b b_r/rho)² + V(b)] with m=2k and
          separately matrix-derived A and V for each of two declared actions
        admissible_space: >-
          b>=0, b(0)=0, b(infty)=b0, where b0=beta/2 (spectral) or
          b0=delta/2 (trace); fixed pair mean and other diagonal slots,
          absolutely continuous q=b² in s=rho²/2, finite-energy exterior
        representation_coverage: >-
          Radial/pair chart only; no director tilt, time-space entries,
          floating axis value, 3D curvature, or two-body relaxation
        observable: 'Tension per unit length above its chosen vacuum, not particle mass or pair force'
        numerical_representation: 'None for the theorem; source lattice data only checks applicability'
        permitted_verdict: symbolic_verified
