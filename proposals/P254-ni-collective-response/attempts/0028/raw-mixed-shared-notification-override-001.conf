[Service]
ExecStopPost=
ExecStopPost=/usr/bin/python3 -c 'import os,json;from pathlib import Path;r=os.environ.get("SERVICE_RESULT","unknown");e=os.environ.get("EXIT_STATUS","unknown");tag="dft-hung" if r in ("timeout","watchdog") else "dft-done" if r=="success" and e=="0" else "dft-fail";p=Path("/var/tmp/p254-a28-loaded-raw-mixed-shared-003")/"unit-outcomes";p.mkdir(exist_ok=True);v=dict(unit="p254-a28-loaded-raw-mixed-shared-001.service",invocation=os.environ.get("INVOCATION_ID"),service_result=r,exit_code=os.environ.get("EXIT_CODE"),exit_status=e,tag=tag,scientific_acceptance_claimed=False);f=p/(str(v["invocation"])+".json");f.write_text(json.dumps(v,indent=2)+chr(10));print("["+tag+"]",json.dumps(v),flush=True)'
