positive_objective: Audit the complete P251 campaign against its exact accepted claims and Federico Comparsi's
  broader nonlinear rotational-Euler objective, identify concrete mathematical or evidential mistakes
  without assuming them, and publish a sourced discussion with executable completion routes and honest
  uncertainty.
source_inventory:
- Pinned P251 proposals/attempts0001..0271, accepted C-CST-008..018 and preserved original001..007 routes
- Issue198/200 primary comments; current user quoted Federico requests
- 'Vikulin exact intended source: clarification requested; primary-source candidates discovered before
  attribution'
- EPS vortex-tube existence and geometrically nonlinear Cosserat primary literature
invariants:
- Source quantifiers and declared hypotheses preserved
- Independent equation-level audit; model label and review count do not establish truth
- No assigned constitutive targets silently promoted to autonomous Euler coefficients
- Failed attempts and immutable adjudications preserved
allowed_imports:
- Accepted registry as the pinned state under audit, not immunity from counterevidence
- Primary mathematical literature with hypotheses verified
- SymPy exact algebra and source-derived counterexamples; no empirical comparator fitting
- Small-ratio skill when auditing numerical force/spectrum/energy evidence
candidates:
- id: A
  description: Independent source-level reconstruction of each load-bearing implication and its strongest
    positive claim
- id: B
  description: Exact counterexample, admissibility or scaling audit that exposes a false-green claim or
    unproved transfer
- id: C
  description: Reformulate missing closure as nonlinear finite-rotation reduction, well-prepared homogenization
    or explicit-memory dynamics
selection_criteria:
- Exact target and quantifier fidelity
- Correct equations, invariants, signs, function spaces and uniform estimates
- Source-derived coefficients and actual observations rather than fitted target forms
- Constructive strongest-positive verdict with explicit repair or continuation
- Clear separation between theorem proof, implementation checks and nonlinear scientific goal
