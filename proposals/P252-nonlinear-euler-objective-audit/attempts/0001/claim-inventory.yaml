- id: C-CST-008
  statement: "Fix rho>0 and a nonzero curl eigenvalue lambda. Within the declared\nstationary finite-variance\
    \ isotropic Gaussian Beltrami law, there is a\npositive-density stationary marked selection of actual\
    \ invariant knotted\nvortex-tube neighborhoods with finite volume and a continuous ambient\ncomplement.\
    \ On a uniformly bounded good-patch event one can construct\nsmooth compact isovortical core/reaction\
    \ fields Q,S wholly inside each\ntube, whose full-space induced velocities are also compact, with:\n\
    \n    core_angle(Q)=1, core_angle(S)=0,\n    Omega(Q,S)=B!=0,\n    H=[[Hq,N],[N,P]] positive definite,\n\
    \    G(Q)=(B^2/P)n, G(S)=0, L(Q)=0, L(S)=B n.\n\nHere G=rho integral r cross xi and L=rho integral\
    \ r cross v_xi are\ndifferent measured moments, Omega is the Euler KKS form, and H is the\ncomplete\
    \ isovortical second variation of Euler kinetic energy. Every\nquantity is constructed from actual\
    \ field jets, compact profiles and\nEuler integrals. No core mass, locking constant or desired frequency\
    \ is\nsupplied. The core angle is a normalized local vorticity-direction\nobservation. It is not asserted\
    \ to be a global compact symmetry action.\n\nThe same event supports additional zero-G/zero-L compact\
    \ pairs with\npositive reduced stiffness/inertia ratio above any prescribed finite\nbound. Their supports\
    \ can be made disjoint, so the full H/KKS locality\nused for their reaction blocks is exact. Finite\
    \ radii, profile norms,\npositive margins, laws and number densities are declared geometric\ninputs;\
    \ no universal five-scalar filament formula is claimed."
