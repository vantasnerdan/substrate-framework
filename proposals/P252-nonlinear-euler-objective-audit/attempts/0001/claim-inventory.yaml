    \ two carrier\nderivatives and a fixed positive stationary material tag with\ndisplacement and mechanical-spin\
    \ rows through that order.\n\nFor positive probabilities w_1+w_2=1, prepare the same initial\nphysical\
    \ scalar angle/rate (q0,r0) with signed amplitudes\nA_r(p)=a_r+d_r(p-p_r). Set b_r=nu_r'', j_r=M_raw,r/3>0,\n\
    h_r=j_r A_r\xB2, J0=sum w_r h_r, J2=sum w_r h_r'', evaluated at\nthe reference carriers. Normalization\
    \ and variance cancellation give\n\n  w_1 a_1=-v_2\xB2/(v_1\xB2-v_2\xB2),\n  w_2 a_2= v_1\xB2/(v_1\xB2\
    -v_2\xB2).\n\nFor any declared finite preparation curvature B_*>0, the equations\n\n  sum w_r(a_r\
    \ b_r+2d_r v_r)=B_*,\n  sum w_r[h_r(v_r\xB2+nu b_r)+2nu h_r' v_r]=J0 nu B_*\n\nuniquely determine\
    \ finite slopes d_1,d_2. Their determinant is\n8nu w_1w_2v_1v_2(j_2a_2-j_1a_1), which is nonzero.\
    \ Actual\nmode-mass derivatives remain in h_r'; signed amplitudes are squared\nin the inherited positive\
    \ phase and physical energy, not treated\nas probability weights.\n\nThe actual time-reversed circular\
    \ modes are paired with tilt axis\nn perpendicular to carrier t: Theta_s=n theta+s(t cross n)theta_t/nu.\n\
