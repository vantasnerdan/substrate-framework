- id: C-CST-012
  statement: "For positive Psi, lambda and density rho, let\npsi=Psi sum_j cos(b_j.x), where the three\
    \ planar wavevectors have\nlength lambda and sum to zero. On their triangular periodic cell,\nu=(J\
    \ grad psi,0) is an actual smooth stationary Euler array with\nfull-cell velocity covariance C_v=3\
    \ Psi^2 lambda^2 I/4. Its\nzero-axial-wavevector horizontal linear Euler group is uniformly\nbounded\
    \ in L2 vorticity on the real vector isotypic sector under\nsixty-degree rotations, including its\
    \ translation kernel.\n\nThe entire first-shell Arnold complement has lower bound 2/3.\nBounded centered\
    \ coordinates on the actual invariant separatrix\npolygons give conserved adjoint translation rows\
    \ with nonzero\nmatrix lambda^2*(-Psi)*[[0,1],[-1,0]]. Together these control\nthe complete excited\
    \ group, without a transport-frequency gap.\n\nFor axial Bloch k approaching zero, actual common-velocity\
    \ V0\nand Kelvin-prepared displacement X0 Euler histories satisfy\n\n  m(t)=cos(|k| c_b t)V0-|k| c_b\
    \ sin(|k| c_b t)X0\n       +O_T(|k|/lambda)(|V0|+|k X0|),\n  c_b=sqrt(3)*Psi*lambda/2,\n\nuniformly\
    \ on every fixed slow window 0<=t<=T/|k|, after the\ndeclared background nondimensionalization, with\
    \ the corresponding\nmatrix-sine estimate for |k|X. Here m is the complete Euler\nhorizontal velocity\
    \ mean and X_t=m, X(0)=X0. Full pressure,\nhorizontal return, vertical flow and separatrix contributions\n\
    remain. The compensated current p_c=m+ik<r Z> differs from m\nby the controlled remainder; its derivative,\
    \ not a derivative\ninferred from uniform closeness of m, licenses the slow action.\n\nThe same material\
    \ action has exact initial symplectic pairing\nrho X0.V0, zero displacement-displacement pairing,\
    \ and initial\ndisplacement stiffness rho k^2 lambda^2 C_v/(lambda^2+k^2).\nThe complete moving action\
    \ in the actual compensated-current\nslow chart has leading mass rho and stiffness rho k^2 C_v,\n\
    with O(|k|/lambda) normalized corrections. Common-V has its\nspecified initial circulation variation;\
    \ prepared-D is fixed-\nKelvin. Each trajectory transports its own circulation data.\n\nThis is an\
    \ analytic actual-Euler acoustic-window theorem, not a\nfitted oscillator, sampled spectrum or assumed\
    \ group bound.\nNonlinear amplitude can be chosen last on each finite window;\nno k-uniform nonlinear\
    \ amplitude or infinite-time nonlinear\nstability is asserted. The integrated velocity X is not silently\n\
    identified with a marked material centroid. Constant-curl lifting,\nnonaxial wavevectors, isotropic\
    \ optical joining, EPS topology and\nthe full autonomous Euler-to-Cosserat continuum remain distinct\n\
    constructions, not conclusions of this planar theorem."
