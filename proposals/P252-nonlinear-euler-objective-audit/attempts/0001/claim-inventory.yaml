- id: C-CST-011
  statement: "Fix positive constant density rho, curl parameter lambda and core\nspeed U. For each fixed\
    \ finite optical time window, sufficiently\nhigh but finite carrier admits a finite-action two-phase\
    \ Kelvin-\nprepared packet of actual smooth incompressible Euler histories on\na stationary constant-curl\
    \ background with a robust unknotted\nmaterial vortex torus. The packet occupies that same tube and\
    \ its\ncomplete velocity/pressure tails are retained.\n\nThere is one fixed nonnegative transported\
    \ material tag whose angle\nis the registered average of its physical material-sheet quadrupole\n\
    angles, relative to those same sheets in the unperturbed flow. Its\nspin is its literal total angular\
    \ momentum about its actual centroid,\nprojected on the registered axis. The actual moving two-phase\
    \ action\nhas positive mass and retains every time and parameter connection.\nWith delta_*=sqrt(lambda/p_*),\
    \ Omega=lambda*U/2, the n=8 construction\nand fixed positive marker/packet length ratio c give\n\n\
    \    p_*^2 partial_p^2 gamma^2\n      = a^2 sqrt(2) Omega^2 delta_*/3\n        + O_T(Omega^2 delta_*^2\
    \ polylog),  a=1/(1+c^2).\n\nThe full finite KKS is the squared-envelope integral of the actual\n\
    fiber KKS, not an assigned fiber length. Literal tagged spin matches\nthe registered action momentum\
    \ row through two scaled carrier jets\nwith relative O_T(delta_*^2 polylog) error, for eta=1 or a\
    \ predeclared\neta=1/2 row normalization. The latter does not assert construction of\na counterpropagating\
    \ standing pair. Exact finite material-moment\nequations, high-order preparation and the ordered error\
    \ bounds are\nspecified in the analytic construction; no inertia or desired\nfrequency is fitted.\n\
    \nCommon-circle CK geometry and full weighted pressure transfer retain\nthe packet and tube margins,\
    \ followed by bounded periodic stationary\napproximation. Whole-field phase/rotation averaging gives\
    \ a stationary\nisotropic finite-energy-density law for the periodic background and\nits registered\
    \ tube/tag family. A single localized finite-action\npacket is conditioned on a selected tube, not\
    \ declared itself a\ntranslation-stationary R^3 random field. Nonlinear amplitude is chosen\nlast\
    \ on the fixed finite window.\n\nThis is a controlled prepared-history theorem, not an exact\nmonochromatic\
    \ eigenmode, absolute vorticity director, separately\nconserved tagged spin, Gaussian/ergodic law,\
    \ unrestricted invariant\nrotor, optical identification in a different distant knot, or a\ncompleted\
    \ coupled autonomous Euler-to-Cosserat continuum."
