    \ second-variation action and full physical momentum/angular\ncurrent in a prepared incompressible\
    \ isotropic micropolar continuum\nthrough o(|K|^2), with any fixed finite time-derivative inventory\
    \ on\neach fixed compact time window.\n\nThe construction uses the actual acoustic displacement/velocity\
    \ inputs\nof C-CST-015/016, both quadratures of their wrapped-streamline passive\nEuler sector to\
    \ repair the complete point-to-hybrid acceleration, the\nsame-field two-positive-tag optical angle/full-spin\
    \ controls, and the\ncomplete mixed phase/Jacobi-energy normalizer. The whole initial field\nis summed\
    \ before averaging. All quadratic cross forms and full finite\nsource norms are retained. Signed controller\
    \ amplitudes are physical\ninitial data; every probability and material mass fraction stays positive.\n\
    \nWith C=i[K cross], transverse acoustic amplitude A0 and unrestricted\noptical amplitude B, the actual\
    \ observations satisfy\n(U,Phi)=T(A0,B)+e,\nT=[[I,-j C/(2rho)],[C/2,I]],\nA0_tt+a|K|^2 A0=r_A,\nB_tt+[nu^2\
    \ I+cT|K|^2 P_T+cL|K|^2 P_L]B=r_B.\nHere rho is the ambient density, j>0 is the measured whole-law\
    \ spin\nnormalization, a>0 is the actual acoustic coefficient and nu>0 is the\nselected actual optical\
    \ clock. The spatial coefficients cT,cL are\nexplicit prepared output targets with cT>j nu^2/(4rho),\
    \ cL>0.\nThe errors e,e_t,e_tt,r_A,r_B are o(|K|^2) in the declared operator\nnorms along the common\
    \ ordered preparation/long-wave sequence.\n\nSet mu=rho a, alpha=j nu^2/4,\ngammaT=j(cT-alpha/rho),\
    \ gammaL=j cL and M=diag(rho I_T,j I).\nIf K2 is the canonical micropolar stiffness, direct substitution\
    \ gives\nM Y_tt+K2 Y=M T r+(K2 T-M T D)z+M e_tt+K2 e.\nThe exact algebraic mismatch is cubic in K.\
    \ The acoustic and optical\nzero-wave-number state Wronskians equal one, and the five-position\nobservation\
    \ determinant is (1+j|K|^2/(4rho))^2. Thus the bounded state\ninverse makes the coupled equation a\
    \ statement for every retained\ninitial amplitude, not a check along one trajectory. Pulling back\
    \ BOTH\ninherited phase/kinetic and energy forms through the same physical T\ngives the same M and\
    \ K2 through second spatial order.\n\nLiteral total momentum retains collapsed material tags and continuous\n\
