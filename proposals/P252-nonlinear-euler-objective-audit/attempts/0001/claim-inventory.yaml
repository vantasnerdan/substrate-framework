- id: C-CST-015
  statement: "The actual periodic stationary Euler field\nu=(cos Y+A cos Z,A sin Z,-sin Y), A=1/100, curl\
    \ u=-u,\nadmits a finite correlated initial displacement preparation with\npositive whole-law physical\
    \ restoring response equal to its\ncomplete inherited displacement energy through spatial order two.\n\
    \nPut psi=cos Y+A cos Z, alpha=cos Y-A cos Z and H=-Delta.\nFor n=3,5,7 set w_n=n\xB2(n\xB2+1)/(2(n\xB2\
    -1)\xB2), S=sum n\xB2/w_n,\nc_n=2n/(w_n S). Keep c_5,c_7 fixed and solve the two exact\nfirst-shell\
    \ moments for c_1,c_3 in\nf(psi)=c_1 psi+c_3 T_3(psi)+c_5 T_5(psi)+c_7 T_7(psi),\nso <cos Y(alpha+f)>=<cos\
    \ Z(alpha+f)>=0. The finite inverse\nphi=(H-1)^(-1)(alpha+f) then exists without discarding a mode.\n\
    Its full velocity z_*=(-alpha/2+Hphi,-phi_Z,phi_Y) solves\nLz_*+F0=0 with the complete pressure, where\n\
    L=-P[(u.grad)\xB7+(\xB7.grad)u] and F0=P(u_Z cross u_Y).\n\nFor a common unit laboratory direction\
    \ kappa and D perpendicular\nto kappa, set T_D=-(D.grad)u, q_D=-kappa cross T_D,\nd=kappa_Y D_Y-kappa_Z\
    \ D_Z, a_u=kappa.u,\nb=q_D-a_u D+d z_*, and c=a_u D+(u.D)kappa.\nThe complete first-shell projection\
    \ Pi_-=(P-curl)/2 supplies\nz_return=-Pi_- b+t Pi_- c. It is killed by the full Euler\ngenerator,\
    \ not only by its planar subsystem. Thus\nz_D=d z_*+z_return is a stationary forced first velocity\
    \ cell.\n\nLet E=1+A\xB2 and R=||z_*,|wave|>1||\xB2/5, computed by exact full\nFourier convolution\
    \ from this field. The construction gives\n0<R<13E/1280. Averaging one actual whole-field isotropic\
    \ law with\ncommon laboratory data yields independent energy/current coefficients\n\n  h2=E t\xB2\
    /15-47E/240+R,\n  R_D=E(8t+13)/120.\n\nChoosing s=sqrt(100-960R/E), t=-(4+s)/8 gives\na=E(s-9)/120,\
    \ E/240<a<E/120, h2=a and R_D=-a.\nThe amplitude is derived from the actual finite microgeometry,\n\
    not an empirical fitted coefficient or assigned fluid mass.\n\nIn the genuine finite-Bloch preparation\
    \ eta_D(0)=D,\nw_D(0)=curl_K(T_D/(-1))+ik P_K z_D and K=k kappa.\nIts full constrained cotangent has\
    \ zero microscopic mean.\nTogether with eta_V(0)=0,w_V(0)=V, the complete initial phase\nis rho J\
    \ and the leading physical V kinetic mass is rho.\nCirculation data are explicitly prepared, not falsely\
    \ identified\nwith the constant-D Kelvin leaf. Real conjugate bands and whole\ntranslations, rotations,\
    \ mirrors and time reversal retain the\nphysical normalization and transform the helicity sign together.\n\
    \nThe actual physical observation X=D+integral(mean w)dt satisfies\nX_D(T)=D-a k\xB2T\xB2D/2+O_T(k\xB3\
    ), and its inherited initial energy is\nrho a k\xB2|D|\xB2/2+O(k\xB3). The Hamiltonian calculation\
    \ includes the\nactual subtraction ||a_u D||\xB2 and full pressure terms. X is not\nsilently replaced\
    \ by mean material displacement.\n\nThis is a displacement-column theorem on fixed time windows.\n\
    Its initial phase does not fix the common-V history, observed\nWronskian or autonomous acoustic Hamiltonian.\
    \ Physical angle/spin\nclosure, acoustic-time uniformity, stationary EPS joining and the\nfull coupled\
    \ continuum remain distinct constructions."
