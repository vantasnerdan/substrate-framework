- id: C-CST-009
  statement: "Use C-CST-008's cells in the explicit phase Cauchy--Born embedding of the\nquadratic Euler\
    \ material action,\n\n    eta=U+Ez,\n    pi=rho[(u0.grad)eta+V+A Ez],\n    Axi=P(xi cross omega0)-curl(P(xi\
    \ cross omega0))/lambda.\n\nAll ambient fluid is retained. U is the declared coherent tube-centroid\n\
    plus continuous-ambient coordinate; Phi is the registered local core-angle\nfield, q=Phi-curl U/2.\
    \ The ensemble pairs time-reversed and reflected full\nstates, with one COMMON macro conjugate variable\
    \ V and independently varied\nmicroscopic reaction momenta. Unresolved nonaffine variation/relaxation\
    \ is\nexcluded by the declared Cauchy--Born closure, not silently made into gauge.\nThe law and marks\
    \ are fixed before deformation. The claim concerns the\nlinear continuum and its full second spatial\
    \ jet, not all wave numbers.\n\nPulling back that ONE action, taking its stated ensemble average and\n\
    eliminating the complete retained momenta yields positive computed\n\n    j=nu E_Palm[B^2/P]/3,\n\
    \    kappa=nu E_Palm[Hq-N^2/P]/3, alpha=kappa/4.\n\nThe six-moment match gives b=0 in the leading\
    \ physical mixed mass and\nell=g-kappa b/j=-kappa/2!=0. Thus the optical branch has nonzero actual\n\
    coarse translation/core-angle transfer\nU/Phi=-j sigma |k|/(2rho)+O(|k|^3) in curl helicity sigma.\
    \ The leading\nmass density is the total rho, derived also by the exact common Galilean\ntranslation\
    \ of the same stationary fluid, not a tube filling fraction.\n\nZero-moment compact STF and neighbor-angle\
    \ attachments, with finite\nstructurally selected amplitudes, give positive shear mu and positive\n\
    transverse/longitudinal spin curvatures C_T,C_L after retaining all added\ngradient inertia. Their\
    \ coefficients are full canonical action/Schur\nintegrals, including the negative bare material covariance\
    \ stiffness,\npotential reaction squares and the surviving STF rate-source norm.\nThe SAME derivative\
    \ field normalization transforms both kinetic and\npotential forms. In its stated convention the equations\
    \ are\n\n    rho U_N,tt=(mu+alpha)Delta U_N+2alpha curl Phi_N-grad p,\n    div U_N=0,\n    j Phi_N,tt=C_T\
    \ Delta Phi_N+(C_L-C_T)grad div Phi_N\n                    +2alpha curl U_N-4alpha Phi_N.\n\nThese\
    \ equations and their angular-momentum/couple-stress balance are exact\ncoefficient identities for\
    \ the declared second-gradient conditional action.\nThe optical gap is4alpha/j; the acoustic transverse\
    \ speed squared ismu/rho.\nThere is no incompressible longitudinal displacement wave. The physical\n\
    gradient masses, finite-radius Fourier filters and macro affine tube-spin\nrow accompany the field\
    \ map. In particular full tube spin is not renamed\nj Phi_dot: its additional affine/shape current\
    \ is explicitly retained.\n\nRemoving the core-angle and angle-gradient populations deletes Phi before\n\
    any zero-inertia division and leaves a positive incompressible Navier--Cauchy\nsector when the independent\
    \ STF population remains. Removing every attached\npopulation and the vortical covariance instead\
    \ leaves linearized Euler.\nThe explicit limiting families and unchanged-density bookkeeping are in\n\
    0105/population-limits.md.\n\nThis is an exact conditional variational continuum construction from\
    \ the\nEuler material action. It does NOT claim that unrestricted Euler trajectories\nremain in the\
    \ chosen finite phase family. Their reconstruction residual is\nR=Udot-V+Ezdot-AEz;0095 supplies its\
    \ exact complement/memory and the matching\nphysical observation correction. Its vanishing is not\
    \ an unstated premise\nor a conclusion of the finite KKS calculation. The stronger unrestricted\n\
    realization question remains distinct, with0101 as finite-time progress."
