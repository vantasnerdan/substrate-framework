- id: C-CST-013
  statement: "Let u be a smooth stationary mean-zero periodic incompressible Euler\nfield, p its pressure\
    \ divided by density, A=u.grad, K=k*kappa with\n|kappa|=1, and D,V perpendicular to kappa. Prepare\
    \ the actual Kelvin\ndisplacement D and independently specified common velocity V. Their\nzero-order\
    \ material displacement is U0=D+tV. Write\neta=U0+i*k*chi+O(k\xB2), where chi is mean-zero and solenoidal.\n\
    With microscopic mean-preserving Leray P, its actual first cell obeys\n\n  chi_tt+2P A chi_t+P(A\xB2\
    +Hess p)chi\n    =-2P[(kappa.u)V]+P[(kappa.grad p)U0+kappa(U0.grad p)],\n  chi(0)=0, chi_t(0)=-P[(kappa.u)D+kappa(u.D)].\n\
    \nFor the physical Eulerian velocity mean m, set X=D+integral m dt.\nPut a=kappa.u and P_kappa=I-kappa\
    \ tensor kappa. Its complete second\nfixed-time directional spatial jet is\n\n  m_t=k\xB2 P_kappa{<a\xB2\
    >U0+<a chi_t+u(kappa.chi_t)>\n                   +<(kappa.grad p)chi+grad p(kappa.chi)>}+O(k\xB3).\n\
    \nThe corresponding mean material rate differs by\nm-<eta>_t=-k\xB2<a chi-u(kappa.chi)>+O(k\xB3).\
    \ These exact observed rows\nrequire no inverse for the unknown second cell: its divergence\nconstraint\
    \ and periodic integration by parts remove it. The identity\nP_K grad f=-i*k*P_K kappa f retains the\
    \ pressure numerator, including\nthe slow harmonic, rather than differentiating a singular bare\n\
    projector estimate.\n\nIn0153's bounded constant-curl insertion family u_N=u_wave+h_N,\nnormalized\
    \ H2 defect epsilon_N tends to zero while the global C3\nbound remains fixed and prescribed C-CST-011\
    \ local optical/tube\nmargins are retained. On each fixed time window, the actual first\ncell Euler/Lin\
    \ H1 estimate controls the physical observed second\ncoefficients by C_T*epsilon_N, uniformly in the\
    \ quadrature period\nand direction. Low-frequency insertion self-beats are included.\n\nAveraging\
    \ the actual coherently prepared phase actions over one\nwhole-field O(3), phase and time-reversal\
