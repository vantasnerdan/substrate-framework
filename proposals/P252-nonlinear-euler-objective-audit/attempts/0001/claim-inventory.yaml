- id: C-CST-017
  statement: "On the fixed C-CST-015/016 smooth stationary periodic Euler field\nu=(cos Y+A cos Z,A sin\
    \ Z,-sin Y), A=1/100, one positive whole-field\nO(3)/time-reversal law and one common finite smooth\
