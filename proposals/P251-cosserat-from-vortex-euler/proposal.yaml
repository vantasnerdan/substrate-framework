      2026-09-05 attempts 0071-0075: finite independent Gaussian
      superposition with exact icosahedral spectral moments constructs an
      isotropic ergodic stationary Euler law, distinct from a global Haar
      mixture. The complete induced-mean cotangent correction in 0072
      cancels 0070's proposed leading point-mean coupling and changes its
      second-gradient reaction matrix. This activates actual finite-material
      parcel centroids, their full intrinsic spin and shape moments, and
      compact induced-velocity candidates. 0073 derives the exact half-curl
      spin contribution separating Eulerian and parcel-centre momentum;
      0075 must construct the physical partition/action bridge, not merely
