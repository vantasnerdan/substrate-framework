question: >-
  Does coarse-graining a declared ensemble of vortex structures whose
  rotational degrees of freedom (segment-frame orientation and twist) are
  carried by exact stationary vortex tubes of the Enciso-Peralta-Salas type
  yield an exact conditional derivation of the linear Cosserat (micropolar)
  equations - independent microrotation field, couple stress, asymmetric
  stress, balance of angular momentum with microinertia, and isotropic
  constitutive relations with effective moduli computed from the Biot-Savart
  self-energy of the structures - with every ensemble premise named and
  independently falsifiable, no hidden fitted constant, and with the
  no-Cosserat side (orientation-ergodic ensembles) shown to yield vanishing
  net couple stress and microrotation stiffness?
positive_objective: >-
  A governed claim ladder C-CST-001..007 deriving the linear micropolar
  equations from constant-density incompressible Euler coarse-grained over
  the declared vortex-structure ensemble: each premise declared and
  falsifiable, each exact statement SymPy-verified with mutation probes, each
  dynamical statement SciPy-verified with refinement, the fluid limit
  recovering Euler and the structure-free limit recovering the P242
  Navier-Cauchy sector, promoted claim by claim through independent review.
