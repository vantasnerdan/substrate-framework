source_inventory:
  - source: >-
      Enciso & Peralta-Salas, "Existence of knotted vortex tubes in steady
      Euler flows" (arXiv:1210.6271, 2012)
    access: in-hand proposals/P251-cosserat-from-vortex-euler/sources/1210.6271.pdf (md5 6349631cfdfe0d71a4673340f1056f29)
    extracted: >-
      Theorem 1.1 on R3: any finite collection of disjoint smooth closed
      curves has sufficiently thin metric tubes mapped by a C^m-small
      diffeomorphism to vortex tubes of an actual Beltrami field for some
      nonzero constant lambda. Derivatives decay as O(1/|x|); the field
      need not have finite total kinetic energy. Nested invariant tori,
      positive-measure structure and perturbation robustness are stated.
      This is not a bounded/periodic-domain or prescribed-flux theorem;
      the latter claims do not come from this cited statement.
  - source: >-
      Enciso & Peralta-Salas, "Knots and links in steady solutions of the
      Euler equation" (arXiv:1003.3122; Ann. Math. 175 (2012))
    access: in-hand proposals/P251-cosserat-from-vortex-euler/sources/1003.3122.pdf (md5 a179105fd823baecc71b10b37cab5a3f)
    extracted: >-
      For any (possibly infinitely many) linked/knotted curves there is a
      steady Euler solution with vortex lines of those knot/link types
      (re-locatable in sidecar text); declared existence layer for knotted
      vortex LINES (N7 premise context).
  - source: >-
      Enciso, Peralta-Salas & Torres de Lizaur, "Knotted structures in
      high-energy Beltrami fields on the torus and the sphere"
      (arXiv:1505.01605, 2015)
    access: in-hand proposals/P251-cosserat-from-vortex-euler/sources/1505.01605.pdf (md5 af8e5f917bd5dc1f52642426f6de48f1)
    extracted: >-
      Theorem 1.1: a finite union of disjoint curves/tubes in S3 or T3,
      contained in a contractible subset in the torus case, is mapped by
      a diffeomorphism to structurally stable vortex lines/tubes of a
      Beltrami field for sufficiently large odd integer lambda. It supplies
      existence, not the localized interpretation of the elementary
      constant-speed plane wave used as a separate N7 equation regression.
  - source: >-
      Rudge, "A micropolar continuum model of diffusion creep"
      (arXiv:2103.14458, 2021)
    access: in-hand proposals/P251-cosserat-from-vortex-euler/sources/2103.14458.pdf (md5 b17eb18a88112f5ade137804a657e473)
    extracted: >-
      In-hand statement of the linear micropolar system: velocity +
      microrotation-rate fields, relative microrotation measure, couple
      stress, moment tractions (sections re-locatable in sidecar text); the
      structural target-form cross-check for N4 identification (primary
      target: Comparsi intake 2026-09-03); also the methodology
      precedent (micropolar continuum from discrete rotational DOF). No
      formula imported as truth - the target equations are re-derived here.
  - source: >-
      Tekinalp, Bhosale, Cui, Chan & Gazzola, "Soft, slender and active
      structures in fluids: embedding Cosserat rods in vortex methods"
      (arXiv:2401.09506, 2024)
    access: >-
      in-hand locally (~/sources/cosserat-euler/2401.09506.pdf, md5
      08ba02c27846ec110d9c1a21bf5381cc); txt committed; PDF not committed
      (37 MB context-only)
    extracted: >-
      Context only: rod-vortex coupling methods; no claim imports from it.
  - source: >-
      MIT 2.25 Advanced Fluid Dynamics Section 9 (vorticity and circulation)
    access: open https://web.mit.edu/2.25/www/225_sect_9.html (verified 2026-09-03)
    extracted: >-
      Circulation and Biot-Savart (9.2), Kelvin theorem (9.3), vortex lines
      move with the fluid (9.4a); declared classical mechanics input
      (P242 precedent).
  - source: >-
      Eringen, "Linear theory of micropolar elasticity", J. Math. Mech. 15(6)
      (1966) 909-923; Cosserat & Cosserat, Theorie des corps deformables (1909)
    access: paywalled / historical - cited for provenance, NOT load-bearing
    extracted: >-
      Nothing imported; the target equations are carried by in-hand
      2103.14458 and re-derived by this campaign.
  - source: >-
      F. Comparsi (@Splinterrone), issue #198 intake comment 2026-09-03
      (github.com/vantasnerdan/substrate-framework/issues/198#issuecomment-5526924549)
    access: open GitHub comment (captured verbatim in issue thread)
    extracted: >-
      Authoritative target form: Eq (1) rho u_ddot - (lambda+2mu) grad div u
      + (mu+alpha) rot rot u - 2 alpha rot Phi = 0; Eq (2) J_i Phi_ddot -
      (beta+2gamma) grad div Phi + (gamma+epsilon_c) rot rot Phi - 2 alpha
      rot u + 4 alpha Phi = 0. Micro-decomposition v = V_macro + Phi x r +
      v', omega = 2 Phi + omega'; RVE averages; J_i = <rho_0 r_i^2>.
      Premises asserted, not derived (nonsymmetric stress, couple stress,
      2alpha/4alpha coupling) - deriving them from Biot-Savart self-energy
      is precisely this campaign's job. Secondary-LLM-output triage per
      P242 precedent: not load-bearing for any exact claim; its premises
      are absorbed as explicitly declared hypotheses; the target equations
      are identification comparators for N4, frozen 2026-09-03 before
      attempts.
invariants:
  - no edits to accepted claims, campaigns, generated docs, or migration queues
  - constant-density incompressible Euler is the sole microscopic dynamics
  - every emergent Cosserat statement is conditional on explicitly declared ensemble premises; no hidden fitted constant; bending/twist moduli and microinertia are derived from the Biot-Savart self-energy, never postulated
  - material frame indifference and isotropy of the coarse-grained energy; SO(3) frame covariance of triad transport
  - the structure-free limit removes the spin coordinate and recovers the divergence-free linearized-Euler displacement sector; ratios of spin stiffness to microinertia may remain finite as L_v -> 0 and are not physical modes at L_v = 0
  - exact claims use SymPy oracles; numeric claims use scipy with declared refinement and mutation probes; the incompressible branch and compressible branch are never mixed
  - EPS theorems are imported as declared existence input from in-hand verified sources; this campaign does not reprove or weaken them
allowed_imports:
