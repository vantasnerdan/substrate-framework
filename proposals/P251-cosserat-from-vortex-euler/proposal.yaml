    - >-
      2026-09-05 attempts 0057-0070: normalize the full fluid with an actual
      stationary Gaussian Beltrami ensemble and retain full reaction-operator
      inverses and ambient interactions. The eleven-affine-moment relative
      angle route has exact positive action and second-gradient normal form,
      but 0066 finds zero leading physical translation-spin response after
      its observable map. This activates rotational-moment-prescribing
      compact reactions: retain angular KKS coupling to the local affine
      frame while removing translation and symmetric tracefree moments.
      Compact curl plus double-divergence forces preserve full slow-jet
      locality (0069); gradient-only cages (0065) compete at the unchanged
