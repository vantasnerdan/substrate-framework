obligation_graph:
  nodes:
    - id: N1
      positive_intent: >-
        Exact frame-transport kinematics: an orthonormal triad transported
        along a filament centerline obeys the SO(3) transport identity whose
        twist rate about the tangent splits into material twist and geometric
        torsion (Bishop frame as twist-free gauge); the microrotation variable
        of the coarse-grained theory is this frame-rotation angle.
      requires: []
      pass_licenses: []
      does_not_license: [any modulus claim, any balance-law claim]
      maximum_verdict: established
      failure_scope: filament-triad route family only
      unlocks: [N3, N5]
      status: established
      license_chain:
        object: >-
          transported orthonormal triad (t, q1, q2) along a smooth centerline;
          twist angle chi(s); Frenet torsion tau(s)
        symmetry_or_conservation: SO(3) frame covariance of the transport law
        ensemble: single declared filament (deterministic geometry)
        variational_functional: not applicable (kinematic identity)
        admissible_space: smooth unit-speed curves, closed or periodic box
        representation_coverage: includes Frenet and Bishop gauges; excludes
          self-intersecting centerlines
        observable: twist rate chi'(s) vs geometric torsion; helix closed form
        numerical_representation: blocked (exact claim; SymPy only)
        permitted_verdict: established
    - id: N2
      positive_intent: >-
        Bending and twist stiffness per unit length of one straight vortex
        tube segment, derived - not postulated - from the regularized
        Biot-Savart self-energy under slow centerline bending and core twist,
        as exact symbolic expressions with declared outer/inner cutoffs
        (log(R/a) running).
      requires: []
      pass_licenses: [L1]
      does_not_license: [ensemble moduli, balance laws]
      maximum_verdict: established
      failure_scope: both route families (shared micro-elasticity input)
      unlocks: [N3]
      status: active
      license_chain:
        object: >-
          straight-tube self-energy E(L; R, a) and its O(a^0) variations under
          bend curvature kappa and twist rate chi'
        symmetry_or_conservation: >-
          rotational and translational invariance of the Biot-Savart kernel;
          Kelvin circulation theorem (Gamma fixed)
        ensemble: single straight tube, fixed circulation Gamma, core radius a
        variational_functional: >-
          regularized Biot-Savart self-energy
          (rho*Gamma^2/4pi) double-line integral with core mollifier
        admissible_space: >-
          slowly varying perturbations, kappa*a << 1, a << R (scale
          separation premise, declared)
        representation_coverage: >-
          includes centerline bend and rigid core twist; excludes
          core-internal reconnection and wave-like core modes
        observable: bending modulus B(Gamma, rho, R, a), twist modulus
