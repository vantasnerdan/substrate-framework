      0090 constructs its compact same-EPS-field continuation. Competing
      compact-induced-velocity (0085) and volume-preserving material-mean
      (0087/0091) routes retain full spin, Kelvin and ambient terms.
      The positive coupled continuum action remains the active objective.
    - >-
      2026-09-05 attempts 0075-0083: exact finite-parcel cotangent,
      spin and moment identities preserve genuine finite-core inertia,
      but arbitrary advected cubes do not supply a stationary material
      shape law. The independently reviewed smooth Beltrami ball in
