question: Can actual incompressible Euler substrate dynamics derive both electron and neutrino mechanisms,
  electron first, including persistence, interactions and a shared physical quantum/relativistic bridge?
positive_objective: Complete the full issue203 electron AND neutrino particle mechanism contract frozen
  verbatim in issue203-frozen.md; P0–P7 are conjunctive, electron first does not reduce scope.
coordination_boundary: Root owns central proposal/memory/commits; workers own assigned append-only attempts
  only unless separately allocated source APIs. No changes to old P251/accepted canon or unrelated dirty
  worktrees.
