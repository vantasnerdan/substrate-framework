- Preserve substrate/action and same-field implications
- Robustness and genuine restoring mechanism
- Parameter/assumption economy and scale selection
- Physical quantum/relativistic and electron/neutrino predictive reach
- Independent quantitative consequence after prediction/input ledger, never comparator fit
