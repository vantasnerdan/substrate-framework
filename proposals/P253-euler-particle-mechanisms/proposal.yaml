- source: Slobodeanu, steady Euler and Faddeev–Skyrme with mass term
  access: https://arxiv.org/abs/1405.3469
  extracted: Previously inspected Proposition2 and strong-coupling energy; full time-dependent equivalence
    unearned.
- source: Faddeev–Niemi, Knots and Particles
  access: https://arxiv.org/abs/hep-th/9610193
  extracted: Model inventory only; knot topology is not electron or neutrino identification.
- source: P252 independent campaign audit
  access: git:review/nonlinear-objective-audit@c6e950df1e5b97c40ea8e8c631a7725ee60c9980
  extracted: Primary author and reviewer artifacts; P251 uniform inverse gap and conditional prepared-response
    boundary, not new accepted canon.
- source: PDG electron and neutrino listings
  access: https://pdg.lbl.gov
  extracted: Comparator values previously exposed; no fictional blinding or fit-based concept selection.
invariants:
- Constant-density incompressible 3D Euler and actual substrate action; changed foundation requires a
  separate proposal and owner agreement.
- Natural initial-data neighborhoods; no target-specific future-history preparation as persistence or
  autonomous mechanism.
- Compact vorticity with decaying velocity is allowed; compact velocity is not required.
- Geometry, restoring mechanism, currents and interactions refer to the same candidate and conserved-label
  family.
- Quantum/relativistic identification and action scale must be derived or explicitly licensed, not attached
  by analogy.
allowed_imports:
- Pinned v0.183.0 claims at exact individually accepted scopes; P252 source challenges remain explicit
  and are not silently used as solved existence.
- Primary Euler, topology, constrained variational, projection and quantum mathematical literature after
  exact source applicability audit.
- Exact calculus, symbolic algebra and exposing analytic examples; no unlicensed constitutive or empirical
  constants.
