  A declared independent first-event detector law converts normalized physical
  two-channel energy fractions into the exact Born and sequential projective
  probability tables. The derivation identifies rather than hides the new
  stochastic clock and open-system/external reset assumptions; current Euler
  suppliers do not yet generate them.
