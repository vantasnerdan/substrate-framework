route_verdicts:
  deterministic_threshold_detector:
    verdict: blocked_with_missing_physical_basins_and_invariant_measure
    statement: >-
      Analyzer energy fractions become outcome probabilities only if the
      coupled detector basins have those measures under one fixed unresolved
      substrate law. A hidden-threshold example with event lambda<=I gives
      F(I), exposing that the
      uniform law cannot be inferred from determinism or energy conservation.
  first_event_competition:
    verdict: conditional_probability_theorem_established
    statement: >-
      Independent exponential clocks of rates kappa times the two normalized
      channel intensities give exact first-event probabilities equal to those
      intensities. Exclusive capture plus projective reset gives repeatability
      and the usual sequential transition matrix. The clock, rate-current,
      capture and reset laws are explicit new hypotheses. If every rate is
      zero no finite event occurs and the conditional winner law is undefined;
      a many-to-one reset is open-system/coarse-grained or external rather than
      an autonomous finite-volume Euler time map.
  deterministic_rare_event_limit:
    verdict: blocked_with_missing_joint_hitting_and_capture_theorem
    statement: >-
      The accepted spatial Poisson marking is not a temporal detector process.
      A same-substrate derivation requires a uniform joint exponential
      hitting-time limit with intensity-proportional rates and an exclusive
      finite-energy capture/reset coupling on the same persistent carrier.
  action_and_propagation:
    verdict: active
    statement: >-
      The common clock rate cancels from outcome probabilities and selects no
      action unit. Continuous Euler scaling and elliptic pressure leave the
      fixed packet/action and finite-speed obligations open.
