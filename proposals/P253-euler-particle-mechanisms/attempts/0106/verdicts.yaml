units:
  A_full_core_cancellation:
    verdict: established
    strongest_result: >-
      On a regular positive full-core component, exact first-speed cancellation
      and a regular matched dipole force s P_s^3 G_P to vanish for G=h/h_P,
      hence h=A exp(aP). A nontrivial exponential cannot vanish at the finite
      P=0 free edge, refuting the smooth compact full-core fixed-ratio route.
    boundary: componentwise_positive_full_core_not_strict_cutoff_or_charged_branch
  B_power_law_Lane_Emden_response:
    verdict: established
    strongest_result: >-
      The exact globally matched response has sign factor
      D=p M_(p+1)/(p+1)-P M_p. It is negative near the smooth center and
      positive near the edge, has an interior zero, and on the analytic core
      cannot vanish identically on any open sub-band.
    boundary: no_pointwise_nonvanishing_uniform_lower_bound_or_strict_cutoff_result
  C_fixed_leaf_flux:
    verdict: established
    route_consequence: radial_A_B_fixed_leaf_lift_refuted
    strongest_result: >-
      Compact divergence-free material displacements have zero weighted normal
      flux across every regular P contour, in both the straight area measure
      and exact finite-torus r dr dz measure. Thus nonzero radial mean source
      controls are not first-order tangents of the fixed material leaf.
    boundary: no_nonradial_other_leaf_or_full_operator_coverage
  D_raw_material_tangent:
    verdict: established
    strongest_result: >-
      On a compact regular finite-Cao band with chi_prime bounded away from
      zero, a smooth compact target T is a material tag tangent exactly when
      its J-weighted mean vanishes on every contour. An explicit periodic
      divergence-free displacement realizes every such T.
    mapping_scope: smooth_Frechet_surjectivity_with_one_normal_derivative_loss
    estimate: C_k_times_C_k_plus_1_and_H_s_times_H_s_plus_1
    boundary: no_finite_rows_steady_free_boundary_or_normalized_response_inference
  E_full_response_operator:
    verdict: blocked
    missing_construction: >-
      Define and construct the bounded common-domain linearized steady
      Euler-Maxwell/free-boundary operator L_full:X_leaf to Y_band x R^2,
      including induced fields and finite rows; then prove closed range,
      Fredholm control or a bounded right inverse and pair the actual target
      with its full adjoint cokernel.
    exact_range_distinction: preserved
  F_evidence_API_and_boundaries:
    verdict: established
    strongest_result: >-
      The importable API and exact verifier support precisely the finite
      algebraic identities they encode, while the focused, static and
      repository receipts are correctly scoped as regression and agreement
      evidence. Claim-bearing artifacts contain no stale full-range or parent
      promotion.
