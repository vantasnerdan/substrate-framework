  - id: B
    target: quantified filament-to-patch operator-norm Floquet transfer
    status: not_activated
    reason: >-
      Route A directly constructed the requested actual full-contour
      propagator. Route B remains a possible strengthening route for a
      uniform small-core or repeated-period estimate, not a substitute used
      in the present verdict.

licenses_earned:
  - Actual full two-label, non-reversible contour Jacobi propagator through one period.
  - Exact retention of both self and cross interaction operators and all first modes.
  - Exact individual-area tangent and intrinsic four-center plus shape chart.
  - Exact symplectic monodromy and conserved phase/translation/energy/impulse flag.
  - Bounded reduced one-period monodromy with an explicit Gronwall bound.

remaining_dependency: >-
  Derive a reduced Krein/resolvent separation or a modulated normal form that
  controls powers of M_red. This requires upgrading the source periodic
  symplectic conjugations to the full independent-label IVP while retaining
  first-mode/center cross blocks; the present one-period bound alone is not
  restoring stability.

does_not_license:
