active_obligation: R1 restoring/interaction transfer
candidate: Garcia-Hassainia-Hmidi actual periodic labeled patch pair

tested_routes:
  - id: A
    target: >-
      Bounded initial-value propagator and correctly reduced one-period
      monodromy for arbitrary source-regular, independent, non-reversible
      two-contour perturbations.
    route_verdict: established
    evidence_scope: EXACT_INTERFACE_LINEARIZATION_AND_SOBLEV_ENERGY_ESTIMATE
    strongest_result: >-
      The exact two-label normal Jacobi equation is first-order transport plus
      an order-zero Hilbert/self remainder and smoothing cross interaction.
      On each fixed sufficiently smooth source orbit it generates an
      invertible zero-loss evolution U(t,r) on the individual-area tangent,
      with norm at most exp(integral C_s). The return map is symplectic, fixes
      phase and common translation, preserves total energy and impulse
      covectors, and induces a bounded map on
      (ker dH_c intersect ker dP)/span(v_phase,v_z).
    exact_limits: >-
      The bound may deteriorate as epsilon tends to zero. It is a one-period
      bound, not a spectral-unit-circle, power-bounded, or nonlinear orbital
      stability theorem. It assigns no algebraic multiplicity at multiplier
      one without an isolated Fredholm spectral point.

