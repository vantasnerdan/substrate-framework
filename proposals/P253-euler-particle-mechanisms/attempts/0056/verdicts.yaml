algebraic_sufficiency:
  unit_verdict: established
  review_status: established_after_one_bounded_normalization_correction
  evidence_scope: EXACT_CONDITIONAL_SCHWINGER_HOPF_SU2
  physical_energy_action:
    route_verdict: established
    hypotheses:
      - two positive physical Williamson modes
      - common positive KKS scale B
      - positive frequencies nu_1 and nu_2
    coordinate: z_a equals sqrt(B/2) times sqrt(nu_a)q_a plus i p_a/sqrt(nu_a)
    bracket: bracket_of_z_a_and_conjugate_z_b_equals_minus_i_delta_ab
    mode_action: J_a equals abs(z_a) squared equals H_a divided by nu_a
    total_action: J equals sum_a abs(z_a) squared
    phase_generator: bracket_of_z_a_and_J_equals_minus_i_z_a
    unequal_frequency_energy: H equals sum_a nu_a J_a
    equal_frequency_specialization: H equals nu times J
    units: abs(z_a) squared has physical action units
  schwinger_hopf_reduction:
    route_verdict: established
    positive_level: J_0 greater than zero
    stokes_definition: S_i equals z_dagger sigma_i z divided by 2
    poisson_algebra: bracket_of_S_i_and_S_j_equals_epsilon_ijk_S_k
    casimir: abs(S) squared equals (J/2) squared
    quotient: fixed_J_S3 modulo common_U1 equals CP1 equals S2
    sphere_radius: J_0 divided by 2
    reduced_area: 2*pi*J_0
    prequantization_if_imposed: N equals J_0 divided by hbar is an integer
    does_not_select:
      - J_0
      - hbar
      - N equals 1
      - a polarization or quantum state space
  operator_split:
    route_verdict: established
    formulas:
      complex_linear: V_C equals (V minus J V J) divided by 2
      antilinear: V_A equals (V plus J V J) divided by 2
    identities:
      - V_C commutes with J
      - V_A anticommutes with J
      - V equals V_C plus V_A
    physical_scope: >-
      For an actual compatible compressed Hamiltonian generator, V_C is the
      number-preserving part and V_A is the squeezing/action-drift part.

