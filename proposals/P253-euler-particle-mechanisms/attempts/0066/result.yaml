exact_results:
  source_boundary_jet:
    route_verdict: established
    scope: sufficiently_thin_p_at_least_6_Cao_members
    statement: >-
      Cao Appendix A equation (A.8), the exact positive-part carrier equation,
      fixed-carrier Schauder bootstrapping, and normal Taylor expansion give
      P=kappa_P(s)d+O(d^2) with kappa_P positive, hence
      zeta=kappa_zeta(s)d^p+O(d^(p+1)) and two-sided comparability on each
      fixed compact boundary. Those source statements alone do not give
      uniform-in-epsilon fixed-domain C2 convergence or global
      foliation/period control; the latter is separately derived here from
      the exact rescaled equation.
  ordinary_unweighted_DA_graph:
    route_verdict: refuted
    scope: s_4_p_at_least_6_fixed_abs_n_at_least_2
    mechanism: >-
      The corrected 0062 h-by-h sequence has displacement quotient bounded
      below while both ambient H3 vorticity and its H3 generator graph norm
      tend to zero.
  fixed_carrier_foliation_and_period:
    route_verdict: established_for_sufficiently_thin_members
    statement: >-
      The exact scaled semilinear equation upgrades Cao's C1 convergence to
      fixed-domain C2-alpha convergence by Schauder estimates. Nondegeneracy
      of the radial center, a gradient lower bound off the center, and the
      regular outer boundary prove one elliptic center, no separatrix, regular
      closed levels, and 0<omega_min<=omega(I)<=omega_max for each fixed
      sufficiently thin carrier.
    scope: >-
      Constants are fixed-carrier/rescaled; no uniform raw physical-time
      normalization is claimed outside the perturbative thin family.
  weighted_orbit_tangent_norm:
    route_verdict: established_at_tangent_scope
    topology: H5_volume_preserving_diffeomorphism_quotient
    statement: >-
      The intrinsic tangent quotient completion is separated. The ambient H5
      volume-preserving group supports composition and inversion. Along any
      smooth orbit path,
      omega_g-omega_0=curl integral(u_t cross omega_t)dt and the complete
      velocity is the whole-space Leray projection of that integral.
    missing_construction: >-
      Reverse Hardy/interface estimates and representative-independence must
      descend composition, inversion, velocity and pressure maps to the
      completed quotient.
    does_not_imply:
      - an unweighted graph inverse
      - limiting absorption
      - a steady carrier complement inverse
  fixed_n_physical_test_seed:
    route_verdict: established_not_eigenstate
    statement: >-
      For every fixed abs(n)>=2, explicit compact interior divergence-free
      displacement components produce q_test=C_0 xi in the physical DA graph
      with nonzero KKS pairing
      4*pi*i*rho_0*integral(r^2*zeta*f*g).
  symmetry_eigen_seed:
    route_verdict: refuted_for_internal_mode_target
    mechanism: >-
      Translations are isotropic zero modes with vanishing KKS pairing and are
      removed by center/impulse rows; tilted rotations are generalized zero
      chains ending in translations; axial rotation is a stabilizer.
  literal_C_infinity_boundary_mode:
    route_verdict: refuted_at_generic_moving_boundary_scope
    mechanism: >-
      A finite polynomial p and the nonzero d^p jet give generic
      boundary-moving DA tangents only finite zero-extension regularity. The
      physical mode theorem is stated in the frozen H3 graph/classical scope.
  nonlinear_selection:
    route_verdict: established
    toroidal_rule: n=(k-2*j)*n_0_at_homogeneous_order_k
    quadratic_rows:
      - 0
      - 2*n_0
      - -2*n_0
    cross_sectional_verdict: >-
      A finite m lattice is refuted as an exact rule because the curved global
      Hodge kernel and action-angle coefficients generally have infinite m
      Fourier matrices already at linear order.
  full_KKS_Green_identity:
    route_verdict: established_on_smooth_compact_DA_core
    identity: Omega(Au,v)+Omega(u,Av)=0
    statement: >-
      E2 is the relative Hessian d2(H-c0*Pz) on the constrained coadjoint
      orbit. At smooth compact-core scope the core/exterior whole-space Green
      flux cancels. Extension to the completed weighted/interface graph awaits
      the reverse Hardy and quotient-domain theorem.
  fixed_n_essential_spectrum:
    route_verdict: regular_cell_inclusion_established_converse_and_gap_conditional
    statement: >-
      In exact action-angle coordinates the local transport monodromy is
      unipotent and has frequency bands i*m*omega(I). For fixed toroidal n,
      the full-Hodge perturbation is compact H3->H3 because B_n gains one
      local derivative and theta differentiation is the fixed multiplier n.
      On each regular cell, an explicit exactly divergence-free,
      tangent-polarized DA Weyl sequence has C0 equal to the order-zero
      multiplier i*n*zeta, H3 normalization
      A_N asymptotic to (N^3*sqrt(epsilon))^-1, finite-row corrections o(1),
      and residual O(epsilon+N^-1)+o(1). It proves inclusion of every regular
      transport-band point in the constrained essential spectrum.
      Equality still requires the converse direct-integral domain theorem and
      boundary/separatrix classification.
    essential_gap_candidate: 0 < nu < omega_min
    missing_construction: >-
      The converse constrained direct-integral/domain bound, including
      boundary/interface spectrum, is still required before the candidate
      interval can be called an essential gap.
  massive_high_n_Kelvin_doublet:
    route_verdict: conditional
    scope: sufficiently_thin_fixed_Cao_member_with_n_delta_nearest_k0_over_delta
    construction: >-
      The scaling n_delta=nearest(k0/delta) supplies the useful positive mass
      k_delta>=k0/2, and the limiting m=0 column has simple positive-Krein
      Kelvin modes. Their transfer to Cao is not yet proved.
    missing_construction:
      - full_vector_Piola_transform_of_curl_div_and_Leray
      - every_delta_times_n_delta_term
      - interface_axis_exterior_and_D_to_X_coefficient_ledger
      - converse_DA_direct_integral_and_boundary_interface_domain
      - entire_column_common_domain_and_nonzero_m_mode_exclusion
      - graph_relative_norm_resolvent_bound_on_two_contours
    no_numerics_used: true
  doublet_deformation_transfer:
    route_verdict: blocked
    strongest_positive: >-
      Direct m=0 area-preserving action does not mix the two radial modes and
      quadrupole generators have zero first-order m=0 matrix element. The
      first candidate noncommuting coupling is the ordered second-order
      m=0 to plus/minus 2 to m=0 full-Hodge Schur path.
    missing_construction: evaluate_two_ordered_quadrupole_Schur_integrals_and_complement_control
  small_g_charged_continuation_input:
    route_verdict: blocked
    strongest_positive: >-
      For chi0=F(I) and abs(c0)<c_EM, the comoving gauge-fixed Maxwell operator
      is elliptic, fields are O(g), and Lorentz force is O(g^2). The exact
      axisymmetric order-g^2 curl equation reduces to a cohomological equation
      on each closed streamline, whose necessary and sufficient single-valued
      solvability row is the vanishing streamline mean in equation (46). If
      those rows vanish, the remaining equation is Cao's genuine steady
      elliptic linearization with its translation kernel, not auxiliary
      equation (3.36). This proves a shorter conditional steady route, not
      stationary force balance or a charged branch.
    missing_construction: >-
      Evaluate every streamline mean for the physical Maxwell self-force,
      construct the nonlinear axisymmetric Maxwell/free-boundary map and tame
      remainder, and apply Cao's steady translation Lyapunov-Schmidt inverse.
      Tag persistence and the joint energy signature remain separate.

