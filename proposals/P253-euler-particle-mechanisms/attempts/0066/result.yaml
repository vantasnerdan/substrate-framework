strongest_exact_verdict: >-
  0066 derives the nonzero Cao boundary jet, preserves the ordinary graph
  counterexample, defines the separated weighted tangent quotient and exact
  smooth-path whole-space Hodge identity, constructs an explicit compact
  fixed-n DA seed with nonzero physical KKS pairing, classifies the symmetry
  seeds, and derives the toroidal nonlinear selection rule. The fixed-carrier
  foliation/period bound and constrained regular-cell Weyl inclusion are also
  established. What remains conditional is the converse essential-spectrum
  theorem and therefore the full gap, together with the existence and transfer
  of two Cao modes; these require the converse DA domain theorem, full vector
  Piola graph ledger, and whole-column isolation.

next_executable_dependency: >-
  Prove the converse constrained DA direct-integral and boundary/interface
  spectral theorem. Then write the full vector high-n Piola transformation and
