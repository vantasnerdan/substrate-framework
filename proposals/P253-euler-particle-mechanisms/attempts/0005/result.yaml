strongest_positive_result:
  - The physical Euler regular dual is Omega1/dOmega0 with m=[rho*u_flat]; its kinetic Hamiltonian, right-reduced KKS form, and first-order orbit action are derived with one consistent sign and density convention.
  - Vorticity B=d(u_flat), with velocity recovered by the Hodge/Biot-Savart inverse plus boundary and harmonic circulation data, yields actual time-dependent Euler rather than the velocity-flux freeze in attempt 0003; for general H1 the full orbit action supplies h_dot=-P_H(i_u B), while fixed-basis harmonic coefficients are not presumed invariant.
  - Local/scoped Clebsch labels give a canonical action whose relabeling quotient pulls back exactly to the same physical KKS form on regular H1=0/decaying or separately proved global coverage; a single regular chart has zero integrated helicity under closed/decay boundary conditions. The displayed bulk labels do not prove arbitrary-H1 completion.
  - The compact radial swirl from attempt 0001 has a physical SO3/SO2=S2 rotation suborbit with j=(8*pi*rho/3)*integral(r^4*f)dr and KKS period 4*pi*j; genuine rigid SO3 acts in the larger volume-preserving group, while compact cutoffs are tangent/path lifts rather than an so3 subalgebra.
  - Conditional prequantization has Chern number N=2*j/hbar; odd N gives a spinorial SU2 lift of a physical 2pi rotation, while prequantization alone does not derive quantum mechanics or exchange statistics.
