epistemic_status: proposed
strongest_positive_result: >-
  For each sufficiently small Euler-scaled Cao polynomial carrier, two
  identical equal-radius and equal-intensity axial translates admit a nonempty
  open set relative to a support-controlled C1 space of smooth
  weighted-volume-preserving same-leaf diffeomorphisms, containing genuinely
  deformed nonzero-deficit pairs. Under the exact fixed-carrier deficit/modulus
  inequality, the one full nonlinear axisymmetric no-swirl Euler evolution
  keeps both complete labeled supports in disjoint Butta-Marchioro radius-R
  tubes and each label Cao-orbitally close for 0<=t<=T_R. The source T_R is
  positive and concentration-independent; the modulus and allowed initial
  neighborhood are not proved uniform in concentration.
established_components:
  one_common_full_nonlinear_euler_state: true
  exact_deficit_identity: delta_sum_t=delta_0+E12_t-E12_0
  exact_cross_bound: E12_t<=C_G*P_total^2/ell^3
  individual_impulse_exchange_and_total_conservation: true
  qualitative_cao_modulus: positive_for_each_fixed_carrier_radius_and_eta
  exact_euler_scaling: true
  butta_marchioro_equal_radius_transfer: true
  full_support_separation: true
  finite_time_orbital_splice: true
minimum_correction:
  status: applied_and_checked
  mechanism: >-
    Support and gap constraints are not open in the full Cao L1+L2+P
    topology because an arbitrarily small rearranged piece can be moved outside
    the initial tubes. A one-parameter deformation proves nonemptiness, not
    that stronger openness; moreover a nontranslation contour-tangent
    diffeomorphism can leave the carrier unchanged.
  corrected_scope: >-
    Use the relative topology induced by a C1-open support-controlled class of
    smooth dnu-preserving diffeomorphisms with strict tube margin, centered at
    an actual image outside the axial-translation orbit. The strict invariant,
    support and deficit inequalities are open in that class.
  changes_equations_or_api: false
source_quantifiers:
  concentration_parameter: rho_delta_sequence_from_scaled_Cao_family
  coarse_radius: each_fixed_R_with_0<R<min(r0,d/2)
  threshold: exists_rho_R_positive
  time: exists_T_R_positive_independent_of_rho
  support: complete_labeled_support_in_disjoint_radius_R_disks
  limiting_motion: equal_reference_velocities_and_zero_limiting_relative_velocity
  not_established: exact_finite_core_centroid_ODE_or_all_time_restart
