remaining_dependency: >-
  Construct a recurrent thin-support bound, invariant pair tube, or genuine
  pair-orbit compactness/stability theorem that carries the same-family pair
  past the finite Butta-Marchioro interval. Only after that could persistent
  relative motion, collision, or exchange questions be addressed.
