unit_B_0060:
  unit_verdict: blocked
  review_status: exact_geometry_and_conditional_neutral_tail_established_band_blocked
  stationary_composite:
    route_verdict: established
    positive_result: >-
      Disjoint compact stationary velocity components with flat collars and
      matched exterior pressure constants form an exact stationary Euler sum;
      its exterior pressure is constant and has no static multipole coupling.
  pressure_convention:
    route_verdict: established
    identity: M_ik=-(delta_ik/rho_0)*integral(p-p_infinity)
    kinematic_identity: M_ik=-delta_ik*integral(pi)
  octahedral_tangent:
    route_verdict: blocked
    positive_result: >-
      The translated proper-octahedral tensor projector and its conditional
      r^-5 velocity and r^-6 gradient upper bounds are exact.
    missing_construction: >-
      A nonzero C4-invariant compact DA seed on the six-site O/C4 orbit, or a
      proved free-24-site or overlapping-stabilizer alternative.
  direct_product_geometry:
    route_verdict: established
    boundary: >-
      Componentwise support, collar, circulation, harmonic, centering, and
      stabilizer rows give a product-leaf tangent and split KKS form, but global
      Hodge, pressure, and kinetic-Hessian cross terms remain.
  bloch_band:
    route_verdict: blocked
    positive_result: >-
      Scalar r^-5 coupling has finite zeroth and first lattice moments.
    missing_construction: >-
      Normalized invariant modes, uniform full pressure/Leray D(A_0)-to-X
      r^-5 coupling, graph-resolvent isolation, and complement leakage control.

joined_verdict:
