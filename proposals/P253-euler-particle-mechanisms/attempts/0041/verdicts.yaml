unit_B:
  target: branchwise local energy and noncritical gap
  route_verdict: established
  review_status: established_as_stated
  evidence_scope: EXACT_FREE_COLUMN_BRANCHWISE_LOCAL_ENERGY_AND_NONCRITICAL_GAP
  strongest_supported_statement: >-
    Time Plancherel and monotonicity of each column branch give the exact
    local-window estimate with loss 1/(c-c0). After separating the first
    critical radial branch and stationary kernel, min--max monotonicity gives
    a uniform positive group-speed gap for every noncritical radial branch.
  does_not_license:
    - an all-time estimate for the variable solitary operator
    - the Pi/Q derivative cancellation

unit_C:
  target: one-pass rays and high-frequency exponent
  route_verdict: established
  review_status: established_after_bounded_scope_correction
  evidence_scope: EXACT_ONE_PASS_MATERIAL_GEOMETRY_AND_ZERO_PRINCIPAL_RAY_EXPONENT
  strongest_supported_statement: >-
    Strict negative axial velocity gives no material-ray return, the accepted
    weighted Bessel exterior gives integrable added strain, and every fixed
    sufficiently small solitary member has zero principal BAS exponential
    exponent on every ray.
  blocked_extensions:
    - a literal finite scattering matrix without weighted conjugated integrability
    - high-frequency full-operator point-spectrum or Birman--Schwinger exclusion
    - a uniform Euler semigroup bound

unit_D:
  target: mixed-Casimir flux and critical coordinate
  unit_boundary_verdict: established
  evidence_scope: EXACT_LOCAL_FLUX_COUNTEREXAMPLE_AND_COMPACT_LABEL_REPAIR
  local_flux:
    route_verdict: established
    statement: >-
      The exact axisymmetric Euler equations yield the displayed local
      mixed-Casimir density/flux law and its full Hodge-coupled linearization.
  unbounded_D_equals_one:
    route_verdict: refuted
    mechanism: >-
      Smooth compact-generator axis-concentrating tangents tend to zero in
      physical energy and column graph norm while M_1 tends to a nonzero
      compact axial function.
  compact_regular_label:
    route_verdict: established
    statement: >-
      A nonnegative smooth D supported in a regular label annulus defines a
      bounded fixed-low-frequency critical coordinate with strictly positive
      overlap with the zero-frequency mode.
  adjoint_oscillator_conversion:
    route_verdict: blocked
    missing_construction: >-
      Construct the bounded two-branch physical adjoint spectral change,
      retain its free off-diagonal entries, and prove the scaled full-pressure
      cancellation in the finite-excess Hodge graph norm.

