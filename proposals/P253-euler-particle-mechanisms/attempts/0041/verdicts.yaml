    - closed-generator realization or valid Kato resolvent construction
    - forward and backward inhomogeneous supersmooth estimates
    - uniform sandwiched-resolvent bound
    - K_squared_times_C_norm_strictly_less_than_one
  conclusion: >-
    Under those hypotheses the Neumann resolvent and Duhamel argument gives
    bounded wave operators, a uniform group on the declared subspace, and no
    spectrum in the covered open half-planes.
  euler_application:
