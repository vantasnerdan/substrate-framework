attempt: P253/0065
owner: root
scope:
  obligations: [P3, P5]
  object: topological or nonlocal scalar charge from incompressible Euler
route_verdicts:
  point_puncture_flux:
    verdict: refuted_as_smooth_finite_energy_whole_space_euler_charge
    positive_result: >-
      R3 minus a point has a signed H2 flux class represented by q*x/r^3.
      Its divergence is 4*pi*q*delta_0 and its core kinetic energy diverges
      at least as 1/epsilon by the sphere-flux Cauchy-Schwarz bound; the radial
      representative saturates it. Smoothing the puncture source-free kills
      the flux.
  loop_circulation:
    verdict: established_as_topological_label_refuted_as_coulomb_mechanism
    positive_result: >-
      A compact vortex-tube complement carries a meridional H1 circulation
      class, but the smooth closed tube has a dipolar r^-3 far velocity and
      d^-3 leading interaction energy.
  helicity_hopf_source:
    verdict: refuted_as_automatic_euler_gauss_source
    positive_result: >-
      Helicity is a conserved nonlocal Hodge pairing and can encode linkage.
      Its variation is a coadjoint invariant row, not an independent scalar
      mediator equation. A scalar or pseudoscalar cannot source an isotropic
      transverse vector at linear order from its wavevector alone.
  nonlocal_transverse_source:
    verdict: refuted_for_linear_isotropic_translation_invariant_multiplier
    mechanism: >-
      Rotational covariance forces every scalar-to-vector Fourier multiplier
      to be longitudinal i*k*F(k^2), which the transverse projector kills,
      for nonzero k even when F is nonlocal or singular on the declared
      tempered/finite-energy domain.
    surviving_candidates:
      - contact distributions supported at zero wavevector
      - nonlinear or configuration-dependent topological maps
      - oriented vector source with global recoil and anisotropic interaction
      - broken-symmetry or nontranslation-invariant background
      - new scalar or longitudinal Gauss sector with its own action
strongest_exact_result: >-
  The puncture, loop-cohomology, helicity/Hopf-as-automatic-source and linear
  translation-invariant isotropic multiplier routes cannot produce smooth
  finite-energy scalar Coulomb charge from bare incompressible Euler. They do
  establish signed singular flux, smooth topological circulation and helicity
  as distinct internal labels. Contact zero modes and nonlinear or
  configuration-dependent topological maps remain unclassified candidates.
  A scalar Coulomb channel otherwise requires a declared scalar/longitudinal
  or singular Gauss sector; a transverse channel can support oriented sources.
next_dependency: >-
  Construct the autonomous oriented carrier/background recoil action on one
  persistent carrier and test its internal-doublet observable, while keeping
  any scalar/longitudinal foundation extension as a separately governed
  candidate that rebuilds the 0042 retained-state/history map.
does_not_license:
  - electric charge, electromagnetism, or magnetic coupling
  - an electron, neutrino, P5, or parent completion
  - a no-go for changed substrates, singular cores, or broken backgrounds
  - a no-go for contact zero modes or nonlinear configuration-dependent maps
