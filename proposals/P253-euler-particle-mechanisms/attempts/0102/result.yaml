attempt: P253/0102
title: Two-label forced axial lock and charged flavor bridge
route_verdicts:
  route_A:
    route: variable two-label forced equilibrium lock
    verdict: established_at_regular_tagged_equilibrium_scope
    strongest_result: >-
      For distinct transported chi_c and circle phase Theta,
      chi_c D_t lambda=(curl f) dot grad Theta.  On the charged Cao
      equilibrium Theta=theta and the modified Grad--Shafranov identity make
      lambda=zeta/chi_c an exact variable forced lock wherever chi_c is
      nonzero.
  route_S:
    route: global constant lock with the existing regular-band charge tag
    verdict: refuted_by_support_mismatch
    strongest_result: >-
      The reviewed chi_c vanishes outside its strict regular band while
      q_A=zeta occupies the full Cao core, so q_A=lambda_0 chi_c fails at
      every nonzero-vorticity core point outside tag support.
  route_B0:
    route: fixed-profile constant-ratio Maxwell reduction
    verdict: established_as_exact_contour_compatibility_row
    strongest_result: >-
      At order tau=g^2, all streamline-only corrections are removed by Q_P
      and constant locking requires
      Q_P[chi_0' Phi_hat-chi_0 H_hat]=0.  Lorenz and Ampere elimination fix
      the full epsilon_EM, mu_EM, c_EM and radius normalization of this row.
  route_B1:
    route: normalized straight-column Cao response
    verdict: blocked_at_actual_profile_and_tag_evaluation
    missing_construction: >-
      Evaluate the exact Volterra coefficient S_1 for the normalized
      Lane--Emden/Cao profile with its physical P orientation, major-radius
      scaling and annular tag cutoff.  The rejected universal sign argument
      does not supply this evaluation.
  route_B2:
    route: finite-curvature charged Cao response
    verdict: blocked_at_uniform_coupled_green_and_band_transfer
    missing_construction: >-
      Prove coupled Maxwell Green convergence on an actual subluminal Cao
      carrier path, retain the curved r^-2 Ampere row and control the tag-band
      boundary before transferring any column response.
  route_C0:
    route: global exponential-vorticity straight-column cancellation
    verdict: established_at_first_speed_column_scope
    strongest_result: >-
      If zeta_0'(P)=a_0 zeta_0(P), chi_0=zeta_0/lambda_0 and all fields use
      one global Green normalization, the electric dipole and Ampere response
      cancel exactly: S_1=0.  The resulting exponential vorticity is
      realized by an explicit Liouville column.  It is noncompact, has a
      logarithmically divergent infinite-column kinetic energy, and is not
      the Cao free-boundary carrier.
  route_C1:
    route: annular inner-outer Maxwell source matching
    verdict: established_at_source_range_scope
    strongest_result: >-
      On an exponential tagged annulus the compact-support mismatch is
      A s+B/s.  An inner source moment changes only B, an outer source moment
      changes only A, and the exact source-to-matching matrix has determinant
      -1/4.
  route_C2:
    route: compact Cao profile and material-leaf control
    verdict: blocked_at_joint_profile_free_boundary_fredholm_map
    missing_construction: >-
      Lift the two source moments through admissible vorticity-profile,
      streamfunction, free-boundary, circulation, mean-radius, tag-leaf,
      stabilizer and center rows without using a hidden fitting parameter.
  route_D:
    route: global advected circle phase and moving defect
    verdict: blocked_at_finite_action_moving_domain_construction
    missing_construction: >-
      Construct a branch-cut-independent advected phase and moving defect.
      Theta=theta uses the whole noncompact symmetry axis; a compact ring
      defect needs a different phase and a new q_A map.
  route_E:
    route: same-carrier flavor bridge
    verdict: blocked_at_shared_P4_action_chiral_current_and_P2
    missing_construction: >-
      Supply a persistent carrier, normalized shared action, noncommuting
      propagation/interaction basis and Lorentz chiral electron-linked
      current.  The axial lock alone supplies none of these.
evidence_scope:
  - exact_two_label_forced_lock
  - exact_existing_tag_support_obstruction
  - exact_constant_ratio_contour_projection
  - exact_comoving_Lorenz_and_Ampere_normalization
  - exact_radial_dipole_Green_identity
  - exact_global_exponential_profile_cancellation
  - exact_Liouville_exponential_column_realization
  - exact_annular_source_matching_determinant
strongest_exact_result: >-
  The charged Cao equilibrium automatically carries a variable two-label
  forced lock on its nonzero tag band, while its existing compactly supported
  tag cannot support a global constant lock.  Constant locking reduces to an
  exact Maxwell contour response with fully fixed physical normalization.
  No universal response sign is available.  A materially different global
  exponential-vorticity column cancels the first-speed response exactly, and
  compact annular matching has two independent source moments.  Realizing
  those moments in a compact Cao free-boundary/material-leaf family and
  constructing the moving phase remain open.
does_not_license:
  - a fixed-profile Cao constant-ratio refutation or construction
  - a finite-curvature charged Cao response theorem
  - a compact localized material defect or finite phase-gradient energy
  - identification of q_A with electromagnetic charge g chi_c
  - Lorentz chirality, weak interaction, flavor, or neutrino dynamics
  - a persistent carrier, shared universal action, Born/reset, or fermionic character
  - LP2, LP4, LP5, LP6, electron, neutrino, or parent completion
next_dependency: >-
  Evaluate the normalized Lane--Emden/Cao straight-column response and in
  parallel lift the exact two-moment annular source control through a compact
  profile/free-boundary/material-leaf map.  Then prove the finite-Cao coupled
  Maxwell Green transfer.  The moving phase and shared P4/P6 map remain
  independent downstream constructions.
