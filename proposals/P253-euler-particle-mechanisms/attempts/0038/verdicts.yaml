    repository_interpreter_exit: 0

unit_B:
  target: P253/0039
  route_verdict: established
  review_status: established_after_bounded_torus_frequency_correction
  evidence_scope: EXACT_LINEAR_WHOLE_SPACE_ACCESSIBLE_ESSENTIAL_NORM_GROWTH
  strongest_supported_statement: >-
    On the same fixed carrier and shell, if lambda_+>1 is the expanding
    Kelvin multiplier and T_* the meridional return time, then the exact
    whole-space linearized Euler group restricted to the kinetic closure of
    dynamically accessible tangents, modulo Euclidean symmetry tangents,
    satisfies ||S(j*T_*)||_ess >= lambda_+^j for every integer j>=1. Hence
    its semigroup growth bound is at least log(lambda_+)/T_*>0.
  operator_domain:
    status: established
    statement: >-
      The maximal projected-transport domain, bounded shear, invariant
      accessible part domain, whole-space Leray pressure, Biot-Savart tails,
      and potentially unbounded normalized packet graph norms are retained.
  quantifiers:
    status: established
    statement: >-
      For each fixed circuit count j, choose the tube width and then an
      integer frequency N_j. Neither one uniform growing-time WKB expansion
      nor one all-time growing initial datum is asserted.
  essential_norm_and_quotient:
    status: established
    statement: >-
      For every fixed j a normalized weakly-null accessible sequence retains
      lambda_+^j gain modulo compact operators. Finite-dimensional invariant
      Euclidean symmetry projections vanish on the sequence at input and
      output, so the bound descends to the quotient.
  source_applicability:
    source: Shvydkoy--Vishik, Dynamics of PDE 1 (2004), 49--63
    pdf_sha256: 9307efc6096565f74c5a099af25c834af09ba93b3e56ff34dd076ba289551592
    verdict: correctly_scoped_corroboration_only
    statement: >-
      The published theorem is on T^3 and full L2_div. It is not imported as
      an R^3, dynamically accessible, quotient, or graph-domain theorem; the
      whole-space bridge is derived directly.
  generator_pseudomode:
    verdict: blocked_with_missing_construction
    statement: >-
      No generator Weyl sequence or approximate-spectrum claim is needed or
      made; that route would require longitudinal phase closure and a graph
      residual.
  correction:
    status: passed
    mechanism: >-
      The action-angle oscillation is now exp(i*N*phi) with positive integer
      N and h=N^-1 throughout. Integer N_j can exceed every fixed per-circuit
      threshold, so all remainder and weak-null limits are unchanged.
    readme_pre_sha256: be8db67ef25fc542ef5721f87958386041ad1f70c8fe7ca95157076c54943fe4
    readme_post_sha256: c4f51f772e5eb17c134df23a47304560944693e828594ab761a1e9b654374b94
    derivation_pre_sha256: 0a47bea9732796586208d31f38490eee16e2d72c8a4a315ffee4e7a7bdea4fbb
    derivation_post_sha256: 4f78aa4a3f2057c2c883c17a885c13d76a6b95d64f44f4807e99af471cf90845
