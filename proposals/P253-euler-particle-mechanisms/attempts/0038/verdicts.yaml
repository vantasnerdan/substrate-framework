unit_A:
  target: P253/0032
  route_verdict: established
  review_status: established_after_bounded_source_oracle_correction
  evidence_scope: EXACT_SOURCE_RECURRENCE_ACCESSIBLE_HYPERBOLIC_KELVIN_RETURN
  strongest_supported_statement: >-
    There exists one smooth compact Gavrilov carrier and one sufficiently
    small derivative-resonant regular shell on a flat pressure plateau for
    which the full-pressure dynamically accessible physical Kelvin return has
    det(M)=1, tr(M)=2+22*pi^2*I+O(I^(3/2)), and
    Delta=88*pi^2*I+O(I^(3/2))>0. Its returned polarization map is
    hyperbolic with reciprocal positive real multipliers.
  source_scope:
    gavrilov: arXiv:1810.08020v1
    gavrilov_pdf_sha256: fcaca85faa77e3876b11d16718037169fc026112dfd3e4248e03e963a0ebc3c9
    baldi: arXiv:2302.02982v1
    baldi_pdf_sha256: 4fe82be0db15a7f117017e505e6682b3438ed14ebcf56225bd7e74bc759136f3
  accessibility:
    status: established
    mechanism: >-
      The leading normalized scalar omega_* dot khat is
      -1/sqrt(2)+O(epsilon), so every transverse velocity polarization is in
      the principal image of compact divergence-free coadjoint generators.
  frame_and_density:
    status: established
    statement: >-
      The physical cylindrical-frame angular velocity, moving transverse
      frame, cotangent lift, metric, and returned orientation are retained.
  correction:
    status: passed
    mechanism: >-
      The original spatial degree-at-most-two truncation omitted an
      O(epsilon^2) contribution to pointwise C2[1,0]. The repaired mp(z,4)
      oracle restores it and asserts the exact increment. That component is
      absent from the single-C2 trace functional, so the 22*pi^2 trace and
      88*pi^2 discriminant coefficients are unchanged.
    verifier_pre_sha256: 194fa4b83f08689bd77dae3cc0da6f0a26b12ffe72dd570e716367754a5d95c8
    verifier_post_sha256: 74535827251d9cb3edc23e2a9c016984f7cc0e7b2df70f16fecb0d16d218ddc2
    receipt_sha256: 3d51f187262a14c5b13bc957080a77efe4a5b34021220ebb0835cf0a656fa297
