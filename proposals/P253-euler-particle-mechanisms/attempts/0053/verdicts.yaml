target_0048:
  review_status: established_after_one_bounded_scope_correction
  evidence_scope: EXACT_CAO_CELLS_AND_FINITE_SPECTRAL_WINDOW_SEQUENCE_SCALING
  strongest_supported_statement: >-
    The exact rescaled Cao equation yields the stated odd first and even
    second local profile-cell recurrences. For each fixed l at the thin-ring
    endpoint, physical energy normalization gives curvature coupling
    O(delta^2/n), corrected crossing index
    l*L_Phi/(pi*c_l*delta*log(1/delta)) with absolute remainder
    O(1/(delta*log(1/delta)^2)+1), coupling-to-spacing and dyadic relative
    bad-measure ratios O(1/log(1/delta)), and an axisymmetric Schur tail
    O(delta^3*log(1/delta)).

checks:
  corrected_resonance_and_window:
    route_verdict: established
    quantifiers: fixed integer l at least 2 and sufficiently small delta
    crossing_index: >-
      l*L_Phi/(pi*c_l*delta*L_delta)
      + O(1/(delta*L_delta^2)+1)
    coupling: O(delta^2/n)
    local_spacing_ratio: O(1/L_delta)
    relative_bad_measure: O(1/L_delta)
    boundary: spectral coupling window, not a temporal propagation interval

  fixed_domain_chart_and_graph_equivalence:
    route_verdict: blocked
    missing_construction: >-
      Construct an orientation-preserving Hanzawa map and Piola pullback for
      velocity, pressure, vorticity, and accessible tangents, including axis,
      interface, collar, exterior, gauge and decay conditions, and prove
      two-sided physical energy/graph-norm equivalence.
    conditional_name: HJ2

  full_complement_resolvent:
    route_verdict: blocked
    positive_subclaim:
      route_verdict: established
      evidence_scope: AXISYMMETRIC_SEQUENCE_SCHUR_ESTIMATE
      schur_tail: O(delta^3*L_delta)
      homological_sequence_norm_squared: O(delta/L_delta)
    missing_construction: >-
      Prove a uniform graph resolvent across all azimuthal sectors, the axis,
      collar and interface traces, whole-space exterior pressure, neutral
      modes, adjoint domain, kernel and cokernel on the claimed contour.

  kks_energy_generator_normalization:
    route_verdict: blocked
    positive_subclaim:
      route_verdict: established
      statement: >-
        With A e=-i sigma e, the column mode has positive constrained-energy
        signature and KKS magnitude 1/abs(sigma); the same-Krein sign is
        fixed.
    missing_construction: >-
      Carry density, Jacobian, axial and azimuthal Fourier-volume, and
      real-to-complex factors through both bending and Kelvin coordinates in
      one physical canonical convention.

  cao_cells_and_global_graph_jet:
    route_verdict: blocked
    positive_subclaim:
      route_verdict: established
      evidence_scope: EXACT_LOCAL_PROFILE_CELL_CALCULUS
      statement: >-
        The first cell V is odd, the second cell Z is even, and the centered
        fixed-circulation local q^2 log(q) homogeneous cell vanishes by the
        limiting nondegeneracy.
    missing_construction: >-
      Twice differentiate the complete pulled-back moving-boundary
      whole-space Green/Leray operator, including pressure, Piola factors,
      interface, collar and exterior terms, with an o(delta^2) graph
      remainder.

  fixed_order_residual:
    route_verdict: established
    evidence_scope: CONDITIONAL_FORMAL_FIXED_ORDER_RESIDUAL
    hypotheses:
      - HJ2 fixed-domain graph construction
      - full complement inverse
      - physical Riesz projection and KKS normalization
      - fixed N at most p minus 2
      - N*l*abs(Omega_pattern) less than Omega(a)/2
    statement: >-
      Equations (52)-(53) are a formal residual of order O(abs(a)^(N+1));
      they are not coefficients of a constructed Euler branch.
    critical_harmonic_scale: Theta(1/(delta^2*L_delta))
    does_not_license:
      - approximate Euler evolution on a time interval
      - convergent nonlinear branch
      - all-time decoupling or stability

  conditional_finite_matrix:
    route_verdict: established
    evidence_scope: CONDITIONAL_SAME_KREIN_AVOIDED_CROSSING
    hypotheses:
      - exact physical KKS normalization
      - HJ2 graph jet
      - full graph-Riesz realization
    statement: >-
      Two positive-signature oscillators with the displayed Hermitian
      coupling have an elliptic avoided crossing rather than the
      opposite-Krein Hamiltonian-Hopf discriminant.

