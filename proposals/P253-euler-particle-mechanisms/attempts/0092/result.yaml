attempt: P253/0092
title: compact gauge character and same-carrier action selection
route_verdicts:
  route_A:
    route: existing transported real tag
    verdict: refuted_for_charge_quantization_and_nonzero_selection
    strongest_result: >-
      The exact family chi_lambda=lambda*chi has conserved charge
      Q_lambda=g_tag*lambda*C_chi for every real lambda.  Fixing one tag leaf
      conserves its chosen charge but does not select that leaf or a smallest
      nonzero value.  The reviewed charged Cao branch uses C_chi as input.
  route_B:
    route: compact material phase and global U1 character
    verdict: refuted_at_classical_compact_phase_route
    strongest_result: >-
      In the dimensionally complete number-density convention, the exact
      gauge-covariant first-order phase action has symplectic form
      S_0*integral(delta_n wedge delta_theta).  A chosen global compact U1
      character has integer weight m and Gauss source g_0*m*n, but the
      classical number N_phase and action S_0*N_phase are real and continuous.
      The action coefficient S_0 and charge unit g_0 are imported data.
      Prequantization and a quantum charge spectrum additionally require an
      action unit and quantization rule.
  route_C:
    route: compact U1 bundle magnetic flux and BF candidate
    verdict: refuted_at_smooth_whole_space_bundle_and_direct_Euler_BF_route
    strongest_result: >-
      H2(S3;Z)=0 and pi3(U1)=0, so a smooth finite-energy U1 bundle extending
      over compactified whole space is trivial.  H2(S2;Z)=Z classifies a
      magnetic Chern flux at infinity, not electric Gauss charge, and a
      nonzero class needs a removed/singular core or nonextendible bundle.
      Direct Euler vorticity is a real exact advected two-form rather than a
      compact two-form connection; compact BF data and its level are added
      structure.
  route_D:
    route: fixed-charge action locking and gauged common phase
    verdict: refuted_for_existing_classical_extension_and_minimal_common_phase
    strongest_result: >-
      The map (lambda,J)->(Q,J,S_EM(Q)) has exact fixed-Q tangent (0,delta J),
      so charge and Q^2/(4*pi*epsilon_EM*c_EM) do not fix carrier action.  Even
      Q=kappa_m*J leaves J continuous, where kappa_m=g_0*m/S_0 has units
      charge/action and is distinct from the transported-tag coupling g_tag
      absent a derived map.  Imposing J=S_EM(Q) creates a nonzero root
      4*pi*epsilon_EM*c_EM/kappa_m^2, but that equation is the missing law rather
      than a consequence of Euler-Maxwell dynamics; positive uncoupled energy
      instead selects J=0.
  route_E:
    route: shared bridge and quantum-statistical obligations
    verdict: blocked
    strongest_result: >-
      The classical U1 extension economically supplies a causal speed and an
      action-dimensional invariant, but the compact character, nonzero action
      locking, Born/reset mechanism, exchange character, and neutrino sector
      remain independent constructions.
    missing_construction: >-
      Derive a compact signed character and nonzero action-locking mechanism,
      then join the physical doublet/readout to Born, reset, exchange, and
      neutrino dynamics without importing the target action unit.
evidence_scope:
  - exact_dimensions_and_gauge_normalization_invariants
  - exact_signed_transport_tag_charge_family
  - exact_compact_phase_gauge_and_moment_map_distinction
  - exact_whole_space_and_sphere_at_infinity_U1_topology
  - exact_direct_Euler_vorticity_BF_supplier_failure
  - exact_fixed_charge_action_rank_counterdirection
  - exact_conditional_nonzero_action_root_for_both_coupling_signs
  - exact_Euler_similarity_action_nonselection_input
strongest_exact_result: >-
  In the reviewed classical transported-tag Euler-Maxwell extension,
  Q^2/(4*pi*epsilon_EM*c_EM) is an exactly normalized action-dimensional
  invariant but not a selected action.  Charge varies continuously across
  tag leaves; compact phase periodicity does not discretize its classical
  conjugate momentum; smooth whole-space U1 topology has no electric Chern
  class; and fixed Q leaves an independent continuous carrier-mode action
  direction.  Compact characters, dual/monopole sectors, or BF couplings can
  change this only by adding a representation, compact higher-form field,
  topological core, or normalization whose same-carrier origin remains open.
does_not_license:
  - a quantized or smallest nonzero electric charge
  - a universal action or identification with hbar
  - selection of a nonzero carrier-mode action
  - an Euler-supplied compact two-form connection or BF level
  - adoption of the U1 extension as bare Euler
  - Born probabilities or single-shot outcomes
  - autonomous reset or measurement dynamics
  - fermionic exchange or a two-carrier statistics theorem
  - electron, neutrino, P4, P5, or parent-campaign completion
next_dependency: >-
  Test a genuine same-carrier compact defect or two-form sector and derive its
  level and symplectic normalization rather than importing them.  In parallel
  complete the 0088 physical two-control doublet response and combine it with
  the reviewed outgoing Maxwell law as a source-specific two-by-two Feshbach
  shell measure.  Maintain a materially distinct P2 route: either construct
  an invariant or center-stable manifold controlling every negative and
  continuum channel, or build a carrier with a coercive full DA Hessian before
  attaching U1 readout.  Keep Born, reset, exchange, and neutrino mechanisms
  as separate active obligations.
