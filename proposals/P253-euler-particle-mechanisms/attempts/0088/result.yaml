exact_results:
  cylindrical_KKS_measure:
    statement: >-
      With bar omega=r*zeta*e_theta, dx=r dr dz dtheta, and normalized
      toroidal characters, the physical KKS density is rho0*r^2*zeta in
      dr dz. After the unitary half density it retains rho0*r*zeta in dy;
      the residual r=R*q is not dropped.
  actual_relative_Hessian:
    statement: >-
      The physical relative orbit Hessian is the kinetic Biot-Savart second
      derivative plus the symmetrized second push-forward paired with the
      energy-impulse first derivative. This retains the orbit constraint term
      and is not kinetic L2 energy.
  physical_left_covector:
    statement: >-
      For A_phys e_a=-i*nu_star*e_a and actual-E2 unit normalization,
      ell_a(q)=E2_phys(q,bar e_a)=-i*nu_star*Omega_KKS(q,bar e_a), with
      nu_star=Omega_a*sigma_star. Hence Omega(e_a,bar e_b)=i*delta_ab/nu_star.
  degenerate_compression:
    statement: >-
      In the KKS frame continued from the incoming simple branches, the full
      covariant compression M(h)_ab=ell_a((nabla_h A)e_b) is anti-Hermitian
      at the exact double eigenvalue. Two seeds are an invariant noncommuting
      pair exactly when their compression commutator is nonzero.
  Feynman_Hellmann:
    statement: >-
      Along a differentiable steady operator/eigenbranch,
      ell_a((nabla_h A)e_a)=-i*D_h nu_a. For an arbitrary same-leaf DA seed
      this remains an exact instantaneous compression but is not called an
      eigenfrequency derivative.
  full_Hodge_dual_density:
    statement: >-
      If the KKS-derived left row has local density a, exact whole-space
      integration by parts gives g=B[-(grad e)^T a-(e dot grad)a]
      +(Be dot grad)a+(grad Be)^T a, and C0^*g=(grad baromega)^Tg
      +(baromega dot grad)g modulo the actual row annihilator.
  patch_lower_bound:
    statement: >-
      For an explicit bounded primal row projection P_row, a curl witness of
      P_row^* C0^*g on a meridional patch of radius rp gives the exact
      fixed-carrier H5-response scale c*gamma*rp^7. The adjoint identity
      prevents row restoration from cancelling the numerator. This is not a
      uniform high-N estimate before all physical Piola factors are carried.
  diagonal_zero_zero_stabilizer:
    statement: >-
      In volume action-angle variables every compact divergence-free
      ell=d=0 displacement has xi^I=0 and commutes with zeta(I)partial_theta.
      Therefore the frozen Y_(0,0)^4 tangent and G3 on it vanish identically.
    verdict: refuted_route
  curvature_character_and_loss:
    statement: >-
      The exact first cylindrical curvature rows have meridional characters
      d=plus_or_minus_1. A diagonal response from the m-zero column modes
      therefore has first symmetry-allowed order delta times D_curv.
      Regrading the exact operators
      in a two-parameter A(delta,k) extension at fixed massive k gives
      explicit G1,D1,L1,P1,B1,A1 blocks and reduces
      D_curv to a one-dimensional source-mode integral containing the direct
      pressure/frame row and both reduced-resolvent mode corrections. The
      regular-band DA map supplies arbitrary compact radial coefficients and
      the direct massive term gives the explicit multiplication constituent
      sI. The full branch-dependent order-zero symbols and shrinking-gap
      reduced-resolvent bounds are not yet controlled. If a normalized
      nonzero coefficient is proved and transfers uniformly on delta_N
      asymptotic 1/N, the diagonal response loses N^-1.
      Physical samples use k_N=delta_N*n_N and retain A0(k_N)-A0(k_star)
      separately unless k_N-k_star=o(delta_N).
    boundary: fixed_pair_cokernel_or_collective_symbol_theorem_and_actual_Cao_graph_C1_transfer_not_established
  offdiagonal_column_response:
    statement: >-
      The KKS identity cancels the apparent 1/W orbit inverse and gives an
      explicit L2 vorticity covector for the actual Hessian row. Sobolev
      extension makes its velocity functional global and extension
      independent on the physical velocity image. The rank-one dual Riesz
      range and the regular-axis/interface/decaying-K1 adjoint Sturm problem
      identify the cutoff-independent physical left functional. Its explicit
      singular-axis recurrence and core relation Asharp1=rho0*A1 make the
      leading radial amplitude nonzero. Hence the full Hessian-row compression
      density F=(v2 dot grad)lambda1-(grad v2)^T lambda1 has a nonzero alpha
      coefficient proportional to A2*Asharp1*(k1/k2-1)*s. A punctured regular
      annulus supplies an explicit compact DA seed, and rational-ray character
      exclusion removes all finite rows, proving gamma_12^col>0.
    transfer: >-
      For the explicit seed, reviewed common-graph/Riesz/Hodge convergence,
      direct convergence of both terms of the core-time orbit Hessian
      E2hat=E2phys/Omega_N, exact action-flow pushforward of the displacement,
      and the smooth bilinear bracket estimate give
      Mphys_12_N/Omega_N=Mhat_12_col+o(1), with Omega_N positive. Thus
      every sufficiently large member of the constructed rational-ray exact
      crossing sequence on the reviewed 0083/0089 path has an actual compact
      DA seed with nonzero physical response. The convergent objects are the
      E2hat-unit modes and scaled dual rows; physical modes and rows are
      recovered per member by ephys=ehat/sqrt(Omega_N) and
      ellphys=sqrt(Omega_N)ellhat.
    boundary: uniform_physical_Y4_normalization_not_established
  two_offdiagonal_alternative:
    statement: >-
      Two independently realized off-diagonal histories with coefficients
      c1,c2 have nonzero compression commutator iff Im(c1*conjugate(c2)) is
      nonzero. This avoids curvature loss algebraically but is not supplied
      by two hand-selected phases of one seed.

