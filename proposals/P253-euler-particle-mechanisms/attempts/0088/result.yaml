strongest_exact_verdict: >-
  The actual physical KKS dual of each positive Cao mode is exactly its
  relative-Hessian row, with the physical core clock and cylindrical radius
  retained. At an exact crossing the full covariant two-mode compression is
  anti-Hermitian, so noncommuting analyzer directions have a basis-invariant
  matrix criterion. Exact KKS cancellation and dual-Riesz/Sturm uniqueness
  provide the global physical left functional. The fixed-column
  off-diagonal coefficient is proved nonzero by its complete near-axis density
  and an explicit compact constrained DA seed; a source-specific common-domain estimate
  transfers that nonvanishing to every sufficiently large member of the
  reviewed 0083/0089 rational-ray exact-crossing sequence after the exact
  physical/core-time conversion Mphys/Omega_N=Mhat. Per-mode physical
  E2/KKS normalization is retained, but no convergence of unscaled physical
  left rows is asserted. The preregistered ell=d=0 diagonal seed is
  exactly a stabilizer and is refuted; the first curvature-mixed replacement
  has d=plus_or_minus_1 and is reduced to an explicit fixed-pair
  adjoint/cokernel condition without a false shrinking-gap compactness claim.
  Two independent
  off-diagonal histories provide a distinct no-curvature-loss alternative.
  A uniform physical Y4-normalized control-seed response, an independent
  second axis, and an autonomous gate remain open.

