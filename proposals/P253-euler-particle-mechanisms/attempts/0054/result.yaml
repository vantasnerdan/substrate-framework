  common_DA_domain:
    verdict: established
    positive_result: >-
      Relative Hodge decomposition on the fixed solid torus retains the
      harmonic circulation row. The common d^p boundary factor and a weighted
      Hardy estimate identify the gauge-fixed stabilizer quotients and their
      closed DA energy ranges uniformly. Cross-delta maps are operator
      identifications; only same-carrier displacements are coadjoint motions.
  moving_boundary_hodge_leray_jet:
    verdict: established
    positive_result: >-
      The exact Piola-conjugated Biot-Savart kernel cancels its volume
