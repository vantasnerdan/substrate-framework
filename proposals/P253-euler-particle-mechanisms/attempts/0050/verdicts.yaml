unit_a_0046:
  unit_verdict: established
  review_status: established_after_bounded_precision_correction
  evidence_scope: EXACT_CLASSICAL_KKS_HEISENBERG_AND_FINITE_CCR_BOUNDARY
  kks_plane:
    route_verdict: established
    hypotheses:
      - B is nonzero
      - Hq is positive
      - Hq times P minus N squared is positive
    generator: one_over_B times matrix_rows_N_P_and_minus_Hq_minus_N
    frequency_squared: (Hq times P minus N squared) divided by B squared
    maximum_verdict: exact positive classical tangent oscillator
    invariant_nonlinear_euler_manifold:
      route_verdict: blocked
      missing_construction: >-
        Prove that the physical tangent plane extends to an invariant carrier
        manifold under unrestricted nonlinear Euler evolution.
  affine_observation_algebra:
    route_verdict: established
    brackets:
      theta_L: 1
      G_L: B squared divided by P
      theta_G: 0
    algebra: affine Heisenberg translation algebra
    compact_su2_in_this_block: refuted
  finite_ccr_truncation:
    route_verdict: refuted
    mechanism: >-
      The noncompact oscillator has an infinite ladder and every finite matrix
      commutator has zero trace, contradicting [Q,P]=i hbar I for nonzero
      hbar.
    failure_scope: EXACT_CCR_TRUNCATION_OF_THIS_NONCOMPACT_PLANE
    does_not_refute: >-
      A separately constructed physical compact su2 KKS orbit or reduction
      with its own Euler realization.
  two_copy_exchange:
    route_verdict: blocked
    missing_construction: >-
      Construct a collision-free invariant same-field two-carrier exchange
      path, endpoint identification, and physical KKS or line-bundle holonomy.
  stochastic_variational_extension:
    conditional_route_verdict: established
    evidence_scope: DECLARED_EXTENDED_SUBSTRATE_LAW
    new_inputs:
      - configuration probability density
      - diffusion coefficient D
      - mass and action scale hbar_ext equals 2mD
      - osmotic dynamics and probability interpretation
  circulation_selection:
    route_verdict: refuted
    failure_scope: BARE_UNIVERSAL_TOPOLOGY_ONLY_SELECTION
    mechanism: circulation scales continuously as A divided by B
    remains_open:
      - a background-selected action scale
      - a separately axiomatized circulation quantum

unit_b_0049:
  unit_verdict: established
  review_status: established_after_bounded_precision_correction
  evidence_scope: EXACT_CONDITIONAL_EXPONENTIAL_FIRST_EVENT_AND_RESET_THEOREM
  analyzer_intensities:
    conditional_route_verdict: established
    hypotheses:
      - normalized nonzero state
      - exactly unitary analyzer
    statement: nonnegative channel intensities sum exactly to one
    actual_euler_analyzer:
      route_verdict: blocked
      missing_construction: >-
        Construct an autonomous same-carrier analyzer evolution producing the
        claimed unitary channel map and physical nonnegative energy readouts.
  exponential_race:
    conditional_route_verdict: established
    hypotheses:
      - independent exponential temporal clocks
      - rates lambda_i equal common positive kappa times intensity I_i
      - exclusive first capture
    infinite_window_winner: lambda_i divided by total_rate
    finite_window_outcome: >-
      lambda_i divided by total_rate times one minus exp of negative
      total_rate times T
    finite_window_no_event: exp of negative total_rate times T
    ties: probability zero for independent continuous positive-rate clocks
    zero_channel: never wins
    all_zero: no finite event and conditional winner undefined
  deterministic_threshold:
    route_verdict: established_as_exposing_identity
    convention: event threshold lambda is at most I
    probability: F(I) for F(x) equal P(lambda at most x)
    implication: Born fraction I requires the uniform CDF or a derived equivalent
    physical_basin_measure:
      route_verdict: blocked
      missing_construction: >-
        Derive exclusive detector basins with those measures under one fixed
        unresolved-state law for every state and analyzer setting.
  reset_and_sequential_transition:
    conditional_route_verdict: established
    hypotheses:
      - projective reset to the selected output ray
      - fresh independent clock preparation for the next trial
    transition_probability: absolute_squared_V_ji
    autonomous_finite_volume_euler_reset:
      route_verdict: refuted
      mechanism: >-
        A reversible measure-preserving time map on finite invariant phase
        volume cannot be many-to-one or attract positive-volume basins onto a
        projective reset state.
    first_exit_or_scattering:
      route_verdict: open
      boundary: >-
        Reversible first-exit or scattering may retain escaped degrees and
        select an outcome, but does not itself reprepare sequential trials.
  deterministic_rare_event_detector:
    route_verdict: blocked
    missing_construction: >-
      Prove a joint intensity-proportional temporal hitting law with exclusive
      finite-energy capture on the same retained Euler carrier.
  retained_state_and_pressure:
    route_verdict: required_supplier_boundary_established
    statement: >-
      Any physical detector must retain its load-bearing w0 and reconstruct
      pressure from the full field v+w on the same local Euler interval.
  action_and_finite_speed:
    route_verdict: active
    statement: >-
      The common clock rate cancels and selects no action scale; the
      first-event law supplies no finite-speed theorem and does not remove the
      elliptic full-pressure coupling.

