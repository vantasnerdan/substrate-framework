  review_status: established_after_one_bounded_precision_correction
  evidence_scope: EXACT_CLASSICAL_TWO_STATE_BOUNDARY_AND_CONDITIONAL_FIRST_EVENT_DETECTOR
  strongest_supported_statement: >-
    The accepted compact pair is an exact classical KKS oscillator with an
    affine Heisenberg observation algebra; exact finite CCR truncation of that
    plane fails, without refuting a different compact su2 reduction. Separately,
    normalized unitary channel energies yield exact first-event and sequential
    projective probability tables under explicit independent-clock, exclusive-
    capture, reset, and renewal hypotheses. Current Euler suppliers do not
    construct those detector laws or an autonomous reset.
  next_dependency: >-
    Construct a physical analyzer and deterministic first-exit or scattering
    detector on one persistent compact carrier, derive its joint
    intensity-proportional hitting law from the retained Euler state including
    w0 and full pressure, retain escaped degrees for reversibility, and supply
    an explicit enlarged-state or external repreparation mechanism. A compact
    su2 carrier reduction remains a separate positive state-space route.

