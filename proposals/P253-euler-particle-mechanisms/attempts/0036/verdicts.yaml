strongest_supported_statement: >-
  For the accepted small whole-space axisymmetric Euler solitary family, the
  physical 2*pi*rho_m Clebsch action exactly reproduces axisymmetric Euler on
  compact regular label strips; the finite-domain axial impulse equals the
  canonical translation bulk term plus the oriented boundary one-form; the
  mixed-Casimir distribution is the two-end Clebsch jump and has a controlled
  positive leading term of order mu*L_mu on every compact regular label
  annulus, hence is exactly nonzero for sufficiently small nonzero mu; the
  complete translating-frame axisymmetric Hodge-coupled linearization and its
  translation and speed-branch identities are exact; and fixing material
  angular momentum gives the exact finite-domain Routh reduction and the
  corrected whole-space relative Routhian on its declared finite-excess
  domain. The Varholm--Wahlen--Walsh conditional-stability theorem does not
  transfer because its one-negative-direction Hessian hypothesis is violated.
components:
  clebsch_equations:
    status: established
    scope: >-
      Correct bracket, symplectic sign, swirl source, Hodge reconstruction,
      gauge covariance, meridional measure, and common 2*pi*rho_m multiplier
      on regular strips and compact/fixed-end relative variations.
  finite_domain_impulse:
    status: established
    scope: >-
      Exact counterclockwise boundary one-form with both axial ends and radial
      boundaries retained; the canonical bulk momentum is available only
      when the surface term vanishes or is fixed on the leaf.
  solitary_end_jump:
    status: established
    scope: >-
      Exact jump integral and exact solitary integrand, plus a uniform
      o(mu*L_mu) expansion on every compact regular annulus with strictly
      positive leading coefficient. No absolute gauge-dependent endpoint
      value or global equal-end chart is claimed.
  full_linearization:
    status: established
    scope: >-
      Exact formal full-field axisymmetric Euler derivative including K*eta,
      with L_c*q_z=0 and L_c*q_c_derivative=-q_z. No closed-generator,
      resolvent, spectral-gap, propagation, or stability theorem follows.
  material_routh:
    status: established_after_bounded_correction
    scope: >-
      Exact fixed-angular-momentum partial Legendre transform on finite
      material domains/compact variations and exact relative whole-space
      formula with relative incompressibility constraint on the declared
      convergence domain.
  varholm_transfer:
    status: refuted
    mechanism: >-
      Assumption 6 of arXiv:1811.08024v2 requires one simple negative Hessian
      eigenvalue, one simple symmetry zero, and a positive remainder separated
      from zero. The actual accessible traveling Euler form has independent
      negative high-frequency directions and is not bounded in the kinetic
      topology. This refutes only the theorem-transfer route, not stability or
      existence of the Euler wave.
correction:
  required: true
  checked: true
  fully_closes_finding: true
  mechanism: >-
    The initial material formulas were written as absolute whole-space
    integrals even though the reference L_infinity/r column makes them
    divergent. The correction scopes the absolute formulas to finite domains
    or compact variations, adds the fixed-background relative Routhian with
    xi^2/(2a^2), retains the relative volume constraint, and declares the
    convergence domain. The added term is fixed label data and changes no
    Euler equation or centrifugal sign.
