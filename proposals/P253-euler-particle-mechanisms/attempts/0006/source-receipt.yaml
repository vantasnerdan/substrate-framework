      intensity_scaling: integral omega_i dz dr equals a_i divided by abs(log epsilon)
      interaction_scaling: bounded and Lipschitz of order abs(log epsilon)^-1 while radial supports separate
      support_result: uniform sharp radial support localization only
      axial_result: concentration of mass near a moving center, not localization of the whole support
      pair_admissibility: requires centers at distinct fixed radii separated by at least 2D
