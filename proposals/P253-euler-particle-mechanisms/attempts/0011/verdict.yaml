units:
  A0005:
    disposition: established_after_bounded_correction
    route_verdicts:
      full_euler_poincare_and_orbit_action: established
      hodge_biot_savart_state_completion: established
      local_regular_clebsch_pullback: established
      arbitrary_H1_global_clebsch_completion: refuted_with_mechanism_named
      compact_swirl_rotation_kks_sphere: established
      conditional_prequantum_su2_lift: established_conditionally
    failure_mechanism: >-
      On T3, u=h(t) and B=0 satisfies the displayed local Clebsch/curl rows for
      arbitrary h(t), while periodic Euler requires hdot=0. The bulk label
      action and stated overlap cocycle do not explicitly vary or evolve this
      harmonic/circulation row.
    strongest_positive_result: >-
      The density-normalized Euler-Poincare and local coadjoint-orbit actions,
      full Hodge state reconstruction, local regular Clebsch KKS pullback, and
      the compact radial swirl S2 KKS form and 4*pi*j period are exact. With an
      imported hbar, integral N=2*j/hbar gives the standard conditional SU2
      central action (-1)^N; it is not a particle or quantum completion.
    minimum_corrections:
      - >-
        Scope the Clebsch action/descent to H1=0/decaying Euclidean data or an
        explicitly fixed admissible cocycle sector, or add and vary the missing
        harmonic/circulation variables.
      - >-
        Describe radial-cutoff rotations as valid tangent and time-dependent
        orbit lifts, not an SO3 subgroup of Diff_c; use the ordinary rigid SO3
        action in the larger volume-preserving group for the global sphere.
      - >-
        Keep h as global instantaneous reconstruction data and Kelvin
        circulation information; do not call fixed-basis harmonic coefficients
        time invariants without a separate evolution proof.
  B0009:
    disposition: established_after_nonloadbearing_wording_correction
    route_verdicts:
      exact_nonlinear_split_and_energy_exchange: established
      exact_triangular_euler_family: established
      bounded_operator_volterra_elimination: established
      bessel_kernel_and_initial_sine_forcing: established
      finite_constant_coefficient_linear_realization: refuted_with_mechanism_named
    strongest_positive_result: >-
      The periodic triangular finite-amplitude Euler family has an exact bounded
      resolved/unresolved elimination with kernel beta*J1(beta*t)/t and
      deterministic forcing +/-epsilon*J1(beta*t)/t. Natural equal-energy
      nearby initial profiles with the same resolved amplitude have opposite
      resolved slopes, and the non-rational square-root resolvent excludes only
      exact all-time finite-dimensional constant-coefficient linear
      realizations.
    minimum_corrections:
      - >-
        Attribute the real arcsine interval [-|beta|,|beta|] to the
        self-adjoint frequency operator i*L_k=beta*sin(y); the skew-adjoint L_k
        has spectrum i[-|beta|,|beta|].
