attempt: P253/0085
title: joint charged-Cao Hessian and radiation-channel classification
route_verdicts:
  route_A:
    route: one-sign constrained joint energy coercivity
    verdict: refuted
    strongest_result: >-
      For every fixed subluminal speed, E_EM-c P_EM,z is an exactly positive
      completed-square field block. Its Gauss/divB constrained minimum at
      charge tangent q=g delta_chi is the positive anisotropic H-minus-one
      form (1-beta^2)|qhat|^2/[2 epsilon
      (|k_perp|^2+(1-beta^2)k_z^2)]. Nevertheless, the uncharged joint
      relative Hessian has infinitely many positive pure-Maxwell directions
      and infinitely many negative high-frequency dynamically accessible Cao
      rearrangement directions. Those fixed strict signs persist for a
      sufficiently small charged branch, conditional on its reviewed
      existence. The full joint Hessian is therefore a strong saddle, not a
      one-sign or finite-Morse-index coercive form.
  route_B:
    route: ordinary Riesz persistence of neutral Cao modes
    verdict: refuted
    strongest_result: >-
      In the translating frame the free Maxwell branches are
      -i c k_z plus-or-minus i c_EM |k| and fill iR. Scaled compact-curl
      cutoff plane waves, including a k_L to zero construction at lambda=0,
      give normalized constrained weak-null graph sequences with vanishing
      residual after finite-row correction. Hence iR lies in the Fredholm
      essential spectrum of the localized coupled carrier. Thus imaginary Cao modes are embedded in
      the joint continuum even when isolated in a fluid fiber. Direct Kato
      persistence remains applicable only to a genuinely isolated off-axis
      eigenvalue under common-domain hypotheses.
  route_C:
    route: dark-current or radiation-resonance continuation
    verdict: blocked
    strongest_result: >-
      A comoving mode of frequency omega has Maxwell denominator
      |k|^2-(omega+c k_z)^2/c_EM^2. A localized finite-energy periodic mode
      necessarily requires the transverse Fourier transform of
      g(chi delta_u+u delta_chi) to vanish to sufficient order on every
      component of its nonempty smooth real radiation shell.
      A nonzero trace excludes a localized L2 Maxwell field for that
      prescribed real-frequency source and activates, but does not itself
      construct, a weighted outgoing resonance and
      Fermi-golden-rule/gate-time leakage estimate. SO2 character alone does
      not close the channel because Maxwell radiation contains every integer
      azimuthal character. Shell cancellation is not called sufficient until
      the weighted Maxwell resolvent and coupled feedback are solved; genuine
      compact nonradiating currents remain possible. The source-specific
      on-shell matrix element has not yet been evaluated for the actual 0079
      modes.
retained_positive_results:
  - exact positive subluminal comoving Maxwell quadratic
  - exact anisotropic Gauss-fiber H-minus-one charge Schur form
  - exact modewise tag-vorticity locking on the zeta-zeta-prime regular band
  - exact full-joint Fredholm Maxwell essential-spectrum inclusion
  - exact source-specific dark-current criterion for an embedded mode
  - exact star-shaped radiation-shell coarea weight and nonnegative trace functional
  - reduced steady high-frequency sign preserved modulo a finite-dimensional low block
strongest_exact_result: >-
  The declared Euler-Maxwell extension admits a positive field Hessian and a
  positive O(g^2) H-minus-one charge Schur form, but its full relative Hessian
  is strongly indefinite because the Cao rearrangement and free-radiation
  sectors have opposite signs. Whole-space Maxwell radiation embeds every
  imaginary internal frequency in joint essential spectrum. Stability of a
  charged Cao carrier therefore requires a reduced/modulated radiation
  theorem or a source-specific dark mode, not ordinary joint coercivity or a
  fluid-fiber Riesz argument.
does_not_license:
  - spectral instability from Hessian indefiniteness alone
  - full three-dimensional stability or instability of the charged carrier
  - a source-specific dark mode or a signed Fermi-golden-rule rate
  - L2 or positive-Sobolev tag control from Coulomb energy
  - stability of the full evolution from a steady slaved-Maxwell reduction
  - action or charge quantization
  - an isolated joint Schwinger-Hopf analyzer doublet
  - Born statistics, exchange character, or relativistic Euler propagation
  - adoption of the U1 extension into bare Euler
  - electron, neutrino, or parent-campaign completion
next_dependency: >-
  Evaluate the on-shell transverse current and its limiting-absorption dual
  for the two actual 0079 crossing modes, including physical KKS
  normalization and the full gate-time leakage scale. In parallel test the
  reduced axisymmetric rearrangement functional after steady Maxwell
  elimination and formulate a modulated local-decay theorem retaining
  outgoing radiation. Preserve the bare-Euler carrier and action-selection
  routes independently.
