      Under Omega(Ax,y)=K(x,y), a skew-adjoint invertible A on a declared real
      Hilbert domain can define J=A(-A^2)^(-1/2) and positive
      G_J(x,y)=Omega(Jx,y). No actual carrier sector meeting these hypotheses
