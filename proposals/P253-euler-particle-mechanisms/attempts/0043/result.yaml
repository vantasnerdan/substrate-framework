      The unordered two-center configuration retracts to RP2 and permits both
      unitary characters of Z2. The Hopf-map theorem makes the 2*pi rotation
      class Q mod 2. Equality with an exchange phase additionally requires the
      realized exchange loop to map to that class; the Euler inclusion, loop
      transfer and character selection are absent.
