      action unit and gives a bosonic CCR Fock construction; CAR statistics and
      a physical measurement rule do not follow from that classical sector.
  relativistic_collective_dynamics:
    verdict: exact_bare_euler_route_refuted_effective_band_route_open
    statement: >-
      Rest is the whole-space absolute-finite-energy symbol. A nonzero uniform
