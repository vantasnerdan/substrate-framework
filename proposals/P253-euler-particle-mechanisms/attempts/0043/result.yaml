      Given a specified global measure-preserving invariant Euler phase-space
      flow and invariant probability measure, normalized L2 states give an
      exact unitary Koopman representation. No such global 3D flow/measure is
      constructed here. Bounded physical functions commute, with explicit
      common domains required for unbounded multiplication observables; this
      is classical ensemble probability, not a derived quantum measurement.
  physical_kks_sphere_quantization:
    verdict: established_conditionally_action_selection_blocked
    statement: >-
      The nondegenerate physical Euler rotation sphere with j>0 and period 4*pi*j has Chern number
      N=2*j/hbar; invariant Kahler polarization gives dimension N+1 and spin
      N/2, including a two-state spin-half representation at N=1. Continuous
      Euler scaling changes j and does not select hbar or N=1.
  two_carrier_exchange:
    verdict: topology_established_euler_selected_fermionic_character_blocked
