exact_results:
  physical_measure_and_rows:
    statement: >-
      dnu=r dr dz is the cylindrical base measure, dm=zeta*dnu is the
      vorticity-weighted measure, kappa=int dm, and exact mean radius is
      R=kappa^-1 int r dm. The B_R row is int(r-R)dm=0 and is distinct from
      the physical impulse row.
  scale_coefficient:
    statement: >-
      Simultaneous normalization of the local Cao PDE and circulation fixes
      C_s=(Lambda_p/kappa)^((p-1)/2)*R^(-(p+1)/2), with
      D_delta=C_s/R. This agrees with the exact second equation of Cao (3.36)
      and is not fitted from the Kelvin-Hicks law.
  compact_W_uniformization:
    statement: >-
      Along a fixed-mean bordered path, W_epsilon=c_epsilon/log(1/epsilon)
      remains in a compact positive interval around kappa/(4*pi*R). The proof
      of Cao Proposition 3.13 is pointwise in epsilon and its coefficients are
      uniform on this compact W and center set, so its O(epsilon^2) center and
      O(epsilon^3*abs(log epsilon)) scale estimates retain one constant.
    authority_note: author_derivation_not_literal_source_statement
  mean_center_conversion:
    statement: >-
      The leading refined density is radial, its first correction is odd in
      r-x_epsilon,1 with relative size O(epsilon), and its remainder is
      O(epsilon^2*abs(log epsilon)). In the exact mean row this gives
      R-x_epsilon,1=O(epsilon^2), hence R-r_epsilon_star=O(epsilon^2); mean,
      maximum center, and auxiliary radius are not identified.
  geometric_scale_value_theorem:
    statement: >-
      The second equation of Cao (3.36), Proposition 3.13, the mean-center
      conversion give the refined Cao scale an O(epsilon^3*abs(log epsilon))
      error. Lemma A.2 alone gives only an O(epsilon) relative boundary graph,
      so the safely supported meridional area-radius conclusion is
      s_epsilon=C_s(kappa,R)*epsilon+O(epsilon^2) and
      delta=D_delta*epsilon+O(epsilon^2). No unproved first Fourier-mode
      cancellation and no derivative of a value-level remainder is used.
  massive_delta_coverage:
    statement: >-
      For n1=N*P and n2=N*Q, buffered external-epsilon endpoints on the one
      connected fixed-(kappa,R) B_R component straddle the target geometric
      delta endpoints. After multiplying the scale error by n1 it is O(1/N).
      Choosing h_N to dominate both that quantity and the
      reviewed spectral error makes both o(h_N), while continuous simple
      Riesz labels permit the 0079 IVT.
    uniform_lemma: >-
      On the exact reviewed fixed-K positive-part source space, the bordered
      inverse has uniform norm M, the derivative and explicit rescaled
      Green/log residual have moduli omega and omega0, and one contraction
      radius in relative epsilon. Multiplicatively overlapping charts plus
      local uniqueness cannot terminate at positive epsilon. Profile
      compactness prevents chart drift.
    error_envelope: >-
      Before h_N is defined, bar_rho_N is the tail supremum of Dcol-to-X
      graph, both Riesz, and both simple-frequency errors on fixed preliminary
      [c_minus/L,c_plus/L] carrier bands for the actual integer fibers
      n_1=LP and n_2=LQ, compared with columns at
      k_i(epsilon)=delta(epsilon)n_i. The fixed massive compacts are only
      uniform containers, not independent continuous toroidal fibers. A
      sequential compactness contradiction using the parameter-only fixed-
      space pullback, C2,beta profile compactness, normalized Lane-Emden
      uniqueness under the fixed rows, common-domain graph convergence, the
      fixed-contour resolvent identity, and rank-one simplicity proves
      bar_rho_N tends to zero. Then h_N=sqrt(max(bar_rho_N,1/N)) is
      noncircular. Eventually the
      actual buffered segment lies in that preliminary band, h_N<k_star/2,
      N>4*P*A_cov/k_star gives both band inclusions and positivity, and one
      A_cov controls the full segment.
    promotion_boundary: 0083_author_result_still_requires_its_own_independent_review
  constrained_response_reduction:
    statement: >-
      On a smooth regular cell the exact derivative
      V_h e2=-[B h,e2]-[B e2,h], h=[xi,Omega], can be integrated through the
      whole-space Hodge map to int xi dot F12. For a bounded primal oblique
      row projection P_row, nonzero curl(P_row^* F12) at one point is the
      correctly typed compact-seed predicate; adjointness prevents row
      restoration from cancelling the numerator. The diagonal difference
      has the same construction.
    remaining_input: >-
      The actual mode and KKS covector normalization are not available, so
      neither curl predicate nor its quantitative high-harmonic scaling is
      evaluated.
  finite_charged_hierarchy:
    statement: >-
      The speed is c_N=alpha*(log N+C_ray)+o(1),
      alpha=kappa/(4*pi*R). With |remainder|<=C_rem, a sufficient subluminal
      ceiling is N_EM_suf=exp((c_EM-m_EM-C_rem)/alpha-C_ray). If
      N_min=floor(max(N_graph,N_IVT,N_response,N_Pois))+1, a charged crossing
      requires the explicit finite inequality N_min<N_EM_suf.
    remaining_input: >-
      N_graph and N_IVT are finite, but N_response is not yet finite because
      physical KKS normalization, nonzero response, autonomous histories, and
      two-sided gate estimates remain open.

