  - exact_outgoing_Poynting_sign_and_prefactor
  - exact_comoving_shell_gradient_and_coarea_weight
  - exact_positive_Gaussian_curl_current_power
  - exact_net_neutral_oscillatory_charge_row
  - exact_conserved_envelope_completion
  - exact_late_transverse_free_field_spectral_norm
  - conditional_plateau_T_times_power_plus_bounded_switching_remainder
  - conditional_reciprocal_amplitude_and_energy_decay_conversion
strongest_exact_result: >-
  A smooth localized conserved comoving current in the reviewed U(1)
  Euler--Maxwell extension has an exactly normalized nonnegative outgoing
  power determined by its transverse trace on the Doppler shell.  A conserved
  finite envelope requires the explicit a_prime*K current, and the late
  radiation gives an operational gate observable.  The moving-volume identity
  gives an exact separate relative-flux balance.  For a reciprocal normalized
  carrier mode, amplitude width and energy loss differ by the exact factor of
  two shown above.
does_not_license:
  - a nonzero Cao shell current or physical response lower bound
  - a resonance pole or damping law without reciprocal analytic closure
  - an L2 Maxwell eigenmode from an exponentially small nonzero shell trace
  - a gate bound without physical KKS action, mode current, and gate history
  - infinite-world-tube equivalence to the late-field energy without a decay and endpoint limit theorem
  - a universal action, Born weights, reset, exchange, or fermionic character
  - derivation or selection of epsilon_EM, mu_EM, c_EM, g, charge, or action
  - a bare-Euler result or adoption of the U1 extension
  - electron, neutrino, P4, P5, or parent-campaign completion
next_dependency: >-
  Consume the independently reviewed 0087 shell upper bound and the future
  reviewed 0088 physically normalized current only after each is established,
  then test the exact integer radiation window using
  T_gate*P_out/(nu_phys*A_mode).  In parallel construct the reciprocal
