attempt: P253/0090
title: exact comoving Maxwell shell-to-flux and conserved finite-window source
route_verdicts:
  route_A:
    route: retarded frequency-domain outgoing identity
    verdict: established_for_prescribed_conserved_current
    strongest_result: >-
      For a net-neutral nonzero-frequency comoving current with the stated
      weighted trace regularity, the retarded Maxwell solution has exact mean
      outward power (pi/(2*epsilon_EM))*integral |Omega| delta(D_omega)
      |P_T J_hat|^2 dk.  The shell is smooth for every fixed subluminal margin,
      and coarea gives the exact sphere weight pi*|omega|^2/
      [4*epsilon_EM*(c_EM-sign(omega)c_g*n_z)^3].  The real-field phasor factor
      already includes the conjugate component.
  route_B:
    route: exactly conserved smooth switching and late free-field energy
    verdict: established_with_typed_plateau_hypotheses
    strongest_result: >-
      Because rho_hat_omega(0)=0, a Bogovskii/Hodge field K with div K=-rho
      gives the exact switched current a J+a_prime K.  Its late outgoing
      transverse free-field energy is an exact oscillator spectral norm.  For
      fixed smooth ramps, an integrable first moment of the resonant and
      conjugate pushforward correlations, integrable endpoint cross
      correlations, and finite endpoint energy, E_late(T)=T*P_out+O(1) with a
      T-independent explicit correlation bound; otherwise the exact spectral
      norm is retained.  Sharp switching is a separately typed weak limit
      with endpoint energy.  The comoving finite-volume balance uses
      (S-c_g*u_EM*e_z) dot n; its infinite-world-tube equivalence to the late
      field is open.
  route_C:
    route: reciprocal one-block amplitude conversion
    verdict: blocked_at_source_specific_reciprocal_Feshbach_closure
    strongest_result: >-
      If a reciprocal same-action amplitude equation exists and the unit-mode
      current radiates power P_out, then its amplitude decay rate is
      gamma_amp=P_out/(2*nu_phys*A_mode), while the fractional energy-decay
      rate is P_out/(nu_phys*A_mode).  The factor two and action-to-energy
      conversion are exact.  The actual Cao current trace, analytic
      continuation, real shift, and pole remain unconstructed.
