  - id: C-EUL-002
    statement: >-
      Conditional Q-omega gap protection. Let (u_h, mu, c) be a
      rows-met bordered state with symmetric positive 3x3 H-matrix
      budget Q(u_h), lam_h = lam_min(Q) > 0, and S1-gauged linearized
      step du. Let dQ_exact(e) = Q(u_h+e) - Q(u_h) through the same
      assembly pipeline. If condition C(e): max|eig(dQ_exact(e))| <=
      0.9 holds for the candidate error e = u* - u_h, then (Q
      symmetric, Weyl) |dlam| <= 0.9, protecting lam_h with margin >=
      x12 at lam_h ~ 11. Measured trigger: C fires at ||e||_oo ≲ 0.03
      (rho*, trust-r3 scale sweep 9.18/3.49/1.51/0.70/0.34 at scales
      1/.5/.25/.125/.0625; asymptotic slope 5.21 reproduces G1).
      Condition C is CURRENTLY UNSATISFIED (9.1-9.2 at full steps) —
      this is an unsatisfied conditional asset with a quantified,
      per-state-checkable trigger, not a closed bound. It promotes no
      member, lifts no deferral, and licenses no deflation or QOI use.
    provenance: proposals/P253-euler-particle-mechanisms/attempts/0125-beacon-condlemma/lemma.md
