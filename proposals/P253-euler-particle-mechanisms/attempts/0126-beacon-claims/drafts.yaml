claims:
  - id: C-EUL-001
    statement: >-
      State-error transport cannot protect the Q-omega witness gap from
      p=6 bordered-Newton Euler members at residual floor res >= 6.6e-3.
      Sharp linearized transport gives max|eig(dQ_lin)| = 5.21
      (trust-r3 state) / 4.16 (contour-fitted state) against gaps
      11.16 / 10.77 (margins x2.1/x2.6 — the charter gate <= 0.9
      fails on both), and exact nonlinear transfer gives |dQ| = 9.18 /
      9.10 ~ lambda_min at the full gauged Newton step. Mechanism:
      s^6 skirt-curvature plus free-boundary (src=0) motion under
      ||du||_oo ~ 0.2: the exact response is O(1)-nonsmooth while the
      linearized response is O(1)-smooth, so no estimate-side repair
      can close the gap. The res ~1e-2 floor is robust across three
      meshes (40x20 tensor, two contour-fitted refinement levels),
      P1/P2 discretizations (P2 residual only x1.16 smaller:
      quadrature under-integration excluded), and 140+ Newton plus
      gradient iterations from two warm starts. This does not close
      other member constructions, accuracy-free witnesses, or the
      conditional form of the bound (see C-EUL-002); it closes only
      state-error transport from members at or above this floor.
    provenance: proposals/P253-euler-particle-mechanisms/attempts/0124-beacon-sharp/nogo.md
