route_verdicts:
  smooth_global_operator:
    verdict: established_for_each_fixed_smooth_compact_gavrilov_member
    mechanism: >-
      The whole-space Leray linearization is a bounded shear perturbation of
      projected transport on L2 divergence-free velocity. Its group preserves
      the closed coadjoint-orbit tangent, and its physical graph domain is
      stated without replacing the flat-exterior maximal domain by H1.
  free_boundary_comparison:
    verdict: exact_domain_obstruction_identified_for_cao_zhan
    mechanism: >-
      The Cao vorticity jump turns normal interface displacement into a surface
      eta term. The global weak operator therefore contains the linked
      bulk/interface kinematic row, equivalently (delta J)dA, beyond the
      regular-core J Hess(A) formula.
  small_shell_kelvin_route:
    verdict: established_one_circuit_transient_amplification
    mechanism: >-
      On a concrete pressure plateau annulus, the small-shell limit is a
      solvable helical shear. The full Leray amplitude return is the
      symplectic nonsemisimple shear [[1,0],[-sqrt(2)pi,1]], giving squared
      energy gain 1+2pi^2 for the normal polarization. Coefficient continuity
      and a fixed-time WKB/Duhamel construction, applied after normalizing each
      packet by its exact Biot--Savart velocity norm, transfers a strict gain
      to exact finite-energy dynamically accessible solutions of each
      sufficiently small fixed compact Gavrilov member. The residual and
      Duhamel errors are relative O(N^-1) times the initial velocity norm.
  all_time_lp2_route:
    verdict: open_specific_skew_product_dependency
    mechanism: >-
      Physical twist transports later covectors between polarization fibres.
      A single-circuit gain does not decide repeated returns, spectral growth,
      or uniform boundedness; the full nonlocal skew-product cocycle remains.
strongest_exact_result:
  annulus: >-
    For any sufficiently small fixed sigma, 5sigma/4<=a<=7sigma/4 is a
    compact regular invariant annulus inside the W(a/sigma)=1 plateau of an
    exact smooth compact Gavrilov Euler field. Its exact period and measure are
    T(p)=oint r ds/|grad p| and dnu=T(p)dp dvartheta/(2pi).
  local_return: >-
    With X=r-R, Z=z and s=sqrt(X^2+Z^2), the leading actual carrier is
    u0=(R Z,(R/sqrt(2))s,-R X). Its full-pressure Kelvin polarization map over
    T0=2pi/R is M0=[[1,0],[-sqrt(2)pi,1]], while the cotangent map retains the
    radial-to-azimuthal shear and wave-covector transport.
  pde_bridge: >-
    For sufficiently small fixed sigma there are finite-energy axisymmetric
    initial data, normalized by their exact Biot--Savart velocity norm, in the
    exact coadjoint-orbit tangent, modulo the neutral axial translation, whose
    exact global linearized Euler solutions satisfy
    rho0||v(Tsigma)||2^2>(1+pi^2/2)rho0||v(0)||2^2; the continuum-transfer
    error is relative O(N^-1)||v(0)||2.
  weighted_symbol: >-
    In y=(eta/|k|,chi), the retained inverse-elliptic pressure/shear entries
    have product -2 xi b_xi k_z/(r^2|k|^2), so they remain order zero and are
    incorporated in the physical velocity cocycle rather than discarded.
  action_and_domain: >-
    The orbit quadratic action uses -Omega(q,qdot)/2-Q/2. The primary smooth
    carrier has no support interface; the Cao comparison requires its explicit
    surface displacement state and full J d2A+(delta J)dA linearization.
physical_interpretation:
  established: >-
    A same-family finite-j compact Euler carrier has a genuine, pressure-retaining,
    dynamically accessible transient lift-up mechanism in physical kinetic
    energy. This is stronger than the earlier raw Jordan-symbol observation.
  not_established: >-
    The one-circuit gain is neither a growing eigenmode nor an all-time
    instability theorem. It does not supply the LP2 stable-particle embedding.
