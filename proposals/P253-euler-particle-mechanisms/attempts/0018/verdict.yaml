units:
  A0013:
    disposition: established_at_exact_classical_map_scope
    route_verdicts:
      lamb_homogeneous_identities_and_defined_current: established
      nonzero_localized_compact_vorticity_lamb_charge: refuted_with_mechanism_named
      scalar_madelung_action_and_gradient_energy: established
      regular_scalar_phase_for_vortical_euler_carrier: refuted_with_mechanism_named
      local_normalized_spinor_euler_action: established
      unrestricted_flat_heaviside_schrodinger_transfer: refuted_with_mechanism_named
    strongest_positive_result: >-
      The exact Lamb identities and their defined conserved current, the scalar
      Madelung kinetic/action decomposition, and the regular local normalized
      spinor chart with the subtracted texture energy reproduce their stated
      classical equations. The spinor action executes a genuinely vortical
      Euler shear. A flat resting Heaviside interface has the exact nonzero
      residual -(kappa^2/2) delta-prime.
    mechanisms:
      lamb_charge: >-
        omega cross u vanishes on every enclosing surface outside compact
        vorticity, so the component integral of div(omega cross u) is zero.
      scalar_vorticity: a regular single scalar phase is locally curl-free
      heaviside: >-
        unrestricted distributional second differentiation retains a
        delta-prime double layer that the source's zero-normal-derivative test
        class suppresses.
    correction_required: false
    verification: symbolic_verified
    review: audited
    compatibility: native_or_scoped_extension
    epistemic: proposed
  B0017:
    disposition: established_initial_carrier_with_radial_relative_equilibrium_refuted
    route_verdicts:
      global_unit_spinor_and_hodge_corrected_initial_field: established
      smooth_compact_vorticity_and_finite_energy: established
      same_field_helicity_axial_moment_and_dipole_tail: established
      local_time_euler_and_global_spinor_lift: established
      stationary_radial_hopf_hodge_realization: refuted_with_mechanism_named
      uniformly_translating_radial_hopf_hodge_realization: refuted_with_mechanism_named
      nonlinear_persistence_or_stability: blocked_with_missing_construction
    strongest_positive_result: >-
      A smooth degree-minus-one unit-spinor profile, corrected by its exact
      decaying l=1 Hodge phase, gives one divergence-free Hs-for-all-finite-s
      finite-energy whole-space Euler datum with smooth compact vorticity,
      helicity -4*pi^2*kappa^2, finite positive axial angular momentum, and an
      exact r^-3 dipole exterior. Standard local Euler evolution admits a
      global-in-space transported spinor lift of that same solution.
    stationary_failure_mechanism: >-
      Angular swirl transport would require G=c*sin(F)^2 at the flat edge, but
      the full Hodge solution has G(b)=-C/(3b). In a translating frame Q(b)=0
      fixes U=-2*kappa*C/(3*b^3), after which Q'(b)=kappa*C/b^2 is nonzero,
      contradicting flat-edge matching.
    missing_stability_construction: >-
      A controlled same-leaf neighborhood and nonlinear
      persistence/modulation, recurrent-orbit, or suitable stationary-carrier
      theorem.
    correction_required: false
    verification: symbolic_verified
    review: audited
    compatibility: native_or_scoped_extension
    epistemic: proposed
