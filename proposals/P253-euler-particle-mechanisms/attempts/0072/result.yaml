scope:
  obligations: [P3, P5]
  object: degree-minus-two finite-energy Euler tail and Coulomb-power channel classification
route_verdicts:
  harmonic_classification:
    verdict: established_as_stated
    statement: >-
      A source-free degree-minus-two tail is the direct sum of zero-mean
      radial and toroidal l>=1 vector-spherical-harmonic sectors. The sole
      SO3-trivial polar tail q*x/r^3 carries flux 4*pi*q and cannot have a
      globally smooth divergence-free source-free core.
  translated_cross_kernel:
    verdict: established_as_stated
    statement: >-
      Every frozen harmonic has an explicit transverse |k|^-1 symbol and a
      complete d^-1 translated kinetic cross bilinear. The smooth oriented
      l=1 tail has positive like-sign coefficient
      2*pi*rho0[a.b+(a.n)(b.n)]/d and retains orientation. It is a
      repulsive-sign effective potential only conditionally on d being an
      admissible mechanical coordinate.
  isotropy_escapes:
    verdict: fixed_frame_channel_established_scalar_covariance_blocked
    statement: >-
      A constant-norm transverse symbol gives an exact single-velocity
      Gaussian-core interaction rho*q1*q2*erf(d/(2*sigma))/(4*pi*d), but it
      uses a fixed frame and a pi rotation flips its sign. Three l=1 basis
      tails superpose to one vector rather than three independent channels.
      Independent sectors, a physical frame lock, or an autonomous controlled
      orientation average remain executable added-mechanism routes.
  stationary_filter:
    verdict: minimal_positive_representatives_refuted_as_steady
    statement: >-
      Every nonzero radial/toroidal l=1 homogeneous combination fails the
      leading degree-minus-six steady Euler curl equation. The fixed-frame
      radial-form-factor realization has anisotropic integrated stress and
      violates the necessary stationary condition M=cI. Faster core
      corrections remain open but must satisfy both the isotropic-stress row
      and the higher-harmonic homogeneous leading filter.
  local_euler_persistence:
    verdict: established_conditionally_on_common_weighted_interval
    statement: >-
      For the declared weighted smooth class, u tensor u is integrable,
      pressure has first permitted r^-3 order, and u_t=O(r^-4). The complete
      r^-2 angular coefficient is therefore conserved by exact Euler on every
      common interval where that class holds. Propagation of the affine
      weighted class from initial data needs a separate renormalized pressure
      estimate and is not supplied by unweighted Hs well-posedness.
  asymptotic_magnitude_selection:
    verdict: continuous_not_selected
    statement: >-
      Exact Euler similarity sends the r^-2 coefficient to (A/B^2)V and its
      d^-1 cross coefficient to (A^2/B^4)C. Even when the weighted asymptotic
      datum is conserved, bare Euler topology and conservation do not select
      or quantize a universal nonzero magnitude.
  particle_consumption:
    verdict: blocked_on_persistent_carrier_and_finite_action
    statement: >-
      The tails overlap globally; ordinary angular momentum/KKS action and
      absolute vorticity impulse fail for the representative. No controlled
      persistent translated family, deformation/radiation estimate, or
      orientation-independent carrier observable has yet been constructed.
      Translating one overlapping noncompact summand is not a tangent of the
      standard identity-at-infinity compact-carrier coadjoint orbit.
strongest_exact_result: >-
  Bare incompressible Euler admits smooth finite-energy noncompact-vorticity
  data with an exact conserved oriented r^-2 asymptotic label on every common
  interval in the declared weighted class and a positive, decreasing d^-1
  kinetic cross energy. A locked fixed-frame texture even gives an exact isotropic
  regularized Coulomb autocorrelation. Source-free
  incompressibility removes the only SO3-trivial degree-minus-two polar tail,
  and rotating the fixed-frame texture changes its sign, so these exact
  channels carry orientation rather than scalar charge. They are real
  Coulomb-power candidates, not yet persistent particle interactions.
next_dependency: >-
  First invert the full vector-spherical-harmonic expansion of the fixed-frame
  symbol and test its degree-minus-two angular field against the exact sphere
  equations. A failure refutes that tail as steady and no faster core can
  repair its degree-minus-six residual. Only if it passes should a faster core
  be tuned to repair the global stress M=cI before solving the full steady
  gluing problem. Then construct a persistent same-family carrier plus a
  finite or renormalized KKS asymptotic phase space with an admissible relative
  translation, or add transported labels that canonically split the summands
  and derive their joint action. Execute an autonomous frame-lock or average
  if orientation is to be removed. In parallel retain the compact carrier and
  constrained U1 charged-carrier routes.
does_not_license:
  - scalar electric charge or P5 completion
  - force law without a controlled persistent moduli family
  - finite KKS spin action for the noncompact tail
  - strict causal cone, electron, neutrino, or parent completion
