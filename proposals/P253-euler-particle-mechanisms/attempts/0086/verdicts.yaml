strongest_exact_result: >-
  The final corrected 0085 construction has an exact positive subluminal
  Maxwell block and positive anisotropic H-minus-one charge Schur form, but
  every sufficiently small charged branch has infinite positive and infinite
  dynamically accessible negative Hessian index. Its full localized coupled
  generator has iR in the Fredholm essential spectrum, and a prescribed
  localized periodic source must obey the exact transverse dark-current
  condition on its real radiation shell.
remaining_dependency: >-
  Evaluate the shellwise transverse current of the actual 0079 crossing modes
  with physical KKS normalization, then construct the weighted
  limiting-absorption and Feshbach map needed to derive or refute a leakage
  coefficient. The reduced steady low block and a modulation theorem with
  outgoing radiation remain independent open constructions.
