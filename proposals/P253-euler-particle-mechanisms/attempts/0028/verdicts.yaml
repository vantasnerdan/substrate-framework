strongest_supported_statement: >-
  For every smooth nonnegative axial-vorticity profile w(r^2) that is constant
  and strictly positive near the axis and vanishes outside a finite radius,
  the resulting smooth pure-swirl Euler column has a positive first critical
  speed c0. For all c>c0 sufficiently close to c0, the full constant-density
  Euler equations on R3 admit a nonzero smooth axisymmetric traveling
  excitation of that same column. Its perturbation lies in every finite-order
  Sobolev space, has the exact irrotational same-fluid exterior, and has
  absolutely finite literal kinetic excess above the infinite-energy
  background. Its small amplitude is mu and its axial scale is the large
  solution of mu*L_mu^2=f0(R)^2*log(L_mu).
proof_components:
  euler_reduction:
    status: established
    scope: >-
      Exact Grad-Shafranov reconstruction with complete pressure, swirl label,
      translating-frame sign, density convention, and smooth pure-swirl
      background.
  critical_mode:
    status: established
    scope: >-
      Positive simple finite-interval weighted mode with lambda'(c0)>0 and a
      whole-space zero-frequency threshold resonance, not a full radial L2
      eigenstate.
  exterior:
    status: established
    scope: >-
      Exact decaying Bessel exterior, positive DtN/kinetic trace symbol,
      smooth velocity/pressure transmission, and no rigid wall or density
      interface.
  focusing_coefficient:
    status: established
    scope: >-
      Exact integration-by-parts identity gives beta>0 for every declared
      smooth nontrivial transition profile.
  operator_limit:
    status: established
    scope: >-
      Rank-one Schur inverse plus bounded, middle, and far Fourier-region
      estimates prove uniform H-to-V convergence of K_mu and its first
      kappa derivative to P0/(1+kappa^2).
  nonlinear_ift:
    status: established
    scope: >-
      Weighted C1 convergence of the full quadratic remainder and invertibility
      of the limiting derivative on the even translation-fixed space produce
      the exact one-sided branch.
  global_reconstruction:
    status: established
    scope: >-
      Five-dimensional axis conjugacy, elliptic bootstrapping, exact exterior
      transmission, and weighted L1/L2 control give Cartesian smoothness,
      localization, all finite Sobolev norms, and absolutely finite excess
      kinetic energy.
