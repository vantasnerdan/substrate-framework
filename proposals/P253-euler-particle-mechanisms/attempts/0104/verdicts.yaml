units:
  A_HF_source_and_smooth_center:
    verdict: established
    strongest_result: >-
      The source trace-free system eliminates to the stated Hill equation;
      the smooth-center first resonance yields forcing 15 Omega_c/128 and
      paired physical exponent delta |U_theta| 15/256 at first curvature
      order.
    boundary: >-
      The source post-equation-20 warning limits a nonreturned perturbative
      covector to saturation; repeated growth requires Unit B.
  B_exact_phase_and_return:
    verdict: established
    strongest_result: >-
      The globally single-valued integer-character phase
      d(F(P)+ell theta) is an exact first integral, returns its covector and
      frame, permits continuous detuning removal, and produces an exact
      reciprocal hyperbolic pair at g=0.
    charged_boundary: >-
      At nonzero small g continuity preserves a real hyperbolic pair and an
      expanding multiplier, but det M=1+O(g^4) does not prove exact
      reciprocity.
  C_finite_Cao_transfer:
    verdict: established
    scope: fixed_sufficiently_thin_member_compact_regular_orbit_tube
    strongest_result: >-
      Compact-interior normalized-profile convergence transfers the positive
      15-over-256 first-curvature coefficient without endpoint, collar,
      free-boundary or uniform-global-C1 inference.
  D_DA_tag_Gauss_packet:
    verdict: established
    strongest_result: >-
      The returned-phase displacement yields a complete linear
      vorticity/tag/Gauss packet, weakly null after graph normalization, in
      the nonempty weighted interval 1/2<sigma<3/2.
    boundary: raw_linear_tangent_not_every_fixed_nonlinear_leaf_row
  E_Maxwell_Egorov_lift:
    verdict: established
    strongest_result: >-
      Strict subluminality supplies the transverse Maxwell Sylvester gap;
      longitudinal Gauss reconstruction and localized Hodge/Leray/collar
      control give the fixed-time observed O(N^-1) Egorov remainder.
    boundary: no_growing_time_or_global_weight_propagation_claim
  F_fixed_observed_operator:
    verdict: established
    strongest_result: >-
      One fixed J_loc and c_obs independent of circuit count satisfy
      ||J_loc S_g(jT_*)||_ess >= c_obs lambda_+^j from the weighted global
      complete constrained graph input to the local same-Hs quotient output;
      only the tube and N0(j) may vary.
    boundary: no_unobserved_full_propagator_essential_norm_inference
  G_exact_leaf_path:
    verdict: blocked
    strongest_positive: >-
      The raw curve is exact for coadjoint/Kelvin-circulation data, tag
      distribution, charge, divergence constraints, difference Gauss law and
      zero monopole.
    missing_construction: >-
      The generic r^-3 Hodge velocity does not make total momentum a
