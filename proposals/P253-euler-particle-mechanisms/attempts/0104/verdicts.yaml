      construct carrier-specific compact generator witnesses and an
      invertible retained impulse/center/total-momentum row matrix including
      the Gauss-reconstructed electromagnetic contribution when applicable.
  H_fixed_delta_small_charge:
    verdict: established
    strongest_result: >-
      For every fixed sufficiently thin delta, signed
      0<|g|<g0(delta) preserving C_mon(delta)g^2<c_HF delta retains the real
      expanding multiplier and Unit-F linear observed essential-norm theorem.
    downstream_boundary: >-
