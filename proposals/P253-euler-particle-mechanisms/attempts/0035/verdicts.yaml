strongest_supported_statement: >-
  For the explicit smooth flat-core, compact-axial-vorticity pure-swirl
  column shared with the accepted 0027/0028 existence theorem: (i) the
  solitary translating energy-impulse-Casimir variation is exact on regular
  invertible-label patches and the corresponding compact-generator
  coadjoint-accessible tangents, and its accessible high-axial-frequency
  Hessian directions have both signs; (ii) the stationary column has a
  positive physical energy-Casimir form whose full-pressure axisymmetric
  linearization generates a unitary group on the weighted accessible
  column-energy completion; (iii) all nonzero axisymmetric phase speeds are
  strictly below c0 and all corresponding group-speed magnitudes are no
  larger than their phase speed, hence no larger than c0; and (iv) the
  explicit profile belongs to the global C_b^1 closure in Gallay--Smets
  arXiv:1805.05064v3, giving imaginary spectrum for every fixed integer m and
  fixed k nonzero in X_mk. None of these statements is stability of the
  nonzero solitary wave.
components:
  physical_action:
    status: established_after_bounded_correction
    scope: >-
      Physical 2*pi*rho_m normalization, translating sign, Casimirs,
      coadjoint tangent, regular-patch first/second variation, background
      convex inequality, and mixed-sign accessible Hessian are correct.
      Exterior criticality is orbitwise on compact-generator tangents, not an
      unrestricted pointwise or Frechet first variation.
  weighted_column_propagation:
    status: established
    scope: >-
      Exact two-sided unitary full-pressure m=0 evolution on the positive
      weighted accessible energy completion, retaining the flat-edge weight
      and poloidal Hodge exterior. This is not all axisymmetric unweighted L2
      data and not a nonaxisymmetric theorem.
  speed_ceiling:
    status: established
    scope: >-
      Exact phase bound from A_k>A_0 and exact group bound from the exterior
      envelope derivative and generalized-eigenpair differentiation. The
      Doppler lower bound is (c-c0)|k| and degenerates at k=0.
  compact_profile_transfer:
    status: established
    scope: >-
      Explicit strict approximants converge globally in C_b^1, so Remark 1.9
      of arXiv:1805.05064v3 applies mode by mode for k nonzero. The C2
      all-mode velocity-energy result of arXiv:1811.07584v2 is not transferred.
  nonlinear_background_bound:
    status: established_conditionally
    scope: >-
      Holds during classical axisymmetric evolution under 0<=xi<=L_infinity,
      convergent relative energy/Casimir integrals, and vanishing fluxes; it
      supplies neither global regularity nor solitary-wave stability.
