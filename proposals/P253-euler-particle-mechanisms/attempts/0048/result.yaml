route_verdicts:
  route_A_quantitative_nonresonance:
    verdict: established
    positive_result: >-
      On the exact compact-core DA energy/graph realization, physical
      normalization of the axisymmetric Kelvin modes gives full first-block
      coefficients O(k/n). The bending resonance occurs at
      n~1/(delta log(1/delta)); the curvature coupling is smaller than the
      local Kelvin spacing by O(1/log(1/delta)). Thus the four-coupling window
      contains at most one conjugate m=0 pair for small fixed delta. The bad
      subset of each dyadic delta shell has relative measure O(1/log(1/delta)).
    quantifiers: >-
      Any fixed azimuthal l>=2 and sufficiently small exact Cao member with
      integer profile exponent p>=3; the spectral projection may exchange one
      internal Kelvin pair as delta varies and is not uniform rank two.
  route_B_tame_infinite_block:
    verdict: established
    positive_result: >-
      The complete translation-to-axisymmetric coefficient sequence is in the
      weighted square-summable class O(delta^2/n). Away from the retained
      window its Schur tail is O(delta^3 log(1/delta)), one factor delta below
      the bending scale. The repeated linear block elimination loses one
      Kelvin weight and gains one delta, furnishing the tame linear
      complement through window exchanges.
    does_not_license: nonlinear_KAM_or_Nash_Moser_iteration
  route_C_exact_resonance:
    verdict: established
    positive_result: >-
      The m=0 Kelvin oscillator has positive constrained-energy signature, as
      does the l>=2 translation bending mode. The enlarged exact-resonance
      block is therefore positive definite for small delta and has an elliptic
      avoided crossing, not a Hamiltonian-Hopf quartet. Its KKS-normalized
      entries are obtained from the physical energy modes by the exact
      sqrt(frequency) conversion.
  cao_second_core_jet:
    verdict: established
    positive_result: >-
      Differentiating the exact Cao rescaled equation gives explicit odd first
      and even second Lane-Emden cell equations. Centering and limiting
      nondegeneracy invert both cells. Any centered fixed-circulation local
      delta^2 log(delta) profile cell is an even homogeneous kernel element
      and hence vanishes. The actual logarithm belongs to the whole-space
      Green/local-induction operator; subtracting it leaves an o(delta^2)
      graph remainder for integer p>=3.
  nonlinear_solid_torus_bridge:
    verdict: blocked_by_named_construction
    positive_result: >-
      The finite-window graph Riesz family supplies the kernel, KKS crossing,
      compact-core reconstruction, and linear complement required by the
      relative-equilibrium problem. The whole-space Leray product estimate,
      DA-compatible smoothing construction, and harmonic induction construct
      the same-leaf relative equilibrium expansion through every fixed order
      N<=p-2 satisfying N*l*|Omega_pattern|<Omega_core(a)/2. Any prescribed
      finite N can be reached by choosing the Cao polynomial exponent once
      before fixing the carrier; this is not an all-orders claim at finite p.
    missing_construction: >-
      At fixed nonzero delta, generated harmonics eventually meet genuine
      internal critical radii m*Omega(r)=j*l*Omega_pattern at
      j=Theta(1/(delta^2 log(1/delta))). Prove that every generated numerator
      is divisible by this transport factor on the fixed Cao leaf, or enlarge
      the streamline-vorticity unknown to solve the infinite range conditions;
      then prove convergence of the formal branch.
strongest_exact_result: >-
  The internal m=0 accumulation does not destroy the fixed-delta bending
  sector. Physical normalization forces its curvature coefficients to decay
  as O(k/n), making each resonant window finite and its bad-parameter measure
  asymptotically negligible. Exact resonances enlarge the positive KKS block
  by at most one conjugate Kelvin pair and remain elliptic. This replaces the
  invalid uniform rank-two reduction by a source-defined finite-delta graph
  Riesz family. The solid-torus equations can then be solved through every
  carrier-regularity-compatible preassigned finite order in the thin-core
  limit; exact fixed-delta convergence encounters an internal critical-layer
  range condition at harmonic order
  Theta(1/(delta^2 log(1/delta))).
