strongest_proposed_claim: Given a smooth nonnegative compact-transverse-support axial vorticity column,
  strictly positive and constant near the axis, there is a one-sided family of nontrivial smooth exact
  axisymmetric traveling Euler excitations for speeds just above the first critical speed. The velocity
  perturbation has finite Sobolev norms and absolutely finite kinetic excess above the same column, with
  an actual irrotational same-fluid exterior and no vessel wall.
evidence_scope: DIRECT_OPERATOR_AND_NONLINEAR_IMPLICIT_FUNCTION_EXISTENCE_PROOF
proof_boundary:
- Exact Grad-Shafranov linear/quadratic coefficients and smooth background labels.
- Actual exterior Bessel Dirichlet-to-Neumann map and kinetic trace form.
- Positive simple finite-interval threshold mode and strictly focusing projection.
- Full radial inverse including exterior trace; uniform multiplier and first-derivative limit.
- Weighted Sobolev nonlinear map, even homoclinic inverse and implicit-function perturbation.
- Smooth axis/exterior reconstruction and finite literal relative kinetic energy.
