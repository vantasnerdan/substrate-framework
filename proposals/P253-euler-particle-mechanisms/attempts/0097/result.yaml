attempt: P253/0097
title: Neutral chiral-current and flavor-propagation suppliers
route_verdicts:
  route_N0:
    route: passive transported tags as flavor states
    verdict: refuted_for_autonomous_flavor_oscillation
    strongest_result: >-
      Every finite passive-tag multiplet and every constant mixture is
      constant on each material trajectory. A time-dependent mixing frame
      inserts a pure-gauge connection unless a physical interaction and
      nontrivial curvature or holonomy are separately derived.
  route_N1a:
    route: Euler helicity as an axial continuity-current supplier
    verdict: established
    strongest_result: >-
      Smooth incompressible Euler obeys the exact local conservation law
      partial_t(u dot omega)+div[(u dot omega)u+
      (p-|u|^2/2)omega]=0, yielding a Galilean axial current.
  route_N1b:
    route: zeroth-order passive convective scalar or pseudoscalar tags as a derived chiral weak current
    verdict: refuted_at_zeroth_order_passive_convective_scope
    strongest_result: >-
      Scalar tags give polar convective currents and pseudoscalar tags give
      axial ones. Euler supplies no O(3)-covariant nonzero scalar-pseudoscalar
      lock, Lorentz spinor representation, one-handed projector, coefficient,
      or electron-current coupling.
  route_N1c:
    route: complete first-derivative local chiral-current classification
    verdict: blocked_at_invariant_tensor_and_continuity_exhaustion
    missing_construction: >-
      Classify gradient, cross-product, pressure-dependent, and identically
      conserved superpotential currents under the declared O(3), continuity,
      and boundary domains without treating absent P4 Lorentz structure as a
      refutation.
  route_N2a:
    route: momentum-dependent two-state flavor propagation algebra
    verdict: established_as_conditional_kinematics
    strongest_result: >-
      A Hermitian two-branch propagation matrix gives the exact fixed-momentum
      transition probability and packet coherence integral. If a shared
      action and relativistic dispersion are supplied, its high-momentum
      phase has the Delta(m^2)c^3 L/(2 E S_*) form.
  route_N2b:
    route: current Cao modes as a physical neutral flavor/mass mechanism
    verdict: blocked_at_shared_carrier_current_and_dispersion_construction
    missing_construction: >-
      Construct one neutral persistent P2 carrier, the shared P4 spin/action
      space, momentum-dependent branches with coherence control, and an
      electron-linked interaction current whose physical basis does not
      commute with propagation.
  route_N3:
    route: Euler-derived material holonomy or compact defect
    verdict: blocked_at_nontrivial_connection_and_same_action_coefficient
    missing_construction: >-
      Derive a non-flat material connection or finite-energy compact defect,
      its retained-state action and endpoint interaction frame from the same
      carrier.
  route_N4:
    route: declared chiral gauge extension
    verdict: blocked_at_joint_chiral_action_representation_and_same_carrier_map
    strongest_result: >-
      Its explicit input ledger defines a coherent candidate class. The gauge
      action, coupling, representation, mass data, anomaly conditions, and
      action normalization remain new inputs requiring foundational review.
evidence_scope:
  - exact_passive_tag_no_oscillation
  - exact_Euler_helicity_axial_current
  - zeroth_order_passive_convective_O3_polar_axial_classification
  - exact_conditional_two_state_packet_oscillation_ledger
  - exact_relativistic_phase_expansion_conditional_on_shared_action
strongest_exact_result: >-
  Passive material tags cannot autonomously oscillate, while Euler helicity
  supplies an exact conserved axial Galilean current. A physical chiral weak
  current still lacks a Lorentz spinor projector, coefficient, and electron
  link. Two-state propagation and coherence formulas are exact conditional
  kinematics, but current Cao modes do not yet supply the neutral persistent
  carrier, shared spin/action state, propagation dispersion, interaction
  basis, or derived mass/mixing matrix required by P6.
does_not_license:
  - a Lorentz chiral four-current
  - spin one-half or fermionic exchange
  - a derived weak gauge coupling or representation
  - a neutrino mass or mixing angle
  - a persistent neutral particle carrier
  - LP2, LP3, LP4, LP5, LP6, electron, neutrino, or parent completion
next_dependency: >-
  On one independently persistent neutral carrier, derive the shared P4
  spin/action representation, momentum-dependent propagation branches and
  packet coherence, and an electron-linked interaction current. Test a
  covariantly fixed noncommuting propagation/current pair. In parallel pursue
  a genuine non-flat material connection and keep any chiral gauge law as an
  explicitly priced foundational candidate.
parent_status: active
exhaustion_claimed: false
