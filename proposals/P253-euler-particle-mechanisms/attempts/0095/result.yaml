  - a conclusion when C_mon(delta)g^2 is comparable with or exceeds delta
  - charged Cao stability or instability at fixed non-small tau
  - a one-datum nonlinear escape theorem
  - refutation of weaker non-Lipschitz orbital persistence
  - a full nonlinear Euler-Maxwell invariant manifold
  - the fixed-member nonlinear uniform-Lipschitz refutation before exact fixed-row leaf completion
  - exact reciprocity of the nonzero-charge Floquet pair from det M equals 1 plus O(g^4)
  - a coercive full-three-dimensional Hill Hessian
  - complete-DA restoring control from the finite-angle K map alone
  - LP2, P4, electron, neutrino, quantum, or parent-campaign completion
