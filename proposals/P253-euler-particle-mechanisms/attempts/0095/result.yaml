strongest_exact_result: >-
  For every fixed sufficiently thin charged Cao member, sufficiently small
  signed nonzero charge preserving C_mon(delta)g^2<c_HF delta leaves an exact
  returned dynamically accessible real hyperbolic pair and expanding packet
  multiplier, without asserting exact charged reciprocity.  Its fixed observed-
  propagator J_loc S_g essential-norm lift from the weighted global
  complete-state domain to the local same-Hs output is established.  The raw
  coadjoint/tag/Gauss curve has the required tangent, but exact completion in
  the README's fixed-total-momentum leaf is missing, so the combined nonlinear
  uniform-Lipschitz refutation is blocked.  P2, the complementary charged
  regime, the Hill carrier, and the broader carrier search remain active.
