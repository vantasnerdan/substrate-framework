title: P2 carrier competition, Cao observed growth, and nonlinear leaf boundary
route_verdicts:
  route_A_small_charge_Cao:
    route: exact-return HF packet on a fixed charged Cao member
    verdict: blocked
    strongest_result: >-
      The exact first-integral phase d(F(P)+ell theta) removes the HF
      nonreturn saturation.  The paired 15/256 coefficient gives an exact
      reciprocal hyperbolic pair at g=0; for each fixed sufficiently thin
      carrier satisfying C_mon(delta)g^2<c_HF delta, continuity preserves a
      real hyperbolic pair and expanding multiplier at nonzero g, without an
      exact reciprocity claim.  A same-topology DA, tag, Gauss, and
      transverse-Maxwell packet yields an unbounded fixed-circuit
      essential-norm sequence for the fixed observed propagator J_loc S_g
      from the weighted global complete-state input to the local same-Hs
      output.  Units A--F are therefore established at author scope.
    missing_construction: >-
      The frozen README fixes total momentum, but P_tot is not continuous on
      the sigma<3/2 weighted topology because a generic r^-3 Hodge velocity
      tail need not be L1.  The raw coadjoint/tag/Gauss curve is exact for its
      automatic rows, but no relative-momentum domain or carrier-specific
      compact witness matrix with nonzero determinant has been constructed
      for the remaining fixed rows.  Hence the exact fixed-leaf curve and the
      combined nonlinear uniform-Lipschitz refutation are blocked.
    scope: >-
      For every fixed sufficiently thin delta there is g_0(delta)>0; the
      linear observed-propagator theorem is for 0<|g|<g_0(delta) under the
      displayed gap condition.  It is not a delta-uniform wedge, an exact
      fixed-leaf nonlinear refutation, or a one-datum escape theorem.
  route_A_complementary_charge:
    route: charged thin-ring/charged-column Hill reduction at tau=g^2
    verdict: blocked
    strongest_result: >-
      The stationary column Maxwell/radial equations, exact constrained 2x2
      slow block, tunable inertial resonance, first-curvature paired
      functional b(tau), and ordered second-harmonic coefficient at zeros are
      explicit.  Since b(0) is nonzero, any connected analytic charged-column
      cell has no first-harmonic zero for sufficiently small |tau|.
    missing_construction: >-
      Construct a delta-uniform charged Cao-to-column free-boundary branch and
      first curvature jet, or solve the charged-column constitutive/free-
      boundary problem directly with uniform return and graph remainder.  On
      that branch evaluate K(s,tau)=4 Z_tau R_tau/Omega_tau^2 over the whole
      regular core: Z_tau R_tau<0 is direct column hyperbolicity, while K>=1
      admits the first curvature resonance at |x|=1/sqrt(K), and any resonant
      point with b!=0 supplies a refutation mechanism.  A restoring candidate
      requires common positive-Krein signs and uniform constants kappa_0,eta>0
      with 0<kappa_0<=K<=1-eta on the declared core; pointwise 0<K<1 is not a
      uniform gap.  Evaluate b(s,tau) on the entire resonant set; isolated
      zeros do not establish P2.  Without
      this coverage, g^2/delta=O(1), fixed-tau members, and possible
      larger-tau zeros or stable windows remain undecided.
  route_B_constant_lambda_Beltrami:
    route: finite-energy whole-space constant-lambda Beltrami carrier
    verdict: refuted
    mechanism: >-
      Fourier support would lie on a measure-zero sphere, so every L2 field is
      zero; independently, I-alpha curl has both high-frequency helicity
      signs.
  route_B_Gavrilov:
    route: coercive constrained Hessian on the reviewed compact Gavrilov flow
    verdict: refuted
    mechanism: >-
      The reviewed accessible full-pressure hyperbolic cocycle and semigroup
      lower bound contradict uniform quotient control by a conserved coercive
      Hessian on that carrier.
  route_B_Hill:
    route: full-three-dimensional Hill patch coercivity
    verdict: blocked
    strongest_result: >-
      The exact DA tangent contains both interior vorticity stretching and an
      interface distribution, so a boundary-only VSH calculation is
      insufficient.  Choi supplies only the axisymmetric no-swirl theorem.
    missing_construction: >-
      Derive the complete bulk/interface/exterior Hodge constrained Hessian
      sector-by-sector after translation reduction.
  route_C_periodic_or_metastable:
    route: nonlinear periodic/localized energy-momentum or metastable carrier
    verdict: blocked
    missing_construction: >-
      Construct an actual autonomous periodic carrier and its open nonlinear
      tube.  Any finite-time bound remains below LP2.
