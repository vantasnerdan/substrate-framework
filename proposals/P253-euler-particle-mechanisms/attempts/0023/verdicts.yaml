strongest_supported_statement: >-
  For the Garcia-Hassainia-Hmidi axisymmetric no-swirl two-patch family at the
  exact v1 source quantifiers, the translating-frame labeled pair is a
  nonconstant closed critical loop of the correctly signed local KKS action.
  It is noncritical, hence nonmaximizing, for the autonomous E-cP on its
  labeled leaf; the raw full-loop action Hessian has both signs at arbitrarily
  high temporal frequency. The full formal Jacobi equation retains cross
  interaction and has independent phase and axial-translation periodic modes.
  The source planar filament/center return map, and only that map, has the
  exact period-twist Jordan chain at multiplier one.
component_results:
  source_pair_and_period:
    status: established
    scope: >-
      Global selected patch solution, periodic in the uniformly translating
      frame with physical period T/abs(log epsilon), for sufficiently small
      epsilon and lambda in the source Cantor/Borel set.
  autonomous_maximizer:
    status: refuted
    mechanism: >-
      D(E-cP)[delta_chi q] is minus the pairing of chi with the nonzero
      translating-frame state velocity, so the nonconstant orbit is not
      leafwise critical.
  corrected_local_kks_loop:
    status: established
    scope: >-
      Local/relative source-regular patch action with i_X Omega=dH and
      -dTheta=Omega; physical H, Omega, and action are the displayed normalized
      quantities multiplied by 2*pi*rho_m.
  raw_loop_action_maximum:
    status: refuted
    mechanism: >-
      Admissible real periodic variations on a non-stabilizer symplectic
      two-plane have opposite O(k) KKS kinetic terms while all fixed-spatial
      Hessian and frame terms remain O(1).
  jacobi_and_symmetry_modes:
    status: established
    scope: >-
      Exact full formal two-label linearization, KKS conservation on smooth
      solutions, and independent phase/translation periodic Jacobi fields;
      bounded full monodromy is not inherited.
  filament_period_twist:
    status: established
    scope: >-
      The source planar reduced system satisfies
      (M-I)v_lambda=-T'(lambda)v_phase with T'>0 for small epsilon, giving a
      genuine size-two unit-multiplier Jordan chain; no finite-core transfer.
