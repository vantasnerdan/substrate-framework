      together with action and endpoint interaction.
  C0_regular_Cao_density:
    verdict: established_zero_and_supplier_refuted
    strongest_result: >-
      With omega=r zeta e_theta=zeta partial_theta and an axisymmetric tag,
      q_E=zeta partial_theta chi=0 pointwise, so the regular convective current
      also vanishes on this geometry.
    boundary: carrier_and_tag_specific_not_a_universal_current_no_go
  C1_Cao_magnetization_superpotential:
    verdict: established
    strongest_result: >-
      The forced flux equals
      (g/rho_m)chi_c chi_c_prime grad Phi cross grad P and
      curl[(g Phi/(2 rho_m))grad(chi_c^2)], hence is an exact divergence-free
      toroidal superpotential current.
    boundary: actual_Cao_branch_nonvanishing_is_unproved_and_unclaimed
  D1_punctured_azimuthal_phase:
    verdict: established
