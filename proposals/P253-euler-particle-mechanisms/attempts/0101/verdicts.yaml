units:
  A0_unforced_Ertel_current:
    verdict: established
    strongest_result: >-
      For classical incompressible Euler and a transported true scalar,
      q_E=omega dot grad chi is a transported pseudoscalar and
      (q_E,q_E u) is an exact Galilean axial continuity current. Its global
      integral is the boundary flux of chi omega and vanishes when that flux
      vanishes.
    boundary: not_a_Lorentz_chiral_current_or_nonzero_regular_charge
  A1_forced_Ertel_flux:
    verdict: established
    strongest_result: >-
      D_t q_E=(curl f) dot grad chi=div(f cross grad chi), so the exact local
      conserved flux is q_E u-f cross grad chi, subject to the stated smooth
      and boundary domains.
  B0_closed_line_constant_lock:
    verdict: refuted
    scope: nonzero_real_constant_lock_on_a_nonzero_tagged_closed_vorticity_line
    mechanism: >-
      Single-valued return requires exp(integral lambda dtau)=1; for real
      lambda the loop integral is zero, excluding a nonzero constant while
      retaining variable zero-integral and other scoped candidates.
  B1_forced_lock_condition:
    verdict: established
    strongest_result: >-
      An imposed forced lock obeys
      chi D_t lambda=(curl f) dot grad chi, distinct from the unforced
      D_t lambda=0 condition on nonzero tag support and simultaneous with
      the closed-line monodromy constraint.
  B2_force_selected_lock:
    verdict: blocked
    missing_construction: >-
      A globally admissible force/coefficient solution satisfying zero-set,
