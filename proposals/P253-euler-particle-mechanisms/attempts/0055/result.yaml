route_verdicts:
  route_A_conserved_labels:
    verdict: refuted_for_universal_nonzero_action_selection
    mechanism: >-
      On bare fixed-density whole-space Euler, the exact similarity leaves
      every discrete topological class unchanged while scaling circulation by
      A/B and physical angular-momentum/KKS action by A/B^4. Fixed
      circulation, helicity, energy, or nonzero linear impulse leaves an
      explicit continuous action freedom. Prescribing J itself fixes J
      tautologically, and any prescribed invariant value is initial/boundary
      data rather than a universal dynamical selection mechanism.
  route_B_structured_band:
    verdict: viable_effective_route_exact_full_field_cone_refuted
    mechanism: >-
      In bare whole-space incompressible Euler, a compact smooth
      divergence-free swirl has a nonzero pressure quadrupole and nonzero
      Euler acceleration at arbitrarily large distance. A controlled spectral
      band may have bounded group velocity, but its complement and algebraic
      pressure/Hodge tails must remain explicit. Scale-breaking or hyperbolic
      environments lie outside this route verdict.
  route_C_foundation_extensions:
    verdict: conditional_candidates_established_with_input_ledger
    mechanism: >-
      A dimensionful action law can select integral symplectic areas but adds
      no causal speed. A hyperbolic substrate can add a characteristic speed
      but selects no action. A scale-setting environment can select a carrier
      scale but supplies discreteness or a cone only through its added
      structure. Multiplying a classical hyperbolic action by K scales its
      symplectic form and action periods without changing its equations or
      cone, proving that action normalization and characteristic speed are
      independent inputs at this level. No extension is adopted here.
strongest_exact_result: >-
  Bare fixed-density whole-space incompressible Euler cannot derive a
  universal nonzero action from topology or conserved non-action labels alone,
  because its exact similarity continuously rescales action within one
  topological class while preserving explicit such labels. Prescribing J
  itself fixes J but does not select its value dynamically. The bare
  whole-space theory also has no strict full-field finite propagation cone:
  the elliptic pressure of an explicit compact smooth swirl has a nonzero
  r^-3 quadrupole and r^-4 acceleration tail. Restricted carrier bands and
  scale-breaking environments remain positive routes at their stated scopes.
does_not_license:
  - LP4 or a physical quantum-statistical and relativistic bridge
  - a selected action unit, hbar, N=1, Born rule or reset
  - a strict or approximate carrier band without its spectral construction
  - a Lorentz cone for incompressible Euler
  - fermionic exchange, electron identity or neutrino identity
  - adoption of a foundational extension
next_dependency: >-
  Join one persistent carrier and physical positive doublet to an actual
  scale-selecting law, analyzer/first-exit dynamics, exchange realization,
  and a controlled finite-group-velocity band with quantified full-field
