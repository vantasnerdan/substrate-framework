koopman_representation:
  conditional_route_verdict: established
  evidence_scope: CONDITIONAL_CLASSICAL_KOOPMAN_REPRESENTATION
  hypotheses:
    - specified measurable Euler phase space Gamma
    - global measurable Euler flow Phi_t on Gamma
    - invariant probability measure mu
    - normalized L2 state
    - bounded multiplication observables or declared common domains
  established:
    - unitary Koopman group under the invariant-measure hypotheses
    - commuting classical physical multiplication observables
    - normalized expectation integral f times abs_psi_squared dmu
  actual_euler_measure_and_flow:
    route_verdict: blocked
    missing_construction: >-
      Construct the declared global invariant probability and global flow for
      the actual Euler carrier phase space.
  does_not_imply:
    - noncommutative measurement algebra
    - Born-rule or measure selection
    - quantum completion

kks_sphere_quantization:
  route_verdict: established
  evidence_scope: EXACT_POSITIVE_J_EULER_KKS_SPHERE_AND_CONDITIONAL_CP1_QUANTIZATION
  exact_normalization:
    angular_momentum: j times n
    kks_form: j sin(theta) dtheta wedge dphi
    symplectic_period: 4 pi j
    cern_integer: N equals 2j divided by hbar
    representation_dimension: N plus 1
    representation_spin: N divided by 2
  hypotheses:
    - j strictly greater than zero
    - N is a positive integer
    - ordinary holomorphic quantization with O(N) and no half-form shift
  euler_scaling: j maps to A times B^-4 times j
  selection_status:
    route_verdict: blocked
    missing_construction: >-
      Derive an action unit, integer N, polarization, and physical state
      selection from the Euler carrier rather than choosing them externally.

