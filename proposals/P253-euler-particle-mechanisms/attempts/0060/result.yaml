attempt: P253/0060
owner: root
scope:
  obligation: P4
  object: neutral compact-ring composite and controlled effective band
route_verdicts:
  exact_stationary_composite:
    verdict: established
    statement: >-
      A finite proper-rotation orbit of disjoint compact-velocity stationary
      Euler components is an exact stationary same-field composite with
      additive positive energy and material tags.
  static_pressure_multipole:
    verdict: refuted_as_coupling_mechanism
    mechanism: >-
      Each compact stationary velocity has constant exterior pressure, so all
      its pressure multipoles vanish. Translation and rotation preserve that
      exact cancellation. With physical pressure the virial identity is
      M_ik=-(delta_ik/rho_0) integral(p-p_infinity); equivalently it has no
      density factor for kinematic pressure. A nonzero r^-5 static coupling
      cannot be generated by assembling such components.
  octahedral_DA_tangent:
    verdict: conditional_candidate_blocked_by_nonzero_trivial_sector_tangent
    statement: >-
      The exact proper-octahedral projector applied to the fully translated
      first and second vorticity moments cancels the Hodge dipole and
      quadrupole, and conditionally yields velocity O(r^-5) and gradient
      O(r^-6) for a nonzero trivial-sector compact DA tangent. The six
      signed-axis sites are O/C4, so a generic nonzero seed can have zero C4
      average. The neutral cell remains a concrete candidate pending a proved
      nonzero C4-invariant seed, a free 24-site orbit, or a direct nonzero
      overlapping-stabilizer construction.
  direct_product_DA_geometry:
    verdict: established_on_componentwise_row_domain
    statement: >-
      Compact divergence-free generators supported inside each disjoint core
      and flat collar, with circulation, harmonic, centering and stabilizer
      rows imposed componentwise, assemble to an exact tangent of the product
      coadjoint leaf. Its KKS form is a direct sum. Whole-space Hodge/pressure
      and the kinetic Hessian retain cross terms, so this does not establish an
      invariant product dynamics.
  periodic_Bloch_band:
    verdict: blocked_by_invariant_mode_graph_coupling_and_complement
    statement: >-
      A scalar r^-5 tail has finite zeroth and first lattice moments. A C1
      Bloch generator additionally requires normalized invariant modes and a
      uniform r^-5 full pressure/Leray coupling from the physical graph domain,
      plus isolation and leakage control when Bloch phase breaks the within-cell
      symmetry. No accepted input supplies those operator-domain facts.
  isolated_scattering:
    verdict: blocked_by_persistence_and_symmetry_breaking_control
    statement: >-
      The protected linear moment sector has summable far coupling, but no
      nonlinear same-family theorem keeps an encounter inside that sector or
      controls restoration of lower multipoles.
strongest_exact_result: >-
  The exact translated proper-octahedral tensor projector cancels the Hodge
  dipole and quadrupole without signed weights and, for a nonzero
  trivial-sector compact DA tangent, gives an r^-5 velocity upper bound. The
  six-site O/C4 geometry does not itself prove that such a tangent is nonzero,
  so the neutral cell remains a candidate. Exact compact stationary pressure
  has no exterior multipole and cannot couple the cells. A physical band also
  requires an invariant positive mode, a uniform operator-domain r^-5
  pressure/Leray coupling, and its full Euler complement.
does_not_license:
  - an autonomous Euler Bloch band or bounded group velocity
  - a strict Lorentz cone
  - nonlinear composite persistence or scattering control
  - action selection, measurement, exchange or charge
  - electron, neutrino, P4 or parent completion
next_dependency: >-
  Exhibit a nonzero C4-invariant compact DA tangent on one axis component or
  implement the free 24-site orbit, with componentwise support, circulation,
  centering and harmonic rows. Then construct an actual positive internal mode
  and prove a uniform graph-domain r^-5 pressure/Leray coupling, an isolated
  full Euler Bloch Riesz family, and symmetry-breaking complement leakage.
parent_state: active
exhaustion_claimed: false
