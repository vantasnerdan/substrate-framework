route_verdicts:
  exact_stationary_composite:
    verdict: established
    statement: >-
      A finite proper-rotation orbit of disjoint compact-velocity stationary
      Euler components is an exact stationary same-field composite with
      additive positive energy and material tags.
  static_pressure_multipole:
    verdict: refuted_as_coupling_mechanism
    mechanism: >-
      Each compact stationary velocity has constant exterior pressure, so all
      its pressure multipoles vanish. Translation and rotation preserve that
      exact cancellation; a nonzero r^-5 static coupling cannot be generated
      by assembling such components.
  octahedral_DA_tangent:
    verdict: established
    statement: >-
      The physical proper-octahedral orbit of a nonzero compact-core DA
      tangent cancels the trace-free first vorticity moment and the
      symmetric-spatial-index second moment. The Hodge dipole and quadrupole
      vanish, while a rank-four cubic invariant can survive, yielding velocity
      O(r^-5) and gradient O(r^-6) in the protected trivial representation.
  periodic_Bloch_band:
    verdict: blocked_by_invariant_mode_and_complement
    statement: >-
      An r^-5 intercell kernel has finite zeroth and first lattice moments and
      conditionally gives a C1 Bloch generator and bounded group velocity.
      No accepted input supplies an autonomous positive invariant compact-cell
      mode, its isolation, or leakage control when Bloch phase breaks the
      within-cell symmetry.
  isolated_scattering:
    verdict: blocked_by_persistence_and_symmetry_breaking_control
    statement: >-
      The protected linear moment sector has summable far coupling, but no
      nonlinear same-family theorem keeps an encounter inside that sector or
      controls restoration of lower multipoles.
strongest_exact_result: >-
  A physical proper-octahedral orbit of compact-core dynamically accessible
  Euler tangents cancels the Hodge dipole and quadrupole without signed
  weights, giving an r^-5 velocity tail. This meets the finite
  first-spatial-moment lattice threshold. Exact compact stationary pressure
  itself has no exterior multipole and cannot couple the cells. A physical
  band remains conditional on an invariant positive cell mode and its full
  Euler complement.
