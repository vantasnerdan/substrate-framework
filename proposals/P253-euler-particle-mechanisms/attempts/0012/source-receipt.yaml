    audit_result:
      radius_hypothesis: no distinct-radius requirement; initially disjoint fixed center disks suffice
      intensity_scaling: integral omega_i dr dz equals a_i divided by abs(log epsilon)
      Linfinity_scaling: at most M divided by epsilon^2 abs(log epsilon)
      time_quantifier: a positive T_R independent of epsilon, dependent on the chosen coarse radius R
      support_result: complete support lies in radius-R disks around limiting translating centers
      equal_radius_identical_intensity: admissible because the two limiting velocities agree and axial separation stays fixed
      external_field: divergence-free, globally Lipschitz, with size and Lipschitz constant O(abs(log epsilon)^-1)
      all_time_result: false
    transfer_result:
      carrier: two axial translates of one Euler-scaled Cao polynomial-profile ring
      fixed_centers: same radius r0 and fixed axial separation
      scaling: >-
        u_AB(x,t)=A u_delta(Bx,ABt), B=r_delta/r0,
        rho=2 C_s delta/B, and A/B=a/(kappa abs(log rho))
      nearby_data: support-contained nonnegative rearrangements preserve circulation and relative-vorticity Linfinity
      verdict: exact source-admissible full-support control for a positive rho-independent interval
