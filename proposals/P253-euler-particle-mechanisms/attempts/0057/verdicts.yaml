    sign: negative_i_in_energy_normalized_complex_mode
  all_sector_complement:
    route_verdict: blocked
    positive_result: >-
      Scalar and sectorwise large-m, translation-gap, fixed-m form, and formal
      Schur scale calculations survive.
    missing_construction: >-
      GR: a coupled nonnormal all-sector X_* to D_* graph-resolvent/Grushin
      estimate with low modes, adjoint domains, global Hodge and pressure,
