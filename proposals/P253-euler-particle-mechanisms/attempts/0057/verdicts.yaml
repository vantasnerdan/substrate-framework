unit_B_0054:
  unit_verdict: blocked
  review_status: exact_local_and_shape_atoms_established_HJ2_blocked
  evidence_scope: EXACT_CELLS_POINTWISE_SHAPE_GEOMETRY_LERAY_ALGEBRA_AND_LIMITED_TRACE
  source_augmented_branch:
    route_verdict: blocked
    mechanism: >-
      Cao equation 3.36 is an auxiliary asymptotic parameter system, and
      Theorem 1.6 cannot construct or differentiate an absent augmented branch.
    missing_construction: >-
      An exact augmented steady map with domain, codomain, epsilon-q-tau
      restriction, Fredholm index, surjectivity, and parameter Schur bound.
  interface_and_common_DA_domain:
    route_verdict: blocked
    positive_result: >-
      For integer p at least 6, the base vorticity, its formal coefficient
      derivatives, and DA tangent have the limited zero-extension no-sheet
      property.
    missing_construction: >-
      Traces for A_delta eta, a frozen graph Sobolev interval, two-sided Hardy
      equivalence, closed common DA range, harmonic rows, and composite
      homogeneous or zero-moment Hodge bounds.
  whole_space_shape_and_leray:
    route_verdict: established
    positive_result: >-
      The first and second Piola-conjugated Biot-Savart shape identities,
      point-difference cancellation, toroidal distance and phase, and
      metric-Leray differentiation algebra are exact.
    boundary: >-
      Global operator and graph-norm differentiability and pressure-tail bounds
      are not established.
  front_side_remainder:
    route_verdict: blocked
    positive_result: scalar matched integral has size O(delta^3 L)
    missing_construction: >-
      Uniform anisotropic front, side, overlap, collar, axis and exterior symbol
      seminorm estimates on a declared Sobolev interval.
  two_index_commutator:
    route_verdict: refuted
    mechanism: >-
      Commutators with one Lambda control only a combined eigenvalue
      difference; m and radial-index changes can cancel, so product decay in
      both indices does not follow.
    next_route: >-
      Prove separate and mixed commutators or a direct two-dimensional
      summable bound with uniform eigenbasis constants.
  full_graph_riesz:
    route_verdict: blocked
    positive_result: >-
      Given HJ2 and GR, the Neumann resolvent and contour formulas imply the
      claimed graph-resolvent and Riesz estimates.
    missing_construction: HJ2 and GR

