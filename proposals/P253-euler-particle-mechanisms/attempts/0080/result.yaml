attempt: P253/0080
title: exact bordered Cao steady map and charged branch
route_verdicts:
  route_A:
    route: compact-source Green Fredholm and bordered blow-up
    verdict: established_as_stated
    strongest_result: >-
      On the globally zero-extendible even C^(2,alpha) compact-source space,
      the Cao Green map is compact through C^(4,alpha), and the normalized
      radial-cell complement has a uniform rescaled inverse. The exact
      Lane-Emden scaling and translation densities, physical circulation and
      centered impulse rows, and positive constant-linear affine matching
      matrix prove that the bordered derivative
      D_(zeta,mu,c)(F_0,kappa,I_z)=B_I is an index-zero isomorphism at the
      base. A second bordered derivative with circulation and first radial
      moment has its own nonzero limiting matrix and fixes the exact mean
      radius.
  route_B:
    route: sharp physical circulation-impulse Schur asymptotic
    verdict: blocked
    strongest_result: >-
      With dnu=r dr dz and I_z=pi rho_m integral r^2 zeta dnu, the
      source-derived leading triangular algebra is
      S_lead=-32*pi^3*rho_m*R^2/(3*L^2). Its exact finite-core sign still
      requires C1 estimates for the differentiated mass, local-Pohozaev,
      scale, center, interface, variance, and Green remainders, plus the LS
      kernel-to-sharp-Schur tangent identity. The projected-complement HSE is
      already established by the Q A Q isomorphism.
  route_C:
    route: direct augmented method repair
    verdict: established_as_stated
    strongest_result: >-
      The exact augmented bordered isomorphism proves the charged IFT using
      the established projected-complement HSE, without assuming invertibility
      of the full fixed-(mu,c) A_epsilon or the sharp two-by-two Schur coefficient. It
      uses the circulation-impulse border for the charged branch and a distinct
      circulation-mean-radius border for a local continuous uncharged path
      with epsilon_core external; quantitative delta coverage for the spectral
      IVT still requires a differentiated scale remainder or a uniform
      two-sided coverage estimate.
