strongest_exact_result: >-
  For every fixed p>=6 Cao core in an explicit nonempty thin-core and
  subluminal logarithmic window, the bordered derivative of the exact even
  steady Green map augmented by physical circulation and impulse is an
  isomorphism at the uncharged base. The C1 IFT consequently gives the tagged
  Euler-Maxwell map an exact local charged axisymmetric no-swirl relative-
  equilibrium branch with fluid, speed, and tag changes O(g^2) and
  finite-energy Maxwell fields O(g). The projected-complement HSE is
  established. Invertibility of the full fixed-(mu,c) A_epsilon and the sharp
  2x2 Schur coefficient remain open rather than being inferred from the
  bordered theorem or leading jet.
