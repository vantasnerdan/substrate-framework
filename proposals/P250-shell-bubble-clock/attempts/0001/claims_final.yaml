  - id: C-M5W-004
    statement: >-
      C-M5W-004 (symbolic_verified; Maxwell wall existence and exact crossing
      characterization): The rotating-frame slice potential V_omega has an
      interior clock-active minimum on the deep branch m = 0 exactly, whose
      depth crosses zero at the deep-branch crossing frequency omega_*^2:
      min V_omega = 0 exactly at omega^2 = omega_*^2, where a stationary
      planar wall exists - V_omega_* is nonnegative on the branch with two
      nondegenerate zeros (exterior vacuum and interior state; nondegeneracy
      certified), and the mechanical first integral supplies the kink with
      tension sigma_c = 2 int V_omega_c dx in (0, infinity), exactly the
      geodesic length 2 inf_path int sqrt(V_omega_c) ds_g. The global
      degenerate-depth value omega_c^2 := 2 inf V0/iota satisfies omega_c^2
      <= omega_*^2 definitionally (every realized ratio bounds the inf), and
      the exact rational witnesses pin the global value: V_omega at
      (m,c,b,f) = (0, 31/100, 13/20, 41/50) equals -13739/18750000 < 0 at
      omega^2 = 5/3 and -33854777/25000000 < 0 at omega^2 = 45/16, so
      omega_c^2 < 5/3 < 45/16 exactly; the accepted C-M5C-003 witness ratio
      is a strict upper bound, not the degenerate-depth value. On the deep
      branch the Maxwell system is the rational polynomial system pA = 8c^3
      - 3c^2 + (8b^2+1)c - 3b^2 = 0, pB = 2(8b^3 + 8bc^2 - 6bc - 2b
      omega^2 + 7b - 6f^2) = 0, pC = 2 V_omega = 0 with omega^2 = 32f^2 -
      12f + 6 - 24b, all derived from the canonical potential. Certified
      solution (interval arithmetic): exactly one real solution in the
      rational box of halfwidth 1e-12 around (c, b, f) =
      (0.30280764518677380369, 0.65773437772324925193,
      0.81436149699856776719) by the Krawczyk operator, with the fixed-omega
      Hessian strictly positive definite there (Gershgorin lower bounds
      8.17, 4.88, 13.13) and the crossing value enclosed by the K boxes as
      omega_*^2 in [1.6639457000591502988442, 1.6639457000591502988569].
      The identification omega_c^2 = omega_*^2 (the global inf attained at
      the deep branch) is the named SOS closing route and is not asserted.
