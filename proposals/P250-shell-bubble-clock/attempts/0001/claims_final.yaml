  - id: C-M5W-001
    statement: >-
      C-M5W-001 (symbolic_verified; exact wall-slice reduction and mechanical
      first integral): On the C-M5C-001 canonical action, every planar
      stationary wall of the diagonal S1 clock sector is carried, up to the
      exact orbit gauge, by the aligned real-psi slice S = diag(m, c+b, c-b),
      psi = f >= 0, with slice potential V_omega = V_M5 + 2c^2 + 2b^2 +
      6(b-f^2)^2 + W(f) - (omega^2/2)(f^2 + 4b^2), exact kinetic metric
      diag(1/4, 1/2, 1/2, 1/2) in (m, c, b, f), canonical inertia density
      f^2 + 4b^2, and Euler-Lagrange residuals 2K u'' = dV_omega/du. The
      mechanical quantity T - V_omega is exactly conserved along any
      stationary profile (d/dx(T - V_omega) = sum(2K u'' - dV_omega/du) u',
      identity verified in SymPy); at both wall ends it vanishes, so T =
      V_omega on any wall and the tension is sigma = int(T + V_omega) dx =
      2 int V_omega dx = 2 inf_path int sqrt(V_omega) ds_g over paths with
      metric K. The psi_I = 0 slice is exactly invariant (the psi_I equation
      is homogeneous with positive coefficient), and the shear and
      orientation directions have exact positive second variations
      2(8b^2-3b+8c^2-3c+4m^2-3m+1) and 48 b f^2.
