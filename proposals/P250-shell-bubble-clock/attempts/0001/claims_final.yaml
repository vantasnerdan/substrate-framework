  - id: C-M5W-002
    statement: >-
      C-M5W-002 (symbolic_verified; static-shell nonexistence and rotating
      necessity): At omega = 0 the C-M5C-001 potential has the exact
      decomposition V0 = V_M5 + axislock + phaselock + W with all four
      summands nonnegative and equality only at S = N N^T, psi = 0 (the
      unique vacuum; V_M5(-N N^T) = 2 exactly), so no clock-active interior
      bulk state exists at zero frequency for a shell to bound. A static
      radial shell is excluded exactly by the three-dimensional scaling
      residual T + 3U = 0 with T, U >= 0. Consequently the stationary
      degenerate shell of the canonical action exists only in the rotating
      (fixed-frequency) frame, where V_omega develops a clock-active
      interior minimum of negative depth. The planar vacuum-to-vacuum static
      homoclinic-loop question is left open as representation frontier; no
      claim of this campaign rests on it.
