  - id: C-M5W-003
    statement: >-
      C-M5W-003 (symbolic_verified; orbit-fixed locus and exact phase
      decoupling): The degenerate locus of the C-M5C-001 action - psi = 0
      with tangent-isotropic S - is fixed pointwise by the whole diagonal S1
      orbit (R(q) S R(q)^T = S and e^{iq} psi = psi hold exactly), and the
      canonical clock generator norm Tr[A,S]^2/2 + |psi|^2 vanishes there.
      The potential density, inertia density, velocity energy, and static
      gradient density are exactly orbit-invariant (SymPy identities). Hence
      a phase jump of any size at a locus point costs zero energy in H1: the
      uniform ramp bound L^2 (delta theta)^2 eps / 4 tends to zero, and the
      tensor-orientation jump is exactly free by orbit-fixation. Gluing two
      clock regions of arbitrary frequencies omega_1 and omega_2 through one
      static shell along the orbit-fixed locus therefore gives total energy
      exactly E_1 + E_2 + sigma_0 times the shell area for all times: the
      mismatch coefficient of (omega_1 - omega_2)^2 is exactly zero, with no
      bulk (volume or box) contribution, because each region's bulk solves
      the local field equations exactly by orbit invariance. The decoupling
      price is exactly the static shell tension of C-M5W-004.
    provenance: proposals/P250-shell-bubble-clock/proposal.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    exclusions:
      - >-
        The decoupling statement is an energy bookkeeping theorem for the
        glued configuration family; it does not assert dynamical stability
        of the two-frequency configuration or any wall-mediated force.
      - >-
        Spherical geometry inherits the area scaling at thin-shell leading
        order; curvature corrections are frontier.
    dependencies:
