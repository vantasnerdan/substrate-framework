  - id: C-M5W-005
    statement: >-
      C-M5W-005 (symbolic_verified; thin-wall bag selection, charge closure,
      and comparison): Within the reduced thin-wall family at fixed omega
      above the deep-branch crossing, the C-M5C-001 fixed-charge bag energy
      is E = 4 pi R^2 sigma(omega) - (4 pi/3) R^3 p(omega) + (omega^2/2) I
      with p(omega) = -min V_omega > 0; its exact stationarity in R is the
      volume-vs-surface law R = 2 sigma/p, the charge is Q = omega I with I
      = (4 pi/3) R^3 iota_int + 4 pi R^2 iota_wall, the envelope identity
      dE/dQ = omega holds exactly for any stationary family (general
      symbolic proof), and the interior inertia obeys iota_int = -2
      dV_min/d(omega^2) exactly. Limits: as omega^2 approaches the
      degenerate-depth crossing the pressure p tends to zero and R = 2
      sigma/p tends to infinity - the wall pushed to infinity with a
      quiescent ambient, which is exactly the accepted P249
      exterior-degenerate picture realized by C-M5C-003's hylomorphic
      family; the isofrequency-wall picture of Discussion #186 (degeneracy
      only on walls, ambient omega nonzero) is the same wall sector arranged
      between two ticking regions per C-M5W-003. Both pictures are therefore
      arrangements of one orbit-fixed-locus wall mechanism of the single
      canonical action - distinct in arrangement, not in mechanism - and no
      M5.32 equivalence is implied.
