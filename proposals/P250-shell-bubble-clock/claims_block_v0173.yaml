- id: C-M5W-008
  statement: >-
    C-M5W-008 (symbolic_verified; thin-wall bag stability split): Within the
    C-M5W-005 reduced thin-wall family at fixed omega, the radius-reduced bag
    energy F_omega(R) = 4 pi sigma(omega) R^2 - (4 pi/3) p(omega) R^3 has
    exact derivatives F' = 4 pi R (2 sigma - p R) and F'' = 8 pi (sigma
    - p R); hence at the stationary radius R_c = 2 sigma/p the second
    variation is F''_omega(R_c) = -8 pi sigma(omega) < 0 exactly, since
    sigma > 0. The fixed-omega bag is therefore a Morse-index-at-least-one
    saddle of the reduced radial problem - a critical nucleation bubble, not
    an energy minimum - closing the radial (volume-vs-surface) part of the
    linear-stability frontier named in C-M5W-005's exclusions. In the
    charge-constrained ensemble the same family is the constrained branch:
    Q(omega) = omega I(omega) with I > 0 (all slice inertia densities
    positive), and across the C-M5W-007 rungs R and Q decrease strictly as
    omega increases, so dQ/d omega < 0 (numeric ingredient certified in
    C-M5W-007), which by the constrained-variation argument in the
    Legendre/envelope scope of C-M5C-001 selects the fixed-charge constrained
    minimum branch in the reduced radial mode.
  provenance: proposals/P250-shell-bubble-clock/proposal.yaml
  verification: symbolic_verified
  review: unaudited
  compatibility: compatible_extension
  epistemic: proposed
  exclusions:
    - >-
      Reduced radial mode of the thin-wall family only: the full
      second-variation operator spectrum (shape modes, angular-momentum
      l-lift, thick-wall regime) is open frontier and is not asserted; that
      numerics was explicitly descoped by owner direction.
    - >-
      Fixed-charge stability is asserted as criterion satisfaction plus the
      reduced-mode constrained-variation argument, not as a diagonalized
      constrained Hessian.
    - >-
      No non-spherical, dynamical, or full-space (off-slice) stability
      statement is made.
  dependencies:
    - C-M5W-005
    - C-M5W-006
    - C-M5W-007
    - C-M5C-001
  evidence:
