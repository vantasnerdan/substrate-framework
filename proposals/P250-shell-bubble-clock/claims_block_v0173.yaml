- id: C-M5W-007
  statement: >-
    C-M5W-007 (numeric_evidence; rotating S1 bag family above the Maxwell
    frequency): For omega^2 = omega*^2 + delta with delta in
    {0.001, 0.002, ..., 0.007}, the C-M5C-001 fixed-charge bag problem on the
    C-M5W-001 slice admits stationary spherical wall-bag solutions,
    constructed by delta-continuation with kink-shape seeds and accepted by
    mesh stability of the extracted radius (|dR| <= 1.5e-3 R) together with
    the exact per-rung virial identity and channel monotonicity. Across the
    computed window the family follows the exact C-M5W-005 selection law
    R = 2 sigma_0/p(omega) with agreement chi = R_read/(2 sigma_0/p) tending
    to 1 monotonically as delta -> 0+ (|chi - 1| is consistent with a
    near-quadratic power law, log-log slope 1.72 across the window; chi =
    0.999562 at delta = 0.001 down to 0.987601 at delta = 0.007), the
    envelope identity dE/dQ = omega holds to <= 2.2e-4 relative at every
    finite-difference check across the family (delta = 0.002..0.006;
    truncation-limited), and the rung-1 bag energy matches the exact
    thin-wall critical value E_crit = (16 pi/3) sigma_0^3/p^2 formed at the
    rung's own pressure to 0.16%. The radius and charge decrease strictly as
    omega increases across the rungs, so dQ/d omega < 0 on the certified
    family.
