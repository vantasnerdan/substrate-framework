invariants:
  - >-
    The C-M5C-001 action is the only source of potentials, spectra, edges,
    frequencies, and tensions: no threshold is imported from M7, M5.32, or any
    other model.
  - >-
    Every wall-sector oracle is derived symbolically from the canonical
    potential, and every claimed gate carries a channel-local mutation check
    that must fail (the #190 defect class is excluded by construction).
  - >-
    The auxiliary frame stays a declared constrained quotient; the S1 clock
    action is a physical internal symmetry; the exterior vacuum is fixed
    pointwise.
  - >-
    Wall energetics come from wall-localized observables (profile functionals,
    surface-localized integrands), never from large bulk-subtraction.
  - >-
    Area versus volume discrimination is decided by exact locality of the
    energy density and the orbit-fixed locus, never by a box-averaged number
    alone.
  - >-
    C-M5C-001..004 accepted scopes bind every shell statement; C-M5S scopes
    only where consumed; immutable P239-P249 records are route evidence.
allowed_imports:
  - C-M5C-001, C-M5C-002, C-M5C-003, C-M5C-004 in their exact accepted scopes
  - >-
    standard real linear algebra, matrix and variational calculus, Noether
    theorem, ODE existence/monotonicity arguments, real-algebraic root
    isolation (Sturm), and declared SymPy methods
candidates:
  - id: WALL_ROTATING_MAXWELL
    description: >-
      The stationary degenerate wall as the exact kink of the rotating-frame
      slice functional V_omega at the Maxwell frequency where the interior
      minimum of V_omega reaches zero depth; tension from the exact
      mechanical/geodesic functional.
  - id: WALL_STATIC_PROFILE
    description: >-
      A static (omega = 0) finite-energy shell profile through the degenerate
      locus; tested and expected to fall to the exact co-conservation/
      Derrick-type obstruction, feeding the rotating candidate.
  - id: BAG_THIN_WALL
    description: >-
      The fixed-charge bag as the thin-wall stationary point of the reduced
      (R, omega) functional with exact Legendre closure; limits to the P249
      picture.
  - id: SLIP_LOCUS_DECOUPLING
    description: >-
      Phase decoupling through the orbit-fixed locus: exact zero mismatch
      bookkeeping for two ticking regions sharing one shell.
  - id: BUNDLE_DIRECTOR_CHART
    description: >-
      Bundle-aware director charts with n ~ -n through the locus as an
      alternate representation of the same wall sector; used to justify the
      orientation-jump bookkeeping, not to change the physics.
uniqueness_evidence: null
selection_criteria:
  - framework invariant compatibility (canonical action only, no imports)
  - exact analytic tractability before numerical conditioning
  - assumption and parameter economy (no new fields or thresholds)
  - correct limits to the accepted C-M5C sectors
  - downstream reach for the S4 comparison and the bag claims
claims_proposed:
  - C-M5W-001
  - C-M5W-002
  - C-M5W-003
  - C-M5W-004
  - C-M5W-005
comparators_blinded_until: >-
  There are no external comparators; every threshold is derived from the
  canonical action. The accepted witness ratio 45/16 and margin 19/16 are
  provenance cross-checks only and are never selection inputs. The exact
  Maxwell frequency is derived before any evaluation against the witness
  value, and the derivation uses only the action.
