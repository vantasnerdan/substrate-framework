[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "substrate-framework"
version = "0.0.0"
description = "Importable, claim-governed substrate physics framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "scipy>=1.12",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Documentation = "https://github.com/vantasnerdan/substrate-framework#readme"
Issues = "https://github.com/vantasnerdan/substrate-framework/issues"
Repository = "https://github.com/vantasnerdan/substrate-framework"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
