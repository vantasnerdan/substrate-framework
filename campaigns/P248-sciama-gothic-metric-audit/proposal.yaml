id: P248
base_release: v0.169.0
source_baseline: substrate-framework@443f1bd6edf0c1997f42b05c3b6719142e7a11c1
question: >-
  Which mathematical, variational, numerical, and physical claims in
  2026-08-29_sciama_gothic_metric_bottom_up_etherodynamics_v1.0.pdf survive
  purpose-aware clean-room reconstruction, and what minimal framework-native
  construction supplies the paper's full intended positive mechanism wherever
  its stated route fails?
source_inventory:
  - source: >-
      2026-08-29_sciama_gothic_metric_bottom_up_etherodynamics_v1.0.pdf,
      attached by vantasnerdan to canonical GitHub issue 184
    access: >-
      authoritative open issue attachment URL acquired only after the proposal
      and matching memory contract validated; local temporary source SHA-256
      cfbea3cdebc59da6fd898448cf04088c10b152abdb025702ce807e1c7f54ef89,
      405313 bytes, 18 pages
    extracted: >-
      all 18 pages, equations (1)-(66), the nine collected headline claims,
      five open-problem bullets, definitions, argumentative purposes,
      assumptions, inline numerical comparators, and 21 references; frozen as
      34 purpose-aware source units in evidence/claim-inventory.yaml
invariants:
  - every paper step is inventoried with both its proposition and its teleological role in the argument
  - exact identities numerical evidence empirical applicability and physical interpretation remain distinct layers
  - metric signature index placement density weight units dimensions field types domains and boundary data are explicit
  - diffeomorphism covariance Bianchi or Noether compatibility and stress-energy conservation are preserved when claimed
  - local constitutive statements are not silently promoted into nonlocal Machian or causal dynamical claims
  - comparator values and desired gravitational normalizations never enter a derivation or tolerance as hidden inputs
  - accepted framework claims remain authoritative inputs only at their exact registered scope and remain scientifically challengeable
allowed_imports:
  - the issue-184 PDF as a source object under audit and not as authority
  - SymPy for exact tensor algebra identities variations substitutions dimensions and limits
  - SciPy and substrate_framework.numerics for genuinely numerical roots integrals ODEs BVPs PDEs spectra and convergence evidence
  - Lean through the repository-pinned environment for finite exact propositions whose encoding and physical bridge can be audited
  - accepted C-GOR-001 and C-GOR-002 only at their registered Gordon-metric scopes after source verification
  - accepted C-IGR-001 through C-IGR-004 only at their registered induced-gravity scopes after source verification
  - accepted C-GRV-001 and C-GRV-002 only at their registered gravitational scopes after source verification
  - accepted C-M5S claims only when an explicit typed field action and coefficient map supplies the proposition used
candidates:
  - id: A
    description: >-
      Clean-room reconstruction of the paper's own gothic-metric and
      etherodynamic route from its declared definitions, with exact tensor and
      variational checks followed by only the numerical probes that remain
      analytically unresolved.
  - id: B
    description: >-
      Minimal covariant variational reconstruction: build the intended metric,
      source, conservation, and response chain from an explicit action and
      accepted framework primitives, adding only hypotheses forced by a named
      failure in candidate A.
  - id: C
    description: >-
      Causal constitutive or Green-function reconstruction of the Sciama-style
      mechanism, with the nonlocal kernel, source support, boundary condition,
      normalization, and local limit typed explicitly rather than inferred
      from dimensional or symbolic resemblance.
uniqueness_evidence: null
selection_criteria:
  - exact agreement between each frozen statement and its oracle obligation
  - compatibility with accepted invariants and typed dependency closure
  - correct signature dimensions index density symmetries conservation laws and limits
  - explanatory reach with the fewest new assumptions parameters and imported structures
  - causal and boundary-condition completeness for any nonlocal response
  - mutation sensitivity numerical convergence and independent rederivation where applicable
  - predictive content frozen before comparator inspection
  - reusable importable implementation and impact-bounded consumer compatibility
claims_proposed:
  - C-GOT-001
  - C-GOT-002
  - C-GOT-003
  - C-GOT-004
  - C-GOT-005
  - C-GOT-006
comparators_blinded_until: >-
  the source digest and complete purpose-aware claim inventory freeze every
  statement, dependency, domain, oracle, falsifier, and acceptance threshold;
  reported numbers, plots, and empirical comparisons may then be opened only
  as comparators for already specified constructions; exception recorded:
  source extraction necessarily exposed equations (26)-(28) inline before the
  unit-level numerical thresholds froze, so their checks use significant-digit
  rounding intervals derived from the printed precision rather than fitted
  tolerances
status: accepted
