- id: C-M5W-008
  statement: >-
    C-M5W-008 (symbolic_verified; thin-wall bag stability split): Within the
    C-M5W-005 reduced thin-wall family at fixed omega, the radius-reduced
    bag energy F_omega(R) = 4 pi sigma(omega) R^2 - (4 pi/3) p(omega) R^3
    has exact derivatives F' = 4 pi R (2 sigma - p R) and F'' = 8 pi
    (sigma - p R); hence at the stationary radius R_c = 2 sigma/p the
    second variation is F''_omega(R_c) = -8 pi sigma(omega) < 0 exactly,
    since sigma > 0. The fixed-omega bag is therefore a
    Morse-index-at-least-one saddle of the reduced radial problem - a
    critical nucleation bubble, not an energy minimum - closing the radial
    (volume-vs-surface) part of the linear-stability frontier named in
    C-M5W-005's exclusions. Further, along the stationary family the
    physical charge Q(omega) = omega I(omega) with I > 0 (the slice inertia
    density f^2 + 4b^2 is nonnegative and nonzero on any nontrivial bag;
    recorded interiors iota_B = 2.395 to 2.404), and across the C-M5W-007
    rungs R and Q_true decrease strictly as omega increases, so the family
    satisfies the dQ/d omega < 0 criterion (numeric ingredient, corrected
    normalization, certified in C-M5W-007), and the envelope identity
    dE_data/dQ = omega holds on the family by the chain rule on the
    accepted Legendre scope dE_w/d(omega) = -Q of C-M5C-001. A
    constrained-minimum conclusion for the fixed-charge ensemble is NOT
    asserted: C-M5C-001 supplies the Legendre reduction and envelope
    identity but no constrained radial Hessian theorem, and the exact
    second-variation calculation that would supply it is open frontier.
  provenance: proposals/P250-shell-bubble-clock/proposal.yaml
  verification: symbolic_verified
  review: unaudited
  compatibility: compatible_extension
  epistemic: proposed
  exclusions:
    - >-
      Reduced radial mode of the thin-wall family only: the full
      second-variation operator spectrum (shape modes, angular-momentum
      l-lift, thick-wall regime) is open frontier and is not asserted; that
      numerics was explicitly descoped by owner direction.
    - >-
      No fixed-charge constrained-minimum or constrained-Hessian conclusion
      is asserted: the fixed-charge statement is criterion satisfaction
      (dQ/d omega < 0 across the certified family) plus the exact envelope
      identity, nothing more.
    - >-
      No non-spherical, dynamical, or full-space (off-slice) stability
      statement is made.
  dependencies:
    - C-M5W-005
    - C-M5W-006
    - C-M5W-007
    - C-M5C-001
  evidence:
    - proposals/P250-shell-bubble-clock/attempts/0005/derivation.md
    - proposals/P250-shell-bubble-clock/attempts/0005/stability_check.py
    - proposals/P250-shell-bubble-clock/attempts/0005/run_stdout.txt
    - proposals/P250-shell-bubble-clock/attempts/0003/bag_results.json
    - proposals/P250-shell-bubble-clock/attempts/0005/bag_results_corrected.json
    - src/substrate_framework/m5_wall_clock.py
    - tests/test_m5_wall_clock.py
  assumptions:
    - >-
      Same reduced-family treatment of the wall as C-M5W-005: the wall enters
      through its tension and wall-inertia parameters, exact at leading order
      in wall thickness over R.
