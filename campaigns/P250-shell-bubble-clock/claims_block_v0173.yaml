- id: C-M5W-007
  statement: >-
    C-M5W-007 (numeric_evidence; rotating S1 bag family above the Maxwell
    frequency): For omega^2 = omega*^2 + delta with delta in
    {0.001, 0.002, ..., 0.007}, the C-M5C-001 fixed-charge bag problem on
    the C-M5W-001 slice admits stationary spherical wall-bag solutions,
    constructed by delta-continuation with kink-shape seeds and accepted by
    the predeclared production criteria: solver termination recorded per
    rung, mesh stability of the extracted radius (|dR_mesh| <= 1.5e-3
    R_read; largest observed 5.0e-4), and bounded residuals
    (res_rms 2.9e-5 to 2.0e-3). Across the computed window the family
    follows the exact C-M5W-005 selection law R = 2 sigma_0/p(omega) with
    agreement chi = R_read/(2 sigma_0/p) tending to 1 monotonically as
    delta -> 0+ (|chi - 1| is consistent with a near-quadratic power law,
    endpoint log-log slope 1.718 across the window; chi = 0.999562 at
    delta = 0.001 down to 0.987601 at delta = 0.007), the envelope identity
    dE/dQ = omega holds to <= 1.9e-4 relative at every finite-difference
    check across the family (delta = 0.002..0.006; truncation-limited)
    evaluated at the physical charge normalization Q = omega I, and the
    rung-1 bag energy matches the exact thin-wall critical value E_crit =
    (16 pi/3) sigma_0^3/p^2 formed at the rung's own pressure to 0.16%. The
    radius and the physical charge decrease strictly as omega increases
    across the rungs (Q_true from 2.3351e10 to 6.5152e7), so
    dQ/d omega < 0 on the certified family. The archived Q_trap column of
    attempts/0003/bag_results.json was formed as omega^2 times the inertia
    integral; the corrected columns Q_true = Q_trap/sqrt(w2), the corrected
    envelope, and their consequences live in
    attempts/0005/bag_results_corrected.json with the derivation recorded in
    attempts/0003/CORRECTIONS-2026-09-02.md.
  provenance: proposals/P250-shell-bubble-clock/proposal.yaml
  verification: numeric_evidence
  review: unaudited
  compatibility: compatible_extension
  epistemic: proposed
  exclusions:
    - >-
      Thin-wall window only: delta <= 0.007; thick bags (delta beyond the
