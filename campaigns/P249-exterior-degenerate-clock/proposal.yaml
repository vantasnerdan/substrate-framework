id: P249
schema_version: 2
base_release: v0.170.0
source_baseline: substrate-framework@443f1bd6edf0c1997f42b05c3b6719142e7a11c1
question: >-
  Can one explicitly declared local Lorentz-covariant M5 action carry a smooth,
  globally normalized compact SO(2) clock action that fixes the exterior vacuum,
  and do its complete fixed-J equations admit a finite-energy, finite-positive-
  inertia, nonzero-frequency, dynamically width-selected open-space stationary
  clock with action-specific asymptotic dynamics and physical stability?
candidate_universe:
  scope: >-
    All one-clock constructions within issue #189's declared local
    Lorentz-covariant M5 field/action boundary that can supply a normalized
    compact vacuum-fixing action, complete fixed-J relative equilibrium,
    intrinsic open-space localization, and a licensed stability statement.
    Two-clock forces, gravity continuation, and particle identifications are out
    of scope.
  frozen_from:
    - issue #189 positive objective and O1-O6 closure map
    - release v0.170.0 accepted C-M5S scopes and invariants
    - P239/P240/P244/P247 source inventory and recorded route mechanisms
    - Discussion #186 opening post and all comments/replies current at campaign freeze
    - requester direction to exhaust algebra and variational calculus before production numerics
  route_families:
    - exterior-degenerate spectral SO(2) clock
    - bundle-aware disclination-ring clock
    - auxiliary or gauged amplitude clock
    - non-spherical or core-selected continuation
    - M5.32 action-specific dynamics and minimal kinetic completion
  append_only_expansions:
    - >-
      After attempt 0001, A_EXTERIOR_DEGENERATE/noncommuting-core is explicit:
      the commuting one-profile split collapses, so a surviving core must add
      noncommuting spatial curvature/topology or a positive completion whose
      exact scaling prevents the diagnosed amplitude-width collapse.
    - >-
      After attempt 0002, the fixed-axis clock split is exact weight two with
      positive stiffness but zero quadratic kinetic metric. O3 therefore
      splits into an intrinsically nonlinear relative-equilibrium route and a
      minimal positive weight-two kinetic-completion route; importing a mass
      gap is excluded.
    - >-
      Attempt 0003 corrected the commuting collapse to remain on the simple
      timelike branch and proved incompatible scale/amplitude virials even
      with the historical positive auxiliary-axis lock. The live O3 routes
      must change to noncommuting static curvature or canonical auxiliary-
      amplitude volume inertia.
    - >-
      Before attempt 0004, the canonical auxiliary-amplitude seed is frozen as
      a complex Lorentz scalar psi with standard positive kinetic term and
      W(f)=3 f^2-6 f^4+4 f^6 for f=|psi|. Its normalized S1 phase, fixed-charge
      functional, exact existence/stability hypotheses, and natural tail are
      tested without numerics. This seed cannot earn O3 unless a same-action
      covariant bridge dynamically lifts the M5 core degeneracy and the full
      cross-sector variation closes.
    - >-
      Before attempt 0005, the covariant M5 bridge is frozen as one diagonal
      S1 action on a charge-one complex Lorentz scalar psi and the weight-two
      M5 tangent-traceless tensor B. A constrained covariantly constant
      oriented clock-plane spurion (A,H) supplies the equivariant map
      Q(psi)=Re(psi^2)H+Im(psi^2)K, K=(AH-HA)/2. The completed action adds
      positive canonical B kinetics and 6||B-Q(psi)||^2 to the reproduced P239
      action plus the attempt-0004 scalar sector. The coefficient 6, all
      normalizations, the unchanged B=psi=0 uniaxial sector, and the challenged
      clock-biaxial sector are frozen before the exact variational audit.
    - >-
      Attempt-0005 source audit found that merely adding canonical B kinetics
      would retain the P239 clock-plane curvature contribution
      64 int b^2|grad b|^2 in the charge-frequency Jacobian, contradicting the
      preregistered two-field inertia. Before evaluating the candidate, the
      action is repaired explicitly: replace only the A-directed orthogonal
      projection of the curvature two-form by the positive canonical B term,
      retain the orthogonal curvature sector, and keep the entire static
      potential unchanged. This is the declared minimal kinetic replacement,
      not an omitted term.
    - >-
      Attempt-0005's first exact pass exposed a coupled-theorem compactness gap:
      the attempt-0004 sextic is at the three-dimensional H1 endpoint, and its
      scalar truncation theorem does not automatically prove the two-field
      phase-locked hypothesis. Before awarding a verdict, replace only the
      coupled route's scalar potential by the subcritical C2 radial polynomial
      W(f)=3 f^2-4 f^3+2 f^4 for f=|psi|. Its positive square completion,
      binding witness, unsplit obstruction, and all variations are rederived;
      no prior passing tally is treated as candidate success.
    - >-
      The post-attempt-0005 O5 audit evaluated the first variation outside the
      reduced (f,b) ansatz and found dV/de_11=8 b^2 and dV/dt=-6 b^2 at
      S=diag(1,b,-b). Thus attempt 0005 is not a full M5 critical point and its
      provisional O3/O4 licenses are revoked. Attempt 0006 changes
      representation before any spectrum: all six projected-spatial symmetric
      M5 components vary with a positive canonical Cartan kinetic metric, the
      exact M5 projected Landau-de Gennes potential is retained, and the
      auxiliary frame removes only explicitly constrained nonphysical
      timelike/frame directions.
    - >-
      Independent review of attempt 0007 decomposed the complete conjugation
      generator and found a false-green O2-O5 chain: the axis--tangent shears
      (u,v) carry weight one, contribute u^2+v^2 to the Noether inertia, and at
      zeta=1/4 have mass square one. The true charged edge was one, below the
      39/16 witness. Attempt 0008 therefore retains the field content and exact
      M5/phase-lock potentials, raises only the positive axis-lock coefficient
      to the parameter-free unit value, includes the full generator norm, and
      applies the hylomorphic theorem on canonical H1 x L2 phase space.
obligation_graph:
  nodes:
    - id: O1
      positive_intent: >-
        Construct a smooth global compact SO(2) action with fixed period and
        generator normalization, pointwise exterior-vacuum fixation, action
        invariance, conserved Noether current, and a nondegenerate
        charge-frequency map.
      requires: []
      pass_licenses: [L-O1-CLOCK]
      does_not_license:
        - localized mode or stationary solution
        - nonlinear stability or particle interpretation
      maximum_verdict: ESTABLISHED_SYMMETRY
      failure_scope: the tested action, topology, generator, and chart construction only
      unlocks: [O2, O3]
      status: established
      license_chain:
        object: >-
          A smooth M5 field configuration space with an explicitly normalized
          global SO(2) action and exterior-degenerate vacuum orbit.
        symmetry_or_conservation: >-
          Exact group law, 2*pi period, vacuum fixed pointwise, action
          invariance, Noether identity, and regular Legendre map.
        ensemble: symmetry and fixed-charge eligibility, before fixed-J minimization
        variational_functional: the complete declared local Lorentz-covariant M5 action
        admissible_space: >-
          Smooth finite-energy fields in declared global charts or bundle data,
          with the full exterior and defect-core boundary conditions.
        representation_coverage: >-
          Full-field global construction for the selected route; reduced,
          weighted, tapered, or oriented-chart tangents are excluded unless a
          proved descent supplies the same action.
        observable: >-
          Group action, infinitesimal generator, exact action variation,
          Noether current, inertia form, and charge-frequency Jacobian.
        numerical_representation: >-
          None permitted for the load-bearing symmetry license; exact algebra,
          differential calculus, and symbolic regression only.
        permitted_verdict: ESTABLISHED_SYMMETRY
    - id: O2
      positive_intent: >-
        Derive the selected action's channel-resolved asymptotic principal
        symbol, kinetic metric rank/sign, positive physical subspace, and
        essential/radiation thresholds.
      requires: [L-O1-CLOCK]
      pass_licenses: [L-O2-ASYMPTOTIC]
      does_not_license:
        - nonlinear clock existence
        - fixed-J stationarity or stability
      maximum_verdict: ASYMPTOTIC_DYNAMICS_ESTABLISHED
      failure_scope: the tested action and complete linear representation only
      unlocks: [O5]
      status: established
      license_chain:
        object: the full unreduced second variation about the declared exterior vacuum
        symmetry_or_conservation: L-O1-CLOCK and the exact linearized constraint identities
        ensemble: linear dynamics on the physical positive-kinetic subspace
        variational_functional: second variation of the complete O1 action before background restrictions
        admissible_space: finite-energy perturbations modulo only proved gauge or symmetry directions
        representation_coverage: all action channels, constraints, degeneracies, and asymptotic directions
        observable: kinetic pencil, principal symbol, dispersion branches, and essential-spectrum edges
        numerical_representation: >-
          Exact matrix/polynomial derivation first; numerical roots or spectra
          only for irreducible algebraic quantities after exact rank/sign and
          branch structure are frozen.
        permitted_verdict: ASYMPTOTIC_DYNAMICS_ESTABLISHED
    - id: O3
      positive_intent: >-
        Derive and solve the complete fixed-J constrained equations while
        varying the field, core eigenvalue split, generator dependence, and
        inertia together, and establish dE/dJ = omega on a stationary branch.
      requires: [L-O1-CLOCK]
      pass_licenses: [L-O3-RELATIVE-EQUILIBRIUM]
      does_not_license:
        - open-space isolation
        - perturbative or nonlinear stability
      maximum_verdict: RELATIVE_EQUILIBRIUM_EXISTS
      failure_scope: the tested branch, ansatz, and representation only
      unlocks: [O4]
      status: established
      license_chain:
        object: a stationary relative equilibrium of the O1 compact action at fixed normalized J
        symmetry_or_conservation: L-O1-CLOCK
        ensemble: fixed J
        variational_functional: >-
          Complete Legendre-reduced fixed-J functional including field-dependent
          generator, inertia variation, DX terms, constraints, and rank-one
          second-variation contribution.
        admissible_space: the route's full declared smooth finite-energy configuration space and constrained tangent space
        representation_coverage: no post-processed static profile and no omitted zero-background Hessian blocks
        observable: Euler-Lagrange residual, forward state error, branch identity, E(J), and dE/dJ
        numerical_representation: >-
          Algebraic and variational derivation must close first. Any later BVP,
          PDE, or continuation solve uses crossed h by L refinement, independent
          boundary treatment, and conditioning-aware error budgets.
        permitted_verdict: RELATIVE_EQUILIBRIUM_EXISTS
    - id: O4
      positive_intent: >-
        Establish finite limiting energy and inertia, nonzero frequency,
        core-localized cumulative charge, dynamically selected box-independent
        width, and a natural unsupported open-space tail.
      requires: [L-O3-RELATIVE-EQUILIBRIUM]
      pass_licenses: [L-O4-ISOLATION]
      does_not_license:
        - full physical stability
        - two-clock force or particle identity
      maximum_verdict: ISOLATED_CLOCK_EXISTS
      failure_scope: the tested stationary branch and covered function space only
      unlocks: [O5]
      status: established
      license_chain:
        object: the O3 stationary fixed-J branch continued to open space
        symmetry_or_conservation: L-O1-CLOCK and L-O3-RELATIVE-EQUILIBRIUM
        ensemble: fixed J open-space stationary fields
        variational_functional: the unchanged complete O3 fixed-J functional
        admissible_space: natural finite-energy asymptotics without taper, wall, mask, or imposed core support
        representation_coverage: crossed domain, mesh, basis, and boundary treatments with branch fidelity
        observable: energy, inertia, omega, cumulative J, core width, virial closure, and action-derived tail
        numerical_representation: >-
          Crossed h by L design with observed-order extrapolation, held-out model
          comparison, independently implemented boundary/discretization route,
          compensated reductions, and a complete itemized error budget.
        permitted_verdict: ISOLATED_CLOCK_EXISTS
    - id: O5
      positive_intent: >-
        Establish the complete constrained spectrum and, where licensed by O2,
        absence of radiative growth for the declared perturbation class.
      requires: [L-O2-ASYMPTOTIC, L-O4-ISOLATION]
      pass_licenses: [L-O5-STABILITY]
      does_not_license:
        - electron, neutrino, de Broglie, gravity, or two-body interpretation
      maximum_verdict: STABLE_ISOLATED_CLOCK
      failure_scope: exactly the represented constrained tangent and dynamical space
      unlocks: [O6]
      status: established
      license_chain:
        object: full constrained first- and second-order dynamics about the O4 clock
        symmetry_or_conservation: O1 zero modes and O2 positive physical subspace
        ensemble: fixed-J constrained perturbations and released dynamics where licensed
        variational_functional: full O3 fixed-J Hessian and O1 action evolution equations
        admissible_space: all declared physical perturbations with explicit gauge/moduli removal
        representation_coverage: symmetry-breaking, radial, angular, constraint, and radiation channels declared by O2
        observable: Morse index, low spectrum, eigenvectors, flux, harmonic thresholds, and growth rates
        numerical_representation: >-
          Symmetrized operator; K-positive restriction; lambda_min/lambda_2,
          zero-mode scale, eigenpair residual, crossed h by L extrapolation,
          second discretization/boundary treatment, nonlinear perturbation check,
          deterministic evaluator noise and epsilon-jitter sign test.
        permitted_verdict: STABLE_ISOLATED_CLOCK
    - id: O6
      positive_intent: >-
        Extract reusable APIs/tests, review each proposed claim independently,
        replay affected consumers, promote accepted claims, pin a release,
        regenerate documentation and memory, and empty the in-boundary debt ledger.
      requires:
        - L-O1-CLOCK
        - L-O2-ASYMPTOTIC
        - L-O3-RELATIVE-EQUILIBRIUM
        - L-O4-ISOLATION
        - L-O5-STABILITY
      pass_licenses: [L-O6-PROMOTION]
      does_not_license:
        - excluded phenomenology or downstream two-clock/gravity programs
      maximum_verdict: CAMPAIGN_SUCCESS
      failure_scope: the frozen C-M5C claim transaction and affected consumers
      unlocks: []
      status: established
      license_chain:
        object: canonical importable implementation and accepted C-M5C claim transaction
        symmetry_or_conservation: all O1-O5 licenses
        ensemble: governance promotion boundary
        variational_functional: all promoted exact and numerical constructions at their stated scopes
        admissible_space: claim-by-claim reviewed scopes with explicit hypotheses and exclusions
        representation_coverage: impact-bounded direct and indirect consumers of changed claims and symbols
        observable: accepted registry, release closure, generated docs, durable memory, and validation receipt agreement
        numerical_representation: strongest practical oracle evidence already earned by O1-O5, without duplicate meta-validation
        permitted_verdict: CAMPAIGN_SUCCESS
