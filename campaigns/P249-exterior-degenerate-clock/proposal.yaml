invariants:
  - exact local Lorentz/index validity and declared M5 field types
  - globally normalized compact period rather than a rescalable weighted tangent
  - exterior vacuum fixed pointwise and defect core responsible for lifting the degeneracy
  - Hamiltonian boundedness and regular Legendre map
  - exact or explicitly challenged static 3x3 recovery
  - all action-specific thresholds derived from the selected action
  - no imported M7 0.786 threshold, fitted frequency, imposed localization, or post-processed fixed-J profile
  - accepted C-M5S scopes remain unchanged unless separately challenged with independent evidence
allowed_imports:
  - C-M5S-001 through C-M5S-020 only in their exact accepted scopes
  - reproduced and source-audited P239/P240 conditional APIs
  - P244 spectrum machinery only after its representation and floor assumptions are re-audited
  - P247 attempts as route evidence, never as universal one-clock no-go authority
  - standard real linear algebra, matrix calculus, variational calculus, Noether theorem, spectral theory, and declared SciPy/SymPy methods
candidates:
  - id: A_EXTERIOR_DEGENERATE
    description: >-
      A full-field spectral SO(2) conjugation action with two equal exterior
      eigenvalues and a dynamically lifted defect-core split; reconcile the
      P239/P240 reduced director-frame action with a global smooth action and
      exact Noether current.
  - id: B_BUNDLE_RING
    description: >-
      A compact clock action on the disclination-ring sector using explicit
      director n~-n charts, transition functions, and holonomy rather than an
      assumed global oriented generator.
  - id: C_AUXILIARY_GAUGED
    description: >-
      A single normalized phase whose amplitude or compensating connection
      vanishes in the vacuum, with every new field, redundancy, coupling, and
      Hamiltonian sign explicit.
  - id: D_NONSYMMETRIC_CORE
    description: >-
      A fixed-axis/non-spherical rotor or localized core/wall continuation in
      which the equations, not a mask or imposed wall, select the width.
  - id: E_M532_DYNAMICS
    description: >-
      Reproduce the certified M5.32 action and derive its exact asymptotic
      pencil; if the vacuum stabilizer or quadratic kinetic rank obstructs the
      direct clock, use a nonlinear-mode representation or the smallest
      covariant kinetic completion preserving the declared static sector.
uniqueness_evidence: null
selection_criteria:
  - exact Lorentz and index validity
  - global symmetry and topology with fixed compact period
  - Hamiltonian boundedness and regular Legendre map
  - exact or explicitly challenged static 3x3 recovery
  - natural exterior and dynamically selected width
  - assumption, field, and parameter economy
  - correct limits and compatibility with accepted sectors
  - analytic tractability before numerical conditioning and implementability
  - downstream explanatory and predictive reach
claims_proposed:
  - C-M5C-001
  - C-M5C-002
  - C-M5C-003
  - C-M5C-004
comparators_blinded_until: >-
  Issue #189 necessarily exposes historical values, so those are provenance
  references only. Published clock frequencies, de Broglie normalization, and
  the M7-derived 0.786 value remain excluded from derivation and selection until
  the action, group normalization, exact variations, asymptotic pencil,
  structural criteria, numerical observables, tolerances, and error budgets are
  frozen. The requester additionally requires exact algebra and calculus to be
  exhausted before production numerics.
