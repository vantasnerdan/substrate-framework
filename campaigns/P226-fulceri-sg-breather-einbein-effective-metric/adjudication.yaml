new_claim_candidates:
- id: C-IMP-001
  description: Impedance-matching identity rho*Theta = Z_0^2 = const under the constitutive map rho = rho_0*n, Theta = Theta_0/n.
    Algebraic identity only; the no-reflection propagation theorem is a separate deferred claim.
  gate: S7
  verifier: tests/test_substrate_metric.py::test_impedance_product_vanishes, test_impedance_product_residual_is_zero, test_impedance_product_under_n_mutation
  infrastructure: src/substrate_framework/substrate_metric.py (impedance_product, impedance_product_residual)
  promoted: false
- id: C-OG-006
  description: Flowing 1+1 effective metric g_tt = -c0^2/n + n V^2, g_tX = n V, g_XX = n with det = -c0^2, inverse, massless
    null constraint v = -V +/- c0/n, and lab-frame Christoffel symbols (derived via pseudo_riemannian.metric_christoffel_from_derivatives).
  gate: S3, S4, S5, S6, S8, S9, S10, S11, S12, S13
  verifier: tests/test_substrate_metric.py (13 mutation-sensitive gates)
  infrastructure: src/substrate_framework/substrate_metric.py (flowing_substrate_metric, flowing_metric_determinant, flowing_metric_inverse,
    flowing_metric_massless_speeds, flowing_metric_minkowski_limit, flowing_metric_static_limit, flowing_metric_ricci_scalar,
    flowing_christoffel_lab_frame)
  promoted: false
dropped_candidates:
- id: C-OG-007
  reason: Massless null constraint (v = V +/- c0/n) is a direct consequence of the C-OG-006 metric; recording as a standalone
    claim duplicates structure. The massless speeds are tested as verifier S9 (test_flowing_metric_massless_speeds_match_paper)
    and recorded in the consequences of C-OG-006.
- id: C-OG-008
  reason: Lab-frame Christoffel symbols follow from the C-OG-006 metric via the standard Levi-Civita connection. The new module
    delegates to pseudo_riemannian.metric_christoffel_from_derivatives so the connection is the single source of truth. The
    symbols are tested as verifier S12/S13 (test_flowing_christoffel_lab_frame_vanishes_in_minkowski_limit, test_flowing_christoffel_static_limit_recovers_optical_family)
    and recorded as consequences of C-OG-006.
- id: C-OG-009
  reason: Smooth M->0 limit is a textbook property of the einbein reparametrization (Polyakov 1987); the affine geodesic equation
    is identical in the massive and massless regimes, only the algebraic constraint changes. The same identity is already
    covered in tests/test_einbein_3plus1d_tutorial.py::test_eq057_060_massless_chain. Cite as a textbook property rather than
    accept as a new framework claim.
