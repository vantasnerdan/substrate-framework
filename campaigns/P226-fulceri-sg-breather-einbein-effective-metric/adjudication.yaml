summary: 'Attempt 0001 of the Fulceri (2026-08-14) breather-einbein review. After the overlap audit with already-merged harvest
  infrastructure, only two genuinely new candidate claims remain: C-OG-006 (flowing 1+1 effective metric) and C-IMP-001 (impedance-matching
  identity, algebraic only). C-OG-007, C-OG-008, and the smooth M-to-zero candidate are dropped as standalone claims; their
  content is moved to consequences of C-OG-006 or cited as textbook or already-accepted infrastructure. The einbein reparametrization,
  the static 1+1 optical metric, and the Levi-Civita connection are already covered by PR #41 (issue #40, P227), C-OG-001,
  and pseudo_riemannian.py; none is a new framework claim. The substrate_metric.py module delegates its Christoffel-symbols
  path to pseudo_riemannian.metric_christoffel_from_derivatives so the canonical connection machinery is the single source
  of truth. No new claim is accepted in attempt 0001; each candidate is recorded as a proposal for independent review.'
