  disposition: candidate_for_new_claim_C-OG-007
- paper_claim: gravitational_equiv_principle
  paper_text: Equivalence principle recovered as a theorem of continuum mechanics
  substrate_claim: None
  match_type: INTERPRETIVE (philosophical; not derivable; no clear pass/fail criterion)
  verifier: "N/A \u2014 interpretive claim outside the framework's exact-algebraic discipline"
