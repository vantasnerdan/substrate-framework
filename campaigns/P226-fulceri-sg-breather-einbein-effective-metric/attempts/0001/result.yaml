- paper_claim: constructive_relativity
  paper_text: Lorentz invariance is dynamical, not fundamental
  substrate_claim: None
  match_type: INTERPRETIVE (philosophical; not derivable; references Brown 2005, Bell 1976)
  verifier: "N/A \u2014 interpretive claim outside the framework's exact-algebraic discipline"
  disposition: out_of_scope_interpretive
- paper_claim: smooth_mass_zero_limit
