- paper_claim: christoffel_symbols
  paper_text: Six explicit Gamma^sigma_rho_nu of metric (69) in lab frame
  substrate_claim: C-OG-002 (only for TF n, V=0)
  match_type: EXTENSION
  verifier: 'sympy: compute Christoffel symbols from metric; cross-check with paper eqs (97-102)'
