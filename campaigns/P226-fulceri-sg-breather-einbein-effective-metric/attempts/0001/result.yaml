  paper_text: u(x,t) = 4 arctan(eta sin(omega t)/(omega cosh(eta x))) for 0<omega<1
  substrate_claim: C-SG-001
  match_type: 'EXACT (parameterization: alpha=omega, eta=sqrt(1-omega^2))'
  verifier: tests/test_sine_gordon.py + campaigns/P001-sine-gordon-root/verify.py
  disposition: matched_existing
- paper_claim: breather_energy
  paper_text: E0 = 16 (mu_0^2 c0/omega_0) sqrt(1-alpha^2)
  substrate_claim: C-SG-002 (dimensionless) + C-MED-003 (dimensional)
  match_type: EXACT (C-SG-002 dimensionless; C-MED-003 dimensional with the same coupling)
  verifier: tests/test_sine_gordon.py + tests/test_dimensional_sine_gordon.py
  disposition: matched_existing
- paper_claim: boosted_breather
  paper_text: Lorentz-boosted breather with gamma factor
  substrate_claim: C-SG-008
  match_type: EXACT
  verifier: tests/test_sine_gordon.py + campaigns/P012-boosted-breather-kinematics/verify.py
  disposition: matched_existing
- paper_claim: four_vector_dynamics
  paper_text: E = gamma E0, P = gamma E0 v
  substrate_claim: C-SG-008 (and C-SG-009 for moments)
  match_type: EXACT
  verifier: tests/test_sine_gordon.py
  disposition: matched_existing
- paper_claim: de_broglie_relation
  paper_text: P = hbar_eff k_dB, k_dB = omega_carrier v/c0^2
