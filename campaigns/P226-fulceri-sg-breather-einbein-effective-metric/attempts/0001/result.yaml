  substrate_claim: C-SG-013 (boundary sign correlation) + C-SG-015 (temporal trace)
  match_type: PARTIAL
  verifier: tests/test_sine_gordon.py
  disposition: matched_existing
- paper_claim: square_root_lagrangian
  paper_text: L = -E0 sqrt(1 - Xdot^2/c0^2) after collective coordinate reduction
  substrate_claim: None (collective-coordinate reduction is novel)
  match_type: NEW
  verifier: 'sympy: substitute breather ansatz into field action; integrate spatial; verify resulting L'
  disposition: candidate_for_new_campaign
- paper_claim: einbein_form
  paper_text: L = (1/(2e)) g_munu xdot^mu xdot^nu - e (M c0)^2/2
  substrate_claim: None
  match_type: TEXTBOOK (Polyakov 1987 string theory)
  verifier: 'sympy: substitute e = sqrt(-sigma)/(M c0); verify recovery of square root L'
  disposition: textbook_citation
- paper_claim: einbein_eom
  paper_text: E-L of einbein action = affine geodesic equation of g_munu
  substrate_claim: None
  match_type: TEXTBOOK
  verifier: 'sympy: derive E-L from einbein Lagrangian; show equivalence to geodesic equation'
  disposition: textbook_citation
- paper_claim: impedance_matching
  paper_text: rho*Theta = Z_0^2 = const forbids reflection; permits refraction
  substrate_claim: None directly (C-OG-001 uses n=1 implicitly via static refractive index)
  match_type: NEW
  verifier: 'sympy: confirm rho*Theta invariant under constitutive map'
  disposition: candidate_for_new_claim_C-IMP-001
- paper_claim: effective_metric_static
  paper_text: g = diag(-1/n, n/c0^2) for static n(x)
  substrate_claim: C-OG-001
  match_type: EXACT
  verifier: campaigns/P004-optical-dilaton/verify.py + tests/test_optical_geometry.py
  disposition: matched_existing
- paper_claim: effective_metric_flowing
  paper_text: g_tt = -c0^2/n + n V^2, g_tX = n V, g_XX = n
  substrate_claim: C-OG-001 (limit V=0, static)
  match_type: EXTENSION
  verifier: 'sympy: det g = -c0^2; V=0 limit recovers C-OG-001; n=1, V=0 limit Minkowski'
  disposition: candidate_for_new_claim_C-OG-006
- paper_claim: metric_to_minkowski_limit
  paper_text: n=1, V=0 -> Minkowski
  substrate_claim: C-OG-001 (in the n=1 limit)
  match_type: EXACT (limit)
  verifier: 'sympy: substitute n=1, V=0; verify metric = diag(-c0^2, 1)'
